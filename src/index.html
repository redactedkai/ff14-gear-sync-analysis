<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gear Sync Analysis</title>
<!-- the fonts load without blocking first paint: print-only until loaded, then for all media, so a stalled request
     cannot hold the page up; the system fallbacks in styles.css show until then (and without the request). No referrer:
     Google is not told which page asked -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@500;600&display=swap" media="print" onload="this.media='all'" referrerpolicy="no-referrer">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@500;600&display=swap" referrerpolicy="no-referrer"></noscript>
<!-- STYLES -->
</head>
<body>
<!-- Number boxes bound to a setting use x-bind="$num(path, lo, hi, options)" (helpers.js numberField). The gear
     filters and the Target GCD take any number from 0 up, as typed: a minimum above every item level is a filter
     nothing passes, and the page says so; restoreState holds a saved one to the real range.
     Dynamic <select>s render options with x-for and mark the current one with :selected (x-model on a select
     whose options are created by x-for can miss the initial value). -->
<div class="wrap" x-data="page">
<header>
  <h1>Gear Sync Analysis<!-- BUILD_BADGE --></h1>
  <p class="lede">See what item level sync does to your gear, and find the gear combination that gets you the most of the stat you want, for any job.</p>
</header>

<section class="panel" aria-label="Job and sync settings" x-data="settings" :data-job="$store.app.job || ''">
  <div class="settings">
    <div class="f jobpick">
      <div class="row"><span id="job-label">Job: <b id="job-name" x-text="$store.app.job ? jobCtx.jobName : 'none chosen'"></b></span><span style="flex:1"></span><button class="chip" id="reset" type="button" @click="requestReset()">Reset to defaults</button></div>
      <div class="jobrows" role="radiogroup" aria-labelledby="job-label">
        <template x-for="row in jobRows" :key="row.label">
          <div class="jobrow" role="group" :aria-label="row.label">
            <span class="jobrow-label" x-text="row.label"></span>
            <div class="jobicons">
            <template x-for="j in row.jobs" :key="j.id">
              <button type="button" class="jobbtn" role="radio" :data-job-id="j.id" :title="j.name" :aria-label="j.name"
                :aria-checked="String(j.id === $store.app.job)" @click="requestJob(j.id)"><img :src="j.icon" alt="" width="40" height="40"></button>
            </template>
            </div>
          </div>
        </template>
      </div>
    </div>
    <label class="f"><span>Synced level <span class="f-range" id="level-range" x-text="`1–${$store.app.jobCtx.maxLevel}`"></span></span>
      <input type="number" id="level" min="1" :max="$store.app.jobCtx.maxLevel" step="1" inputmode="numeric" x-bind="$num('level', 1, () => $store.app.jobCtx.maxLevel, { live: true })">
    </label>
    <div class="f field"><label for="cap">Synced item level <span class="f-range" id="cap-range" x-text="`1–${$store.app.maxReal}`"></span></label>
      <input type="number" id="cap" x-ref="cap" :disabled="!$store.app.sync" min="1" :max="$store.app.maxReal" step="1" inputmode="numeric"
        x-bind="$num('cap', 1, Infinity, { snap: false })" @input="onCapInput($event.target.value)" :class="{ invalid: !!capError, lowered: !!capLoweredNote }" :aria-invalid="String(!!capError)" aria-describedby="cap-error cap-lowered">
      <span class="field-error" id="cap-error" x-show="capError" x-text="capError"></span>
      <span class="field-note lowered" id="cap-lowered" x-show="capLoweredNote" x-text="capLoweredNote" aria-live="polite"></span>
    </div>
    <label class="f">Item level sync
      <span class="toggle"><input type="checkbox" role="switch" class="switch" id="sync" x-model="$store.app.sync"><span x-text="$store.app.sync ? 'On' : 'Off'"></span></span>
    </label>
  </div>
</section>

<template x-if="!$store.app.job"><div class="panel empty" id="no-job">Choose a job above to find its best gear.</div></template>
<template x-if="$store.app.job"><div style="display:contents">
<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="opt" type="button" :aria-selected="String($store.app.tab === 'opt')" @click="$store.app.showTab('opt')">Gear optimizer</button>
  <button role="tab" data-tab="browse" type="button" :aria-selected="String($store.app.tab === 'browse')" @click="$store.app.showTab('browse')">Gear browser</button>
  <button role="tab" data-tab="math" type="button" class="aside" :aria-selected="String($store.app.tab === 'math')" @click="$store.app.showTab('math')">How the math works</button>
</nav>

<!-- THE MATH: what sync does to one piece (Piece stats) and to a full set's GCD (GCD), and the substats' tiers (Substat tiers);
     controls in a sticky bar, each shown on the sub-tabs it applies to -->
<section class="tab" id="tab-math" role="tabpanel" hidden :hidden="$store.app.tab !== 'math'" x-data="syncExplainer" @keydown.escape.window="helpOpen = false">
<div class="mathbar" id="m-bar">
  <nav class="subtabs" aria-label="Math views">
    <button data-sub="piece" type="button" :aria-pressed="String($store.app.mathTab === 'piece')" @click="$store.app.showSub('piece')">Piece stats</button>
    <button data-sub="gcd" type="button" :aria-pressed="String($store.app.mathTab === 'gcd')" @click="$store.app.showSub('gcd')">GCD</button>
    <button data-sub="tiers" type="button" :aria-pressed="String($store.app.mathTab === 'tiers')" @click="$store.app.showSub('tiers')">Substat tiers</button>
  </nav>
  <label class="mctl" x-show="$store.app.mathTab === 'piece'">Slot
    <select id="p-slot" @change="$store.app.piece.slot = $event.target.value">
      <template x-for="o in slotOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === $store.app.piece.slot"></option></template>
    </select>
  </label>
  <label class="mctl" x-show="$store.app.mathTab === 'piece'">1st substat
    <select id="p-s1" @change="setSub(0, $event.target.value)">
      <template x-for="o in substatOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === $store.app.piece.subs[0]"></option></template>
    </select>
  </label>
  <label class="mctl" x-show="$store.app.mathTab === 'piece'">2nd substat
    <select id="p-s2" @change="setSub(1, $event.target.value)">
      <template x-for="o in substat2Options" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === ($store.app.piece.subs[1] || '')"></option></template>
    </select>
  </label>
  <div class="helpwrap" x-show="$store.app.mathTab === 'piece'">
    <button type="button" class="help" id="m-help" :aria-expanded="String(helpOpen)" aria-controls="m-help-pop" title="How sync works" @click.stop="helpOpen = !helpOpen">?</button>
    <div class="backdrop" x-show="helpOpen" @click="helpOpen = false"></div>
    <div class="popover" id="m-help-pop" role="dialog" aria-label="How sync works" x-show="helpOpen" @click.outside="helpOpen = false">
      <h2>How sync works</h2>
      <ul class="facts">
        <li><b>Sync caps stats instead of scaling gear down.</b> A stat above its slot’s cap drops to the cap. A stat below the cap stays the same. (For the main stat and Vitality this is a guess; the Wiki covers substats only.)</li>
        <li><b>A piece at or below the synced item level</b> is untouched and keeps its materia.</li>
        <li><b>A piece above the synced item level</b> loses all its materia.</li>
        <li><b>Both substats on a piece have the same cap.</b> The 70% substat reaches the cap when the piece is about 120 item levels above the synced item level.</li>
        <li><b>Overgeared or melded depends on the gap.</b> From about 95 item levels above the synced item level, overgeared gear has more substat points than melded gear at the synced item level. Below that gap, the melded gear has more.
          <ul><li>At levels 50 and 60, where materia adds little, the gap is much smaller.</li></ul>
        </li>
        <li><b>Every job gets the same caps.</b> Only Vitality on healer and caster gear is lower (90%).</li>
        <li><b>Level sync</b> lowers your character level. <b>Item level sync</b> caps your gear’s item level. A duty can use both; the item level cap wins.</li>
      </ul>
      <p class="small dim">Sources: FFXIV Wiki, <a href="https://ffxiv.consolegameswiki.com/wiki/Item_Level" target="_blank" rel="noopener">Item Level</a> and <a href="https://ffxiv.consolegameswiki.com/wiki/Level_Sync" target="_blank" rel="noopener">Level Sync</a>; game data from <a href="https://github.com/xivapi/ffxiv-datamining" target="_blank" rel="noopener">ffxiv-datamining</a>.</p>
    </div>
  </div>
  <div class="ilctl small" x-show="$store.app.mathTab === 'piece'">
    <label for="p-range">Gear item level</label>
    <span class="bound" x-text="ilvlRange[0]" :title="ilvlNote"></span>
    <input type="range" id="p-range" :min="ilvlRange[0]" :max="ilvlRange[1]" step="1" :value="il" :style="`--fill: ${ilvlFill}%`" :title="ilvlNote" @input="setIlvl($event.target.value)">
    <span class="bound" x-text="ilvlRange[1]" :title="ilvlNote"></span>
    <input type="number" id="p-ilvl" :min="ilvlRange[0]" :max="ilvlRange[1]" step="1" inputmode="numeric" :value="il" aria-label="Gear item level" @change="setIlvl($event.target.value)">
    <button type="button" class="chip" id="p-ilvl-reset" @click="resetIlvl()">Reset</button>
  </div>
  <!-- GCD: its own level, haste and speed ($store.app.gcd), whatever the job and sync -->
  <template x-if="$store.app.mathTab === 'gcd'"><div style="display:contents" x-data="gcdControls">
  <label class="mctl">Level
    <input type="number" id="g-level" class="tlevel" min="1" :max="gcdLevels" step="1" inputmode="numeric" :value="level" aria-label="Level of the GCD tab" :class="{ invalid: !!levelError }" :title="levelError || levelNote" :aria-invalid="String(!!levelError)" @input="typeLevel($el)" @change="typeLevel($el, true)">
    <span class="f-range" x-text="`1–${gcdLevels}`"></span>
  </label>
  <label class="mctl">Haste
    <select id="g-haste" @change="$store.app.gcd.haste = $event.target.value">
      <template x-for="o in hasteOptions" :key="o.value"><option :value="o.value" x-text="o.label" :selected="o.value === $store.app.gcd.haste"></option></template>
    </select>
  </label>
  <div class="ilctl small">
    <label for="g-range">Speed (base + gear + food)</label>
    <span class="bound" x-text="speedRange.base"></span>
    <input type="range" id="g-range" :min="speedRange.base" :max="speedRange.most" step="1" :value="speed" :style="`--fill: ${speedFill}%`" :title="`From the base at level ${level} to the most any job and sync can have there: the best gear with melds, and the best HQ meal`" @input="slide($event.target.value)">
    <span class="bound" id="g-most" x-text="speedRange.most" :title="`The most speed any job and sync can have at level ${level}`"></span>
    <input type="number" id="g-speed" :min="speedRange.base" :max="speedRange.most" step="1" inputmode="numeric" :value="speed" aria-label="Speed (base + gear + food)" @input="typeSpeed($el)" @change="typeSpeed($el, true)">
    <button type="button" class="chip" id="g-reset" @click="resetSpeed()">Reset</button>
  </div>
  </div></template>
  <!-- TIERS: its own level ($store.app.tiers) -->
  <template x-if="$store.app.mathTab === 'tiers'"><div style="display:contents" x-data="tierControls">
  <label class="mctl">Level
    <input type="number" id="t-level" class="tlevel" min="1" :max="$store.app.jobCtx.maxLevel" step="1" inputmode="numeric" x-bind="levelField" aria-label="Level of the tiers">
    <span class="f-range" id="t-level-range" x-text="`1–${$store.app.jobCtx.maxLevel}`"></span>
  </label>
  </div></template>
</div>

<p class="panel empty" id="m-off" x-show="!explainer && $store.app.mathTab === 'piece'" x-text="offText"></p>

<!-- PIECE STATS: one piece before and after sync, and the same slot at every item level -->
<section class="subtab" id="tab-piece" :hidden="$store.app.mathTab !== 'piece'">
<template x-if="explainer"><div class="twopanel">
  <div class="panel" id="p-piece">
    <h2>An example piece, before and after sync</h2>
    <p class="small dim" id="p-example" x-text="explainer.example"></p>
    <p class="small" id="p-lead" x-text="explainer.lead"></p>
    <div class="bars" id="p-bars">
      <template x-for="b in explainer.bars" :key="b.label">
        <div style="display:contents">
          <div class="small" x-text="b.label"></div>
          <div class="bar"><div class="keep" :style="`width:${b.keep}`"></div><div class="rise" :style="`left:${b.riseLeft};width:${b.rise}`"></div><div class="cut" :style="`left:${b.cutLeft};width:${b.cut}`"></div><div class="meld" x-show="b.melds" :style="`left:${b.meldLeft};width:${b.meldWidth}`"></div><div class="capmark" :style="`left:${b.capAt}`"></div></div>
          <div class="num"><span x-text="b.raw"></span> → <b x-text="b.total"></b><span class="gold" x-show="b.extra" x-text="` +${b.extra}`"></span><span class="meldtxt" x-show="b.melds" x-text="` +${b.melds}`"></span></div>
        </div>
      </template>
      <div class="small">Materia</div>
      <div class="chips" id="p-materia">
        <template x-for="(c, i) in explainer.stoneChips" :key="i"><span class="meldchip on" x-text="c"></span></template>
        <span class="meldchip" style="visibility: hidden" aria-hidden="true" x-show="!explainer.stoneChips.length">+0</span>
        <span class="small dim meldnote" x-text="explainer.meldNote"></span>
      </div>
    </div>
    <p class="small dim" x-show="explainer.goalNote" x-text="explainer.goalNote"></p>
    <div class="legend">
      <span><i class="box" style="background:var(--accent)"></i>Kept</span>
      <span x-show="explainer.bars.some(b => b.melds)"><i class="box meldbox"></i>Materia</span>
      <span><i class="hatch"></i>Cut by sync</span>
      <span><i class="box" style="background:var(--gold)"></i><span x-text="`More than an item level ${explainer.cap} piece has`"></span></span>
      <span><i style="background:var(--fg);width:2px"></i><span x-text="`Cap at item level ${explainer.cap}`"></span></span>
    </div>
    <div class="versus flat" id="p-vs">
      <div class="tablewrap"><table class="compact">
        <colgroup><col class="c-il"><col><col class="c-pts"></colgroup>
        <thead><tr><th>Item level</th><th>Materia</th><th class="n">In the duty</th></tr></thead>
        <tbody>
          <template x-for="r in explainer.vsRows" :key="r.il"><tr :class="{ solo: explainer.vsRows.length < 2 }"><td><span x-text="r.il"></span><div class="dim small" x-text="r.tag || ' '"></div></td><td><span x-text="r.materia"></span><div class="dim small" x-text="r.materiaNote || ' '"></div></td><td class="n" x-text="r.points"></td></tr></template>
          <tr class="spacer" aria-hidden="true" x-show="explainer.vsRows.length < 2"><td>&nbsp;<div class="small">&nbsp;</div></td><td><span x-text="explainer.vsRows[0].materia"></span><div class="small" x-text="explainer.vsRows[0].materiaNote || ' '"></div></td><td></td></tr>
        </tbody>
      </table></div>
      <p class="small"><b x-text="explainer.verdict || ' '"></b></p>
    </div>
  </div>
  <div class="panel" id="p-curve">
    <h2>Overgeared or melded: which has more?</h2>
    <div class="legend" id="p-curve-legend">
      <template x-for="b in explainer.curveBands" :key="b.label"><span><i :style="`background:${b.fill};opacity:${b.opacity}`"></i><span x-text="b.label"></span></span></template>
      <span><i class="dash"></i><span x-text="`Synced item level ${explainer.cap}`"></span></span>
      <span><i style="background:var(--fg);opacity:.12"></i>Overgeared ≥ melded</span>
    </div>
    <div class="chartbox" id="p-curve-chart" x-ref="pieceChart" x-init="observeChart($el)" x-html="explainer.curveChartSvg"></div>
    <p class="callout small" id="p-curve-note" x-show="explainer.curveNote" x-text="explainer.curveNote"></p>
  </div>
</div></template>

<details class="panel" id="p-steps">
  <summary>Each stat, step by step</summary>
  <div id="p-out" class="steps">
    <p class="steps-sum" x-text="steps.summary"></p>
    <p class="small" x-show="steps.byLevel" x-text="steps.byLevelText"></p>
    <div>
      <p class="small"><b>Where the numbers come from.</b> Every item level has a budget for each stat, and each slot takes a fixed share of it; with both rings the shares add up to the whole budget. <span x-text="steps.shareText"></span>; its best substat gets all of that (<b>100%</b>), the second <b>70%</b> of it.<span x-show="steps.healerNote"> Older healer gear (item level 135 and below) also carries a small Direct Hit line at 20%, outside these two.</span></p>
      <div class="slices" id="p-slices" role="img" aria-label="Each slot's share of the budget">
        <template x-for="(s, i) in steps.slices" :key="i"><span :class="{ on: s.on }" :style="`flex:${s.width}`"><b x-text="s.label"></b><i x-text="s.share"></i></span></template>
      </div>
    </div>
    <p class="steps-rule" x-show="steps.status !== 'off'"><b>In the duty, each stat is the lower of two numbers:</b> <span x-text="steps.ruleText"></span></p>
    <div class="tablewrap"><table class="compact steps-table">
      <thead><tr>
        <th>Stat</th>
        <th x-text="steps.ownHead"></th>
        <th x-show="steps.status !== 'off'" x-text="steps.capHead"></th>
        <th class="n" x-show="steps.status !== 'off'">In the duty</th>
      </tr></thead>
      <tbody>
        <template x-for="r in steps.rows" :key="r.stat">
          <tr>
            <td><b x-text="r.label"></b><div class="dim small" x-text="r.w + '%'"></div></td>
            <td><span class="num big" :class="{ dim: !r.ownKept }" x-text="r.raw"></span> <span class="small why" x-text="r.ownText"></span><div class="formula" x-text="r.ownFormula"></div></td>
            <td x-show="steps.status !== 'off'"><span class="num big" :class="{ dim: r.ownKept }" x-text="r.cap"></span> <span class="small why" x-text="r.capText"></span><div class="formula" x-text="r.capFormula"></div></td>
            <td class="n" x-show="steps.status !== 'off'"><span class="big" :class="{ clamp: r.lost }" x-text="r.syn"></span><template x-if="r.lost"><div class="small clamp" x-text="`−${r.lost}`"></div></template></td>
          </tr>
        </template>
      </tbody>
    </table></div>
  </div>
</details>
</section>

<!-- GCD: how speed becomes the GCD at a level, on its own settings (views/gcd.js) -->
<section class="subtab" id="tab-gcd" hidden :hidden="$store.app.mathTab !== 'gcd'" x-data="gcdTab">
<div class="gcdgrid">
  <div class="panel" id="g-facts"><div class="gfacts"><template x-for="f in view.facts" :key="f.label"><div><b x-text="f.value"></b><span x-text="f.label"></span></div></template></div></div>
  <div class="panel" id="g-curve">
    <h2>Speed per 0.01 s, by level</h2>
    <p class="small dim">How much speed it takes to shorten the GCD by 0.01 s at each level. Click a bar to see that level.</p>
    <div class="chartbox" id="g-chart" x-ref="chart" x-html="view.chartSvg" @click="pickLevel($event)"></div>
  </div>
  <div class="panel" id="g-steps">
    <h2>GCD steps</h2>
    <table class="compact gsteps" id="g-table">
      <thead><tr><th class="n">Speed</th><th class="n">GCD</th><th class="n" title="How much speed (and haste) cut every cast and recast time, before rounding">Reduction</th></tr></thead>
      <tbody><template x-for="r in view.steps" :key="r.speed"><tr :class="{ cur: r.cur, out: r.out }" :title="r.out ? 'More than any job can have at this level' : `Use ${r.speed} speed`" @click="pickSpeed(r)"><td class="n" x-text="r.speed"></td><td class="n" x-text="r.gcd"></td><td class="n" x-text="r.cut"></td></tr></template></tbody>
    </table>
  </div>
</div>
</section>

<!-- TIERS: every substat's tiers around its value (a ladder); not about sync, so it shows whatever the sync settings -->
<section class="subtab" id="tab-tiers" hidden :hidden="$store.app.mathTab !== 'tiers'" x-data="tierTable" @keydown.escape.window="helpFor = null" @click.window="if (helpFor && !$event.target.closest('#t-pop, [data-help]')) helpFor = null">
<template x-if="view"><div id="t-panel" x-ref="panel" style="position:relative">
  <!-- a card per substat, each its own small table -->
  <div class="tiercards" id="t-table"><template x-for="g in view.cards" :key="g.stat"><div class="tablewrap"><table class="compact ladder" :data-stat="g.stat">
    <thead>
      <tr><th class="n" :colspan="g.names.length">
        <div class="lname"><span x-text="g.label"></span> <button type="button" class="help shelp" :data-help="g.stat" :aria-expanded="String(helpFor === g.stat)" aria-controls="t-pop" :title="`About ${g.label}`" @click.stop="toggleHelp(g.stat, $el)">?</button></div>
        <input type="number" min="0" step="1" inputmode="numeric" :data-n="g.stat" :value="g.value" :aria-label="`${g.label} on the character panel`" @change="type(g.stat, $el)">
        <div class="leff"><template x-for="(line, k) in g.lines" :key="k"><span class="lline" x-text="line"></span></template><span class="lline lhaste" x-show="g.haste" x-text="g.haste"></span></div>
      </th></tr>
      <tr class="lcols"><template x-for="(n, k) in g.names" :key="k"><th class="n" x-text="n"></th></template></tr>
    </thead>
    <tbody><template x-for="(r, i) in g.rows" :key="i"><tr>
      <template x-for="(c, k) in r" :key="k"><td class="n" :class="{ eff: c.eff, chg2: c.mark, cur: c.cur, hov: hover === c.to }" :data-to="c.to" :title="c.title" x-text="c.text" @click="pick(c.to)" @mouseenter="hover = c.to" @mouseleave="hover = ''"></td></template>
    </tr></template></tbody>
    <tfoot><tr><td class="n small lfoot" :colspan="g.names.length"><span><b x-text="g.foot.spare"></b> spare</span><span x-show="g.foot.toNext != null"><b x-text="`+${g.foot.toNext}`"></b> to next</span><span x-show="g.foot.toNext == null">last tier</span></td></tr></tfoot>
  </table></div></template></div>
  <div class="popover statpop" id="t-pop" x-ref="pop" role="dialog" :aria-label="help ? `About ${help.title}` : 'About this substat'" x-show="help" :style="`top:${helpAt.top}px;left:${helpAt.left}px`">
    <template x-if="help"><div><h3 x-text="help.title"></h3><p x-text="help.affects"></p><p x-text="help.size"></p></div></template>
  </div>
</div></template>
</section>

</section>

<!-- OPTIMIZER -->
<section class="tab" id="tab-opt" role="tabpanel" hidden :hidden="$store.app.tab !== 'opt'">
  <div style="display:contents" x-data="optimizer">
    <h2>Gear optimizer</h2>
    <div class="panel" id="o-controls">
      <div class="part" id="o-gear" role="group" aria-labelledby="o-gear-h">
        <h3 id="o-gear-h">Gear to search <span class="count" id="o-count" x-text="countText ? '· ' + countText : ''"></span></h3>
        <div class="grid">
          <!-- INCLUDE expansion-menu.html id=o -->
          <label class="f"><span>Equip level <span class="f-range" x-text="`1–${$store.app.jobCtx.maxLevel}`"></span></span><input type="number" id="o-lvl" min="1" :max="$store.app.jobCtx.maxLevel" inputmode="numeric" x-bind="$num('opt.lvl', 1, Infinity, { empty: '' })"></label>
          <div class="f field ilvl-field"><span id="o-ilvl-label">Item level <span class="f-range" x-text="`1–${$store.app.maxReal}`"></span></span><div class="pair" role="group" aria-labelledby="o-ilvl-label"><input type="number" id="o-min" min="1" :max="$store.app.maxReal" inputmode="numeric" placeholder="min" aria-label="Item level min" x-bind="$num('opt.min', 1, Infinity, { empty: '' })"><span aria-hidden="true">–</span><input type="number" id="o-max" min="1" :max="$store.app.maxReal" inputmode="numeric" placeholder="max" aria-label="Item level max" x-bind="$num('opt.max', 1, Infinity, { empty: '' })"></div></div>
          <!-- INCLUDE gear-from-menu.html id=o part=opt -->
        </div>
      </div>
      <div class="part" id="o-goal" role="group" aria-labelledby="o-goal-h">
        <h3 id="o-goal-h">Goal</h3>
        <div class="grid">
          <label class="f">Maximize<select id="o-target" @change="setGoal(0, $event.target.value)">
            <template x-for="o in statOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === $store.app.opt.target"></option></template>
          </select></label>
          <label class="f">Tiebreak 1<select id="o-tb1" @change="setGoal(1, $event.target.value)">
            <template x-for="o in tiebreakOptions(1)" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === $store.app.opt.tb"></option></template>
          </select></label>
          <label class="f">Tiebreak 2<select id="o-tb2" @change="setGoal(2, $event.target.value)">
            <template x-for="o in tiebreakOptions(2)" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === $store.app.opt.tb2"></option></template>
          </select></label>
          <div class="f field gcd-field" id="o-gcd-row">
          <label for="o-gcd" x-text="gcdFieldLabel"></label>
          <div class="row">
            <input type="number" id="o-gcd" min="0.5" max="2.5" step="0.01" inputmode="decimal" placeholder="Any" :disabled="$store.app.opt.target === 'spd'" x-bind="$num('opt.gcd', 0.5, Infinity, { decimals: 2, empty: '' })">
            <div class="seg" id="o-gcd-mode" role="radiogroup" aria-label="Target GCD mode" :class="{ off: $store.app.opt.target === 'spd' }">
              <label :class="{ on: $store.app.opt.gcdMode === 'exact' }"><input type="radio" name="o-gcd-mode" value="exact" :disabled="$store.app.opt.target === 'spd'" :checked="$store.app.opt.gcdMode === 'exact'" @change="$store.app.opt.gcdMode = 'exact'">exactly</label>
              <label :class="{ on: $store.app.opt.gcdMode === 'min' }"><input type="radio" name="o-gcd-mode" value="min" :disabled="$store.app.opt.target === 'spd'" :checked="$store.app.opt.gcdMode === 'min'" @change="$store.app.opt.gcdMode = 'min'">or faster</label>
            </div>
          </div>
          </div>
        </div>
        <template x-if="!stale && view?.gcdLine"><div class="gcd-line" id="o-gcd-line" :class="{ bad: view.gcdLine.bad }" x-text="view.gcdLine.text"></div></template>
        <div class="row switches">
          <label class="toggle"><input type="checkbox" role="switch" class="switch" id="o-melds" :checked="$store.app.opt.melds" @change="$store.app.opt.melds = $event.target.checked"><span>Materia</span></label>
          <label class="toggle"><input type="checkbox" role="switch" class="switch" id="o-food" :checked="$store.app.opt.food" @change="$store.app.opt.food = $event.target.checked"><span>Food</span></label>
          <span class="grow"></span>
          <span class="rankwrap" @click.outside="rankHelp = false" @keydown.escape.window="rankHelp = false">
            <label class="toggle" :class="{ off: !$store.app.opt.tb }" :title="$store.app.opt.tb ? null : 'Set Tiebreak 1 to use spare points'"><input type="checkbox" role="switch" class="switch" id="o-by-tier" :disabled="!$store.app.opt.tb" :checked="$store.app.opt.byTier" @change="$store.app.opt.byTier = $event.target.checked"><span>Spare points to tiebreaks</span></label>
            <button type="button" class="help shelp" id="o-rank-help" aria-controls="o-rank-pop" :aria-expanded="String(rankHelp)" title="About this switch" @click="rankHelp = !rankHelp">?</button>
            <div class="popover statpop" id="o-rank-pop" role="dialog" aria-label="About Spare points to tiebreaks" x-show="rankHelp" x-cloak><p>Substats only improve at tiers, so points short of the next tier do nothing in game. This sends those spare points to your tiebreaks instead.</p></div>
          </span>
          <button type="button" class="primary run" id="o-run" :disabled="busy" @click="run()">Optimize</button>
        </div>
      </div>
    </div>
    <div id="o-out">
      <div class="progress" id="o-busy" x-show="busy" x-cloak role="progressbar" aria-label="Solving"><span></span></div>
      <template x-if="!view && !busy"><div class="panel"><div class="empty" id="o-none">Press Optimize to find the best set for the goal.</div></div></template>
      <p class="small stale-note" id="o-stale" x-show="stale" x-cloak>The settings changed since this result. Press Optimize to update it.</p>
      <div :class="{ 'is-stale': stale }">
      <template x-if="view && view.kind === 'excluded'"><div class="panel"><div class="empty" id="o-excluded">No gear to search: no piece passes the filters under Gear to search.</div></div></template>
      <template x-if="view && view.kind === 'error'"><div class="panel"><div class="empty"><b class="bad">The optimizer could not rank this gear.</b><br><span x-text="view.message"></span></div></div></template>
      <template x-if="view && view.kind === 'nogcd'"><div class="panel"><div class="empty" id="o-nogcd">No set fits this GCD.</div></div></template>
      <template x-if="view && view.kind === 'noset'"><div class="panel"><div class="empty" id="o-noset">No set found.</div></div></template>
      <template x-if="view && view.kind === 'infeasible'"><div class="panel"><div class="empty"><b class="bad">The search stopped at its step limit before finding a loadout.</b><br>Untick more boxes under Gear from and try again.</div></div></template>
      <template x-if="view && view.kind === 'ok'"><div class="panel" id="o-result" :data-target="view.target">
        <div class="readout">
          <div><b x-text="view.total"></b><span x-text="view.totalLabel"></span></div>
          <div><b x-text="view.gcdText"></b><span x-text="view.gcdNote"></span></div>
          <div><b x-text="view.dotText"></b><span>DoT/HoT tick scaling</span></div>
        </div>
        <div class="tablekey"><p class="small dim" id="o-time" x-text="`Solved in ${solveMs} ms.`"></p><template x-if="view.anyAtCap"><p class="small dim" id="o-key"><span class="atcap">48</span> a goal stat at this piece’s cap</p></template></div>
        <div class="tablewrap menus" id="o-table"><table @mouseover="$el.dataset.col = $event.target.closest('[data-col]')?.dataset.col ?? ''" @mouseleave="$el.dataset.col = ''">
          <thead><tr><th>Slot</th><th>Item</th><th class="n" data-col="ilvl">ilvl</th><template x-for="(h, k) in view.headers" :key="k"><th :data-col="jobCtx.stats[k]" class="n" x-text="h"></th></template></tr></thead>
          <tbody>
            <template x-for="(r, i) in view.rows" :key="i">
              <tr>
                <td x-text="r.label"></td>
                <template x-if="!r.item"><td class="dim" :colspan="view.headers.length + 2" x-text="r.emptyText"></td></template>
                <template x-if="r.item"><td class="item">
                  <template x-if="!r.same"><span x-text="r.item.name"></span></template>
                  <template x-if="r.same"><div class="same" @click.outside="if (menuOpen === i) menuOpen = null" @keydown.escape="menuOpen = null">
                    <button type="button" class="same-btn" :aria-expanded="menuOpen === i" :title="`${r.same.count} pieces give the same result here`" @click="toggleSameMenu(i, $el.parentElement)"><span x-text="r.item.name"></span><span class="same-count" x-text="`1 of ${r.same.count}`"></span></button>
                    <div class="same-menu search-menu" x-show="menuOpen === i" x-cloak>
                      <div class="menu-tools"><span class="menu-search"><input type="text" placeholder="Search pieces" autocomplete="off" aria-label="Search pieces" x-model="sameQuery"></span></div>
                      <div class="menu-list">
                        <template x-for="g in sameGroups(r.same.groups)" :key="g.label">
                          <div><div class="same-head" x-text="g.label"></div>
                            <template x-for="x in g.items" :key="x.key"><button type="button" class="same-item" :class="{ on: x.on }" @click="pick(i, x.key)"><span><span x-text="x.name"></span><template x-if="x.category"><span class="pill" :class="'cat-' + x.category.key" x-text="x.category.label"></span></template></span><span class="same-lvl" x-text="`${x.ilvl}, lvl ${x.lvl}`"></span></button></template>
                          </div>
                        </template>
                        <template x-if="menuOpen === i && !sameGroups(r.same.groups).length"><div class="menu-empty"><span x-text="`No piece matches &quot;${sameQuery.trim()}&quot;.`"></span> <button type="button" class="linkbtn" @click="sameQuery = ''">Clear search</button></div></template>
                      </div>
                    </div>
                  </div></template>
                  <template x-if="r.from"><div class="from"><template x-if="r.category"><span class="pill" :class="'cat-' + r.category.key" x-text="r.category.label"></span></template><span x-text="r.from"></span></div></template>
                  <template x-if="r.meld"><div class="small dim meld" x-text="r.meld"></div></template>
                </td></template>
                <template x-if="r.item"><td class="n" data-col="ilvl" :class="{ cut: r.ilvlWas }"><span x-text="r.ilvl"></span><template x-if="r.ilvlWas"><span class="was" x-text="r.ilvlWas"></span></template></td></template>
                <template x-for="(c, k) in (r.cells || [])" :key="k"><td :data-col="jobCtx.stats[k]" class="n" :class="{ gold: c.gold }"><span x-show="c.value" x-text="c.value" :class="{ atcap: c.atCap }" :title="c.atCap ? 'At this piece’s cap' : null"></span><span class="dim" x-show="!c.value">0</span></td></template>
              </tr>
            </template>
            <tr class="total"><td>Total</td><td class="small dim">base + gear</td><td class="n"></td><template x-for="(v, k) in view.totals" :key="k"><td :data-col="jobCtx.stats[k]" class="n" x-text="v"></td></template></tr>
            <template x-if="view.food">
              <tr class="food" id="o-food-row"><td>Food</td><td class="item">
                <div class="same" x-data="mealMenu" @click.outside="mealOpen = false" @keydown.escape="mealOpen = false">
                  <button type="button" class="same-btn" id="o-meal-btn" :aria-expanded="mealOpen" @click="toggleMealMenu()"><span x-text="view.food.name"></span><template x-if="view.food.best && view.food.menu.count > 1"><span class="same-count" x-text="`1 of ${view.food.menu.count}`"></span></template></button>
                  <div class="same-menu search-menu meal-menu" id="o-meal-menu" x-show="mealOpen" x-cloak>
                    <div class="menu-tools">
                      <span class="menu-search"><input type="text" id="o-meal-q" x-ref="mealQuery" placeholder="Search meals" autocomplete="off" aria-label="Search meals" x-model="mealQuery"></span>
                      <div class="meal-pills" role="group" aria-label="Meal stats"><template x-for="p in view.food.menu.pills" :key="p.stat"><button type="button" class="meal-pill" :class="{ on: mealStats.includes(p.stat) }" :aria-pressed="String(mealStats.includes(p.stat))" :disabled="mealPillOff(p.stat)" :title="p.label" :data-stat="p.stat" @click="toggleMealStat(p.stat)" x-text="p.short"></button></template></div>
                      <label class="toggle"><input type="checkbox" role="switch" class="switch" id="o-meal-best" :checked="mealBestOnly" @change="setMealBest($event.target.checked)"><span>Best for goal</span></label>
                    </div>
                    <div class="menu-list" x-ref="mealList">
                      <template x-for="g in mealGroups" :key="g.label"><div><div class="same-head" x-text="g.label"></div>
                        <template x-for="x in g.items" :key="x.key"><button type="button" class="same-item meal-item" :class="{ on: x.on }" :data-meal="x.key" :title="`${x.label} · item level ${x.ilvl}`" @click="chooseMeal(x.key)"><span class="meal-lead"><span class="meal-ilvl" x-text="`i${x.ilvl}`"></span><span class="meal-name"><span x-text="x.name"></span><template x-if="x.best && !mealBestOnly"><span class="pill">best for goal</span></template></span></span><span class="same-lvl" x-text="x.adds"></span></button></template>
                      </div></template>
                      <template x-if="mealEmpty"><div class="menu-empty" id="o-meal-empty"><span x-text="mealEmpty.text"></span> <template x-if="mealEmpty.action === 'query'"><button type="button" class="linkbtn" @click="mealQuery = ''">Clear search</button></template></div></template>
                    </div>
                  </div>
                </div>
                <div class="small dim" id="o-meal-note" x-text="view.food.note"></div>
              </td><td class="n" data-col="ilvl" x-text="view.food.ilvl"></td><template x-for="(c, k) in view.food.cells" :key="k"><td :data-col="jobCtx.stats[k]" class="n"><template x-if="c"><span x-text="`+${c.value}`"></span></template><template x-if="c && c.capped"><div class="small dim">max</div></template></td></template></tr>
            </template>
            <template x-if="view.food">
              <tr class="total" id="o-food-total"><td>With food</td><td class="small dim">base + gear + food</td><td class="n"></td><template x-for="(v, k) in view.food.totals" :key="k"><td :data-col="jobCtx.stats[k]" class="n" x-text="v"></td></template></tr>
            </template>
            <tr class="tier" id="o-effect"><td>Effect</td><td class="small dim" x-text="view.effectNote"></td><td class="n"></td><template x-for="(c, k) in view.tiers" :key="k"><td :data-col="jobCtx.stats[k]" class="n" :class="{ dim: c && c.zero }" x-text="c ? c.effect : ''"></td></template></tr>
            <tr class="tier" id="o-tier"><td>Tier</td><td class="small dim">spare · to next</td><td class="n"></td><template x-for="(c, k) in view.tiers" :key="k"><td :data-col="jobCtx.stats[k]" class="n small" :class="{ dim: c && c.zero, held: c && c.held }" :title="c ? c.title : null" x-text="c ? c.text : ''"></td></template></tr>
            <tr class="tier" id="o-defense"><td>Defense</td><td class="defense" :colspan="view.headers.length + 2">Physical <b x-text="view.defense.physText"></b> · Magic <b x-text="view.defense.magText"></b> · <span class="dim" x-text="view.defense.takenText"></span></td></tr>
          </tbody>
        </table></div>
        <template x-if="view.truncated"><div class="note small">Search hit its node limit, so this result may not be optimal. Untick more boxes under Gear from.</div></template>
        <p class="small dim" id="o-wd-note" x-show="view.weaponFirst">Weapon damage comes first, before the goal.</p>
        <template x-if="view.relicsLeftOut"><p class="small dim" id="o-relic-note">Relic weapons with customizable substats are left out.</p></template>
        <p class="small dim" id="o-total-note" x-text="view.clanNote"></p>
      </div></template>
      </div>
    </div>
  </div>
</section>

<!-- GEAR BROWSER -->
<section class="tab" id="tab-browse" role="tabpanel" hidden :hidden="$store.app.tab !== 'browse'">
  <div class="panel" x-data="gear" @keydown.window="slashToSearch($event)">
    <div class="titleline">
      <h2>Gear browser</h2>
      <span class="menu-search big-search"><input type="text" id="b-q" x-ref="search" placeholder="Search gear by name" autocomplete="off" :maxlength="searchMaxLength" aria-label="Search gear by name" x-model.debounce.300ms="$store.app.browse.q"><span class="kbd" x-show="!$store.app.browse.q" title="Press / to search">/</span><button type="button" class="clear" x-show="$store.app.browse.q" x-cloak aria-label="Clear the search" @click="$store.app.browse.q = ''; $refs.search.focus()">×</button></span>
      <span class="count" id="b-count" x-text="view ? view.countText : ''"></span>
    </div>
    <div class="pillline">
    <div class="slotpills" id="b-slots" role="group" aria-label="Slot">
      <template x-for="(p, k) in (view ? view.slots : [])" :key="p.key"><span style="display:contents"><template x-if="p.sep"><span class="sep" aria-hidden="true"></span></template><button type="button" :data-slot="p.key" :class="{ on: $store.app.browse.type === p.key }" :aria-pressed="String($store.app.browse.type === p.key)" :disabled="!p.count && $store.app.browse.type !== p.key" @click="$store.app.browse.type = p.key"><span x-text="p.label"></span><span class="n" x-text="p.count"></span></button></span></template>
    </div>
      <button type="button" class="resetbtn" id="b-reset" :class="{ off: !filtered }" :disabled="!filtered" :aria-hidden="String(!filtered)" title="Reset filters" aria-label="Reset filters" @click="resetBrowseFilters()">Reset</button>
    </div>
    <div class="grid browse-filters">
      <!-- INCLUDE expansion-menu.html id=b -->
      <label class="f"><span>Equip level <span class="f-range" x-text="`1–${$store.app.jobCtx.maxLevel}`"></span></span><input type="number" id="b-lvl" min="1" :max="$store.app.jobCtx.maxLevel" inputmode="numeric" x-bind="$num('browse.lvl', 1, Infinity, { empty: '' })"></label>
      <div class="f field ilvl-field"><span id="b-ilvl-label">Item level <span class="f-range" x-text="`1–${$store.app.maxReal}`"></span></span><div class="pair" role="group" aria-labelledby="b-ilvl-label"><input type="number" id="b-min" min="1" :max="$store.app.maxReal" inputmode="numeric" placeholder="min" aria-label="Item level min" x-bind="$num('browse.min', 1, Infinity, { empty: '' })"><span aria-hidden="true">–</span><input type="number" id="b-max" min="1" :max="$store.app.maxReal" inputmode="numeric" placeholder="max" aria-label="Item level max" x-bind="$num('browse.max', 1, Infinity, { empty: '' })"></div></div>
      <!-- INCLUDE gear-from-menu.html id=b part=browse -->
    </div>
    <template x-if="view && view.anySynced"><div class="tablekey"><span></span><p class="small dim" id="b-key"><b class="atcap">48</b> synced to this piece’s cap · <span class="keywas">795</span> the piece’s own, before sync</p></div></template>
    <div class="tablewrap tall"><table id="gear-table" @mouseover="$el.dataset.col = $event.target.closest('[data-col]')?.dataset.col ?? ''" @mouseleave="$el.dataset.col = ''">
      <template x-if="view && !view.shown.length"><tbody><tr><td class="empty">No gear matches these filters. <template x-if="filtered"><button type="button" class="linkbtn" @click="resetBrowseFilters()">Reset filters</button></template></td></tr></tbody></template>
      <template x-if="view && view.shown.length"><thead><tr><th :aria-sort="sortState('name')"><button type="button" class="sortbtn" data-sort="name" @click="sortBy('name')">Item</button></th><th>Slot</th><th class="n" data-col="lvl" :aria-sort="sortState('lvl')"><button type="button" class="sortbtn" data-sort="lvl" @click="sortBy('lvl')">Lv</button></th><th class="n" data-col="ilvl" :aria-sort="sortState('ilvl')"><button type="button" class="sortbtn" data-sort="ilvl" @click="sortBy('ilvl')">ilvl</button></th><template x-for="s in jobCtx.stats" :key="s"><th class="n" :data-col="s" :aria-sort="sortState(s)"><button type="button" class="sortbtn" :data-sort="s" :title="`Sort by synced ${jobCtx.label[s]}`" @click="sortBy(s)" x-text="jobCtx.short[s]"></button></th></template></tr></thead></template>
      <template x-if="view && view.shown.length"><tbody>
        <template x-for="x in view.shown" :key="x.key">
          <tr :data-key="x.key" :class="{ synced: x.synced }">
            <td><template x-for="(part, j) in x.nameParts" :key="j"><span :class="{ mark: part.hit }" x-text="part.text"></span></template><span class="hq" x-show="x.hq" title="High quality (crafted): stats include the HQ bonus">HQ</span></td><td><span x-text="x.slot"></span><span class="x2" x-show="x.copies === 2" title="Not Unique: can be worn on both ring fingers"> ×2</span></td><td class="n dim" data-col="lvl" x-text="x.lvl"></td><td class="n" data-col="ilvl" :class="{ cut: x.synced }"><span x-text="x.synced ? x.syncedIlvl : x.ilvl"></span><template x-if="x.synced"><span class="was" x-text="x.ilvl"></span></template></td>
            <template x-for="(c, k) in x.cells" :key="k"><td :class="c.cls" :data-col="jobCtx.stats[k]"><span :class="{ atcap: c.was != null }" :title="c.was != null ? 'At this piece’s cap' : null" x-text="c.text"></span><template x-if="c.was != null"><span class="was" x-text="c.was"></span></template></td></template>
          </tr>
        </template>
        <template x-if="view.hidden"><tr><td :colspan="jobCtx.stats.length + 4" class="dim small" x-text="view.hiddenText"></td></tr></template>
      </tbody></template>
    </table></div>
  </div>

</section>
</div></template>

<footer>
  <span><span x-show="dataSource" x-text="dataSource + ' · '"></span>Speed formulas: AkhMorning · FINAL FANTASY XIV and its job icons © SQUARE ENIX CO., LTD. Unofficial fan tool.</span>
  <!-- BUILD_INFO -->
</footer>
</div>

</body>
