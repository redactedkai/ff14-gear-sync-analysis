<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gear Sync Analysis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@500;600&display=swap">
<!-- STYLES -->
</head>
<body>
<!-- Dynamic <select>s render options with x-for and mark the current one with :selected (x-model on a select
     whose options are created by x-for can miss the initial value). -->
<div class="wrap" x-data="page">
<header>
  <h1>Gear Sync Analysis</h1>
  <p class="lede">See what item level sync does to your gear, and find the gear combination that gets you the most of the stat you want, for any job.</p>
</header>

<section class="panel" aria-label="Job and sync settings" x-data="settings" :data-job="$store.app.job || ''">
  <div class="settings">
    <div class="f jobpick">
      <div class="row"><span id="job-label">Job: <b id="job-name" x-text="$store.app.job ? job.jobName : 'none chosen'"></b></span><span style="flex:1"></span><button class="chip" id="reset" type="button" @click="requestReset()">Reset to defaults</button></div>
      <div class="jobrows" role="radiogroup" aria-labelledby="job-label">
        <template x-for="row in jobRows" :key="row.label">
          <div class="jobrow" role="group" :aria-label="row.label">
            <span class="jobrow-label" x-text="row.label"></span>
            <div class="jobicons">
            <template x-for="j in row.jobs" :key="j.id">
              <button type="button" class="jobbtn" role="radio" :data-job-id="j.id" :title="j.name" :aria-label="j.name"
                :aria-checked="String(j.id === $store.app.job)" :class="{ pending: j.id === pendingJob }" @click="pendingReset = false; requestJob(j.id)"><img :src="j.icon" alt="" width="40" height="40"></button>
            </template>
            </div>
          </div>
        </template>
      </div>
    </div>
    <label class="f">Synced level
      <input type="number" id="level" min="1" max="100" step="1" inputmode="numeric" x-bind="$num('level', 1, 100)">
    </label>
    <label class="f"><span>Sync cap (item level)<span class="field-error" id="cap-error" x-show="capError" x-text="' · ' + capError"></span></span>
      <input type="number" id="cap" :disabled="!$store.app.sync" min="1" :max="$store.app.maxReal" step="1" inputmode="numeric"
        x-bind="$num('cap', 1, $store.app.maxReal)" @input="onCapInput($event.target.value)" :class="{ invalid: !!capError }" :aria-invalid="String(!!capError)" aria-describedby="cap-error">
    </label>
    <label class="f">Item level sync
      <span class="toggle"><input type="checkbox" role="switch" class="switch" id="sync" x-model="$store.app.sync"><span x-text="$store.app.sync ? 'On' : 'Off'"></span></span>
    </label>
  </div>
  <template x-if="pendingReset">
    <div class="note small row" id="reset-warning" role="alert">
      <span>Reset every setting to its default? This also clears your pool (<span x-text="poolSize === 1 ? '1 item' : poolSize + ' items'"></span>).</span>
      <span style="flex:1"></span>
      <button class="primary" id="reset-confirm" type="button" @click="confirmReset()">Reset and clear</button>
      <button id="reset-cancel" type="button" @click="pendingReset = false">Cancel</button>
    </div>
  </template>
  <template x-if="pendingJob">
    <div class="note small row" id="job-warning" role="alert">
      <span>Switching to <b x-text="pendingJobName"></b> clears your pool (<span x-text="poolSize === 1 ? '1 item' : poolSize + ' items'"></span>) and the job-specific settings.</span>
      <span style="flex:1"></span>
      <button class="primary" id="job-confirm" type="button" @click="confirmJob()">Switch and clear</button>
      <button id="job-cancel" type="button" @click="cancelJob()">Cancel</button>
    </div>
  </template>
</section>

<template x-if="!$store.app.job"><div class="panel empty" id="no-job">Choose a job above to browse its gear.</div></template>
<template x-if="$store.app.job"><div style="display:contents">
<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="pool" type="button" :aria-selected="String($store.app.tab === 'pool')" @click="$store.app.showTab('pool')"><span class="step">1</span> Gear pool</button>
  <button role="tab" data-tab="opt" type="button" :aria-selected="String($store.app.tab === 'opt')" @click="$store.app.showTab('opt')"><span class="step">2</span> Gear optimizer</button>
  <button role="tab" data-tab="math" type="button" class="aside" :aria-selected="String($store.app.tab === 'math')" @click="$store.app.showTab('math')">How the math works</button>
</nav>

<!-- THE MATH -->
<section class="tab" id="tab-math" role="tabpanel" hidden :hidden="$store.app.tab !== 'math'">
<nav class="subtabs" aria-label="Math views">
  <button data-sub="piece" type="button" :aria-pressed="String($store.app.mathTab === 'piece')" @click="$store.app.showSub('piece')">Piece stats</button>
  <button data-sub="sync" type="button" :aria-pressed="String($store.app.mathTab === 'sync')" @click="$store.app.showSub('sync')">Sync limits</button>
</nav>

<!-- PIECE LAB -->
<section class="subtab" id="tab-piece" x-data="pieceLab" :hidden="$store.app.mathTab !== 'piece'">
  <div class="panel">
    <div class="grid">
      <label class="f">Item level
        <input type="number" id="p-ilvl" min="1" :max="$store.app.maxReal" step="1" inputmode="numeric" x-bind="$num('piece.ilvl', 1, $store.app.maxReal)">
      </label>
      <label class="f">Slot
        <select id="p-slot" @change="$store.app.piece.slot = $event.target.value">
          <template x-for="o in slotOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === $store.app.piece.slot"></option></template>
        </select>
      </label>
      <label class="f">1st substat · 100%<select id="p-s1" @change="setSub(0, $event.target.value)">
        <template x-for="o in substatOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === ($store.app.piece.subs[0] || 'spd')"></option></template>
      </select></label>
      <label class="f">2nd substat · 70%<select id="p-s2" @change="setSub(1, $event.target.value)">
        <template x-for="o in [['', 'none']].concat(substatOptions)" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === ($store.app.piece.subs[1] || '')"></option></template>
      </select></label>
      <label class="f">3rd substat · 20%<select id="p-s3" @change="setSub(2, $event.target.value)">
        <template x-for="o in [['', 'none']].concat(substatOptions)" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === ($store.app.piece.subs[2] || '')"></option></template>
      </select></label>
    </div>
    <input type="range" id="p-range" min="1" :max="$store.app.maxReal" step="1" aria-label="Item level slider" :value="view.rangeValue" @input="setFromRange($event.target.value)">
    <div id="p-out">
      <p class="small" style="margin-bottom:10px">
        <span x-show="view.status === 'off'">No sync cap applies: stats are shown as on the item.</span>
        <span x-show="view.status === 'below'" x-text="`This piece is at or below the cap (${$store.app.cap}), so sync leaves it untouched.`"></span>
        <span x-show="view.status === 'above'">This piece is above the cap, so sync clamps each line to what a 100% stat on a <span x-text="slotLabel[$store.app.piece.slot]"></span> at item level <span x-text="$store.app.cap"></span> would have. <b class="bad" x-text="view.lost + ' points'"></b> of its raw stats are unused.</span>
      </p>
      <div class="tablewrap"><table class="compact">
        <thead><tr><th>Stat</th><th class="n" x-text="'Table @ ilvl ' + view.il"></th><th>Calculation</th><th class="n">Raw</th><th class="n" x-show="$store.app.syncActive" x-text="'Synced to ' + $store.app.cap"></th></tr></thead>
        <tbody>
          <template x-for="(r, i) in view.rows" :key="i">
            <tr>
              <td><span x-text="r.label"></span> <span class="dim" x-text="r.w + '%'"></span></td>
              <td class="n" x-text="r.base"></td>
              <td class="formula" x-text="r.formula"></td>
              <td class="n" x-text="r.raw"></td>
              <td class="n" x-show="$store.app.syncActive" :class="{ clamp: r.syn < r.raw }"><span x-text="r.syn"></span><template x-if="r.syn < r.raw"><span class="small" x-text="` (−${r.raw - r.syn})`"></span></template></td>
            </tr>
          </template>
        </tbody>
      </table></div>
    </div>
    <div class="note small" id="p-why">
      <b>What are 100%, 70% and 20%?</b> A piece’s best substat gets the slot’s full budget (<b>100%</b>), the second about <b>70%</b> of that, and a small third about <b>20%</b>.
      This is a pattern measured on real gear (it matches 99.8% of pieces), not a rule from the game files. The Gear pool and Gear optimizer use each item’s real stats instead.
    </div>
  </div>
  <div class="panel">
    <h3>Substat and main-stat budget by item level</h3>
    <div class="legend"><span><i style="background:var(--accent)"></i>Substat column</span><span><i style="background:var(--gold)"></i>Main-stat column</span><span x-show="$store.app.syncActive"><i style="background:var(--bad);height:2px"></i>Sync cap</span></div>
    <div id="p-chart" x-html="view.chartSvg"></div>
    <p class="small dim">A piece’s stats come from these two columns at its item level, scaled by its slot. Dotted lines split the expansions.</p>
  </div>
</section>

<!-- SYNC CAPS -->
<section class="subtab" id="tab-sync" x-data="syncCaps" hidden :hidden="$store.app.mathTab !== 'sync'">
  <div class="panel">
    <h2>What the sync cap allows</h2>
    <p class="small dim" id="s-off" x-show="!view" x-text="$store.app.sync ? 'Enter a sync cap (item level) at the top to see what it allows.' : 'Item level sync is off. Turn it on at the top and enter a sync cap to see what it allows.'"></p>
    <template x-if="view"><div style="display:flex;flex-direction:column;gap:12px">
    <label class="f" style="max-width:220px">Example high-ilvl piece<input type="number" id="s-ilvl" min="1" :max="$store.app.maxReal" inputmode="numeric" x-bind="$num('syncIlvl', 1, $store.app.maxReal)"></label>
    <p class="small dim" id="s-lead" x-text="`At sync cap ${view.cap}, a ${view.cap}-level piece defines the ceiling per slot. Anything above it is cut to this ceiling; anything below it keeps its own stats. The last two columns list a piece’s 1st / 2nd / 3rd substat (100 / 70 / 20% shares): one at item level ${view.cap}, and one at item level ${view.hil} after syncing.`"></p>
    <div class="tablewrap"><table id="s-table" class="compact">
      <thead><tr><th>Slot</th><th class="n">Share</th><th class="n">Substat cap</th><th class="n" x-show="view.specLabel" x-text="view.specLabel + ' cap'"></th><th class="n" x-text="job.short.main + ' cap'"></th><th class="n">VIT cap</th><th class="n" x-text="`Ilvl ${view.cap} piece`"></th><th class="n" x-text="`Ilvl ${view.hil} synced`"></th></tr></thead>
      <tbody>
        <template x-for="r in view.rows" :key="r.type">
          <tr><td x-text="slotLabel[r.type] + (r.times > 1 ? ' ×2' : '')"></td><td class="n" x-text="r.pct + '%'"></td><td class="n" x-text="r.sub"></td><td class="n" x-show="view.specLabel" x-text="r.spec"></td><td class="n" x-text="r.main"></td><td class="n" x-text="r.vit"></td><td class="n" x-text="r.native"></td><td class="n" x-text="r.synced"></td></tr>
        </template>
        <tr class="total"><td>10 armor and accessory slots</td><td class="n"></td><td class="n" x-text="view.tot.c"></td><td class="n" x-show="view.specLabel" x-text="view.tot.spec"></td><td class="n" x-text="view.tot.main"></td><td class="n" x-text="view.tot.vit"></td><td class="n" x-text="`${view.tot.n1} / ${view.tot.n2} / ${view.tot.n3}`"></td><td class="n" x-text="`${view.tot.h1} / ${view.tot.h2} / ${view.tot.h3}`"></td></tr>
      </tbody>
    </table></div>
    <div id="s-sum"><div class="readout">
      <div><b x-text="view.best"></b><span x-text="`Most you can get of any one substat${view.bestLabel ? ` (${view.bestLabel})` : ''} from the ten armor and accessory slots`"></span></div>
      <div><b class="gold" x-text="(view.gain >= 0 ? '+' : '') + view.gain"></b><span x-text="`First two substats combined, item level ${view.hil} pieces vs native ${view.cap} pieces (${view.gainPct}%)`"></span></div>
      <div><b x-text="view.gcd + 's'"></b><span x-text="`GCD from ${view.spd} gear ${job.label.spd} (level ${$store.app.level}, 2.50 base)`"></span></div>
      <div><b x-text="'+' + view.dot + '%'"></b><span x-text="`DoT/HoT tick scaling from ${view.spd} ${job.label.spd}`"></span></div>
    </div></div>
    </div></template>
    <details id="s-valid" x-data="validationPanel" @toggle="onToggle($el.open)"><summary>Checked against real gear and published caps</summary><div id="s-valid-out" style="margin-top:10px">
      <template x-if="view"><div>
        <p class="small">For every combat piece in the game database with two or more substats and item level 110 or higher (<b x-text="view.total"></b> pieces, all jobs), the page’s formula <span class="num">round( round(table × slot share) × substat share )</span> was compared with the item’s real stats, assigning substat shares by rank (100%, 70%, 20%). Real stats are rounded twice: the slot budget first, then the share.</p>
        <div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>Item level</th><th class="n">Pieces</th><th class="n">Exact</th><th class="n">Within ±1</th></tr></thead><tbody>
          <template x-for="b in view.bands" :key="b.label"><tr><td x-text="b.label"></td><td class="n" x-text="b.n"></td><td class="n" x-text="b.exact"></td><td class="n" x-text="b.within1"></td></tr></template>
        </tbody></table></div>
        <p class="small" style="margin-top:12px"><b>Sync caps at item level 475</b>, published on the FFXIV Wiki’s Item Level Sync page, against this page’s formula:</p>
        <div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>Gear type</th><th class="n">Wiki</th><th class="n">Formula</th><th></th></tr></thead><tbody>
          <template x-for="c in view.wiki" :key="c.label"><tr><td x-text="c.label"></td><td class="n" x-text="c.published"></td><td class="n" x-text="c.computed"></td><td :class="c.match ? 'ok' : 'bad'" x-text="c.match ? 'match' : 'differs'"></td></tr></template>
        </tbody></table></div>
        <p class="small dim" style="margin-top:8px">The wiki also states that substats are never scaled up, that melds are ignored on synced-down gear, and that for gear occupying several slots the cap is the sum of those slots. It does not say whether the main stat or Vitality is clamped; this page assumes they are. The few misses are Intelligence and Mind head, hands and feet at item level 380 (Vitality 1 higher), level-50 crafted HQ pieces whose Direct Hit gets no HQ bonus, two weapon and shield pairs, and two item level 595 legs; their causes are not known.</p>
      </div></template>
    </div></details>
    <div class="note small">Model assumptions: every stat on a synced-down piece is clamped to the value a 100%-share stat on a same-slot piece at the cap item level would have; stats on pieces at or below the cap are untouched; materia is ignored on synced-down gear. The main-stat and Vitality clamp is inferred and not confirmed in-game. Real pieces have fixed substat pairs; the formula reproduces 99.8% of real pieces exactly.</div>
  </div>
</section>

</section>

<!-- ITEM POOL -->
<section class="tab" id="tab-pool" role="tabpanel" hidden :hidden="$store.app.tab !== 'pool'">
  <div class="panel" x-data="gear">
    <div class="row">
      <h2 style="margin-right:auto">Gear Pool</h2>
      <div class="row" role="group" aria-label="Show">
        <button class="chip" id="show-all" type="button" :aria-pressed="String(!$store.app.browse.show || $store.app.browse.show === 'all')" @click="show('all')">All gear</button>
        <button class="chip" id="show-pool" type="button" :aria-pressed="String($store.app.browse.show === 'pool')" @click="show('pool')" x-text="`My pool (${$store.app.pool.length})`"></button>
      </div>
    </div>
    <div class="grid">
      <label class="f">Name contains<input type="text" id="b-q" autocomplete="off" x-model="$store.app.browse.q"></label>
      <label class="f">Slot<select id="b-type" @change="$store.app.browse.type = $event.target.value">
        <template x-for="o in typeOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === $store.app.browse.type"></option></template>
      </select></label>
      <div class="f multi" x-show="!view || !view.showPool" x-data="{ open: false }" @click.outside="open = false" @keydown.escape="open = false">
        <span id="b-exp-label">Expansion</span>
        <button type="button" class="multi-btn" id="b-exp" aria-haspopup="true" :aria-expanded="String(open)" aria-labelledby="b-exp-label b-exp" @click="open = !open" x-text="expSummary"></button>
        <div class="multi-menu" id="b-exp-menu" role="group" aria-labelledby="b-exp-label" x-show="open" x-cloak>
          <template x-for="e in expansions" :key="e[0]">
            <label class="multi-opt"><input type="checkbox" :data-exp="e[0]" :checked="expShown(e[0])" @change="setExpShown(e[0], $event.target.checked)"><span x-text="e[1]"></span></label>
          </template>
        </div>
      </div>
      <label class="f">Item level from<input type="number" id="b-min" min="0" :max="$store.app.maxReal" inputmode="numeric" placeholder="any" x-model="$store.app.browse.min"></label>
      <label class="f">Item level to<input type="number" id="b-max" min="0" :max="$store.app.maxReal" inputmode="numeric" placeholder="any" x-model="$store.app.browse.max"></label>
      <label class="f" x-show="!view || !view.showPool">Equip level up to<input type="number" id="b-lvl" min="1" max="100" inputmode="numeric" x-model="$store.app.browse.lvl"></label>
      <label class="f">Sort by<select id="b-sort" @change="$store.app.browse.sort = $event.target.value">
        <template x-for="o in sortOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === $store.app.browse.sort"></option></template>
      </select></label>
    </div>
    <div class="row">
      <span class="small dim" id="b-count">
        <template x-if="!notice"><span x-text="view ? view.countText : ''"></span></template>
        <template x-if="notice && notice.kind === 'toomany'"><span><b class="bad" x-text="`${notice.n} matches is too many to add at once.`"></b> Narrow the filters to <span x-text="notice.limit"></span> or fewer (slot, item level range or name).</span></template>
        <template x-if="notice && notice.kind === 'added'"><span><b class="ok" x-text="`Added ${notice.n} item${notice.plural} to the pool`"></b><span x-text="notice.skipped ? ` (${notice.skipped} already there)` : ''"></span>.</span></template>
      </span>
      <span style="flex:1"></span>
      <button id="b-addall" type="button" x-show="view && !view.showPool" :disabled="!view || !view.all.length" @click="addAll()">Add all matches to pool</button>
      <button id="b-clear" type="button" :disabled="!$store.app.pool.length" @click="$store.app.clearPool()">Clear pool</button>
    </div>
    <div class="tablewrap tall"><table id="gear-table">
      <template x-if="view && !view.shown.length"><tbody><tr><td class="empty" x-text="view.showPool ? ($store.app.pool.length ? 'No pool items match these filters.' : 'The pool is empty. Tick gear under All gear to add it.') : 'No gear matches these filters.'"></td></tr></tbody></template>
      <template x-if="view && view.shown.length"><thead><tr><th><span class="sr-only">In pool</span></th><th>Item</th><th>Slot</th><th class="n">Lv</th><th class="n">ilvl</th><template x-for="s in job.stats" :key="s"><th class="n" x-text="job.short[s]"></th></template></tr></thead></template>
      <template x-if="view && view.shown.length"><tbody>
        <template x-for="x in view.shown" :key="x.key">
          <tr :data-key="x.key" :class="{ inpool: !!x.item }">
            <td><input type="checkbox" :data-toggle="x.key" :checked="!!x.item" @change="toggle(x)" :aria-label="(x.item ? 'Remove from pool: ' : 'Add to pool: ') + x.name"></td>
            <td><span x-text="x.name"></span><span class="hq" x-show="x.hq" title="High quality (crafted): stats include the HQ bonus">HQ</span></td><td><span x-text="x.slot"></span><span class="x2" x-show="x.copies === 2" title="Not Unique: can be worn on both ring fingers"> ×2</span></td><td class="n dim" x-text="x.lvl"></td><td class="n" x-text="x.ilvl"></td>
            <template x-for="(c, k) in x.cells" :key="k"><td :class="c.cls" x-text="c.text"></td></template>
          </tr>
        </template>
        <template x-if="view.hidden"><tr><td :colspan="job.stats.length + 5" class="dim small" x-text="view.showPool ? `${view.hidden} more pool items not shown here (they are all still searched). Narrow the filters to view them.` : `${view.hidden} more matches not shown. Narrow the filters to view them.`"></td></tr></template>
      </tbody></template>
    </table></div>
    <p class="small dim">A ring marked ×2 is not Unique, so it can be worn on both hands. <span class="num">raw → synced</span> where the sync cap bites; craftable gear shows high-quality stats.</p>
  </div>

</section>

<!-- OPTIMIZER -->
<section class="tab" id="tab-opt" role="tabpanel" hidden :hidden="$store.app.tab !== 'opt'">
  <div style="display:contents" x-data="optimizer">
    <div class="panel">
      <h2>Gear optimizer</h2>
      <div class="grid">
        <label class="f">Maximize<select id="o-target" @change="$store.app.opt.target = $event.target.value">
          <template x-for="o in statOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === $store.app.opt.target"></option></template>
        </select></label>
        <label class="f">Tiebreak 1<select id="o-tb1" @change="$store.app.opt.tb = $event.target.value">
          <template x-for="o in tiebreakOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === $store.app.opt.tb"></option></template>
        </select></label>
        <label class="f">Tiebreak 2<select id="o-tb2" @change="$store.app.opt.tb2 = $event.target.value">
          <template x-for="o in tiebreakOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === $store.app.opt.tb2"></option></template>
        </select></label>
      </div>
      <div class="row exclude" id="o-exclude">
        <span class="dim small">Include</span>
        <template x-for="s in sources" :key="s.key">
          <label class="toggle"><input type="checkbox" role="switch" class="switch" :data-source="s.key" :checked="!excluded(s.key)" @change="setExcluded(s.key, !$event.target.checked)"><span x-text="s.label"></span></label>
        </template>
      </div>
    </div>
    <div id="o-out">
      <template x-if="view && view.kind === 'excluded'"><div class="panel"><div class="empty" id="o-excluded">Every piece in the pool is in a group you switched off.</div></div></template>
      <template x-if="view && view.kind === 'empty'"><div class="panel"><div class="empty">Add gear to the pool first.<div class="row" style="justify-content:center;margin-top:10px"><button class="primary" data-act="browse" type="button" @click="$store.app.showTab('pool')">Browse gear</button></div></div></div></template>
      <template x-if="view && view.kind === 'error'"><div class="panel"><div class="empty"><b class="bad">The optimizer could not rank this pool.</b><br><span x-text="view.message"></span></div></div></template>
      <template x-if="view && view.kind === 'infeasible'"><div class="panel"><div class="empty"><b class="bad">The search stopped at its step limit before finding a loadout.</b><br>Narrow the pool and try again.</div></div></template>
      <template x-if="view && view.kind === 'ok'"><div class="panel" id="o-result" :data-target="view.target">
        <div class="readout">
          <div><b x-text="view.total"></b><span x-text="`${view.targetLabel} (gear total${view.synced ? ', synced' : ''})`"></span></div>
          <div><b x-text="view.gcd + 's'"></b><span x-text="`GCD with ${view.spd} gear ${view.spdLabel} · ${view.tierText}`"></span></div>
          <div><b x-text="'+' + view.dot + '%'"></b><span>DoT/HoT tick scaling</span></div>
        </div>
        <div class="tablewrap"><table>
          <thead><tr><th>Slot</th><th>Item</th><th class="n">ilvl</th><template x-for="(h, k) in view.headers" :key="k"><th class="n" x-text="h"></th></template></tr></thead>
          <tbody>
            <template x-for="(r, i) in view.rows" :key="i">
              <tr>
                <td x-text="r.label"></td>
                <template x-if="!r.item"><td class="dim" :colspan="view.headers.length + 2" x-text="r.blockedBy ? 'covered by ' + r.blockedBy : 'empty (no copy left)'"></td></template>
                <template x-if="r.item"><td x-text="r.item.name"></td></template>
                <template x-if="r.item"><td class="n" x-text="r.item.ilvl"></td></template>
                <template x-for="(c, k) in (r.cells || [])" :key="k"><td class="n" :class="{ gold: c.gold }"><span x-show="c.value" x-text="c.value"></span><span class="dim" x-show="!c.value">0</span></td></template>
              </tr>
            </template>
            <tr class="total"><td>Total</td><td></td><td class="n"></td><template x-for="(v, k) in view.totals" :key="k"><td class="n" x-text="v"></td></template></tr>
          </tbody>
        </table></div>
        <template x-if="view.truncated"><div class="note small">Search hit its node limit, so this result may not be optimal. Narrow the pool.</div></template>
      </div></template>
    </div>
  </div>
  <div id="o-ceil" x-data="ceiling">
    <template x-if="view && view.error"><div class="panel"><h3>Ceiling per stat from this pool</h3><p class="small bad" x-text="view.error"></p></div></template>
    <template x-if="view && !view.error"><div class="panel">
      <h3>Ceiling per stat from this pool</h3>
      <p class="small dim">The most of each stat the pool can give on its own.<span x-show="view.synced"> “Unsynced” drops the cap.</span></p>
      <div class="tablewrap"><table>
        <thead><tr><th></th><template x-for="(h, k) in view.headers" :key="k"><th class="n" x-text="h"></th></template></tr></thead>
        <tbody>
          <template x-if="view.synced"><tr><td x-text="'Synced to ' + view.cap"></td><template x-for="(v, k) in view.synced" :key="k"><td class="n" x-text="v"></td></template></tr></template>
          <tr><td>Unsynced</td><template x-for="(v, k) in view.unsynced" :key="k"><td class="n" :class="{ dim: view.synced }" x-text="v"></td></template></tr>
          <tr class="total"><td x-text="view.synced ? 'GCD at synced ceiling' : 'GCD at ceiling'"></td><template x-for="(h, k) in view.headers" :key="k"><td :class="k === view.spdIdx ? 'n' : ''" x-text="k === view.spdIdx ? view.gcd : ''"></td></template></tr>
        </tbody>
      </table></div>
      <template x-if="view.truncated"><p class="small dim">≥ marks a search that hit its step limit: the true maximum may be higher.</p></template>
    </div></template>
  </div>
</section>
</div></template>

<footer>
  <span><span x-show="dataSource" x-text="dataSource + ' · '"></span>Speed formulas: AkhMorning · FINAL FANTASY XIV and its job icons © SQUARE ENIX CO., LTD. Unofficial fan tool.</span>
</footer>
</div>
<!-- SCRIPT -->
</body>
