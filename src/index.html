<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gear Sync Analysis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@500;600&display=swap">
<!-- STYLES -->
</head>
<body>
<!-- Dynamic <select>s render options with x-for and mark the current one with :selected (x-model on a select
     whose options are created by x-for can miss the initial value). -->
<div class="wrap" x-data="page">
<header>
  <h1>Gear Sync Analysis<!-- BUILD_BADGE --></h1>
  <p class="lede">See what item level sync does to your gear, and find the gear combination that gets you the most of the stat you want, for any job.</p>
</header>

<section class="panel" aria-label="Job and sync settings" x-data="settings" :data-job="$store.app.job || ''">
  <div class="settings">
    <div class="f jobpick">
      <div class="row"><span id="job-label">Job: <b id="job-name" x-text="$store.app.job ? job.jobName : 'none chosen'"></b></span><span style="flex:1"></span><button class="chip" id="reset" type="button" @click="requestReset()">Reset to defaults</button></div>
      <div class="jobrows" role="radiogroup" aria-labelledby="job-label">
        <template x-for="row in jobRows" :key="row.label">
          <div class="jobrow" role="group" :aria-label="row.label">
            <span class="jobrow-label" x-text="row.label"></span>
            <div class="jobicons">
            <template x-for="j in row.jobs" :key="j.id">
              <button type="button" class="jobbtn" role="radio" :data-job-id="j.id" :title="j.name" :aria-label="j.name"
                :aria-checked="String(j.id === $store.app.job)" @click="requestJob(j.id)"><img :src="j.icon" alt="" width="40" height="40"></button>
            </template>
            </div>
          </div>
        </template>
      </div>
    </div>
    <label class="f"><span>Synced level <span class="f-range" id="level-range" x-text="`1–${$store.app.jobCtx.maxLevel}`"></span></span>
      <input type="number" id="level" min="1" :max="$store.app.jobCtx.maxLevel" step="1" inputmode="numeric" x-bind="$num('level', 1, () => $store.app.jobCtx.maxLevel, { live: true })">
    </label>
    <div class="f field"><label for="cap">Sync cap (item level) <span class="f-range" id="cap-range" x-text="`1–${$store.app.maxReal}`"></span></label>
      <input type="number" id="cap" x-ref="cap" :disabled="!$store.app.sync" min="1" :max="$store.app.maxReal" step="1" inputmode="numeric"
        x-bind="$num('cap', 1, Infinity)" @input="onCapInput($event.target.value)" :class="{ invalid: !!capError, lowered: !!capLoweredNote }" :aria-invalid="String(!!capError)" aria-describedby="cap-error cap-lowered">
      <span class="field-error" id="cap-error" x-show="capError" x-text="capError"></span>
      <span class="field-note lowered" id="cap-lowered" x-show="capLoweredNote" x-text="capLoweredNote" aria-live="polite"></span>
    </div>
    <label class="f">Item level sync
      <span class="toggle"><input type="checkbox" role="switch" class="switch" id="sync" x-model="$store.app.sync"><span x-text="$store.app.sync ? 'On' : 'Off'"></span></span>
    </label>
  </div>
</section>

<template x-if="!$store.app.job"><div class="panel empty" id="no-job">Choose a job above to find its best gear.</div></template>
<template x-if="$store.app.job"><div style="display:contents">
<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="opt" type="button" :aria-selected="String($store.app.tab === 'opt')" @click="$store.app.showTab('opt')">Gear optimizer</button>
  <button role="tab" data-tab="browse" type="button" :aria-selected="String($store.app.tab === 'browse')" @click="$store.app.showTab('browse')">Gear browser</button>
  <button role="tab" data-tab="math" type="button" class="aside" :aria-selected="String($store.app.tab === 'math')" @click="$store.app.showTab('math')">How the math works</button>
</nav>

<!-- THE MATH: what sync does to one piece (Piece stats) and to a full set's GCD (GCD), and the substats' tiers (Substat tiers);
     controls in a sticky bar, each shown on the sub-tabs it applies to -->
<section class="tab" id="tab-math" role="tabpanel" hidden :hidden="$store.app.tab !== 'math'" x-data="syncExplainer" @keydown.escape.window="helpOpen = false">
<div class="mathbar" id="m-bar">
  <nav class="subtabs" aria-label="Math views">
    <button data-sub="piece" type="button" :aria-pressed="String($store.app.mathTab === 'piece')" @click="$store.app.showSub('piece')">Piece stats</button>
    <button data-sub="gcd" type="button" :aria-pressed="String($store.app.mathTab === 'gcd')" @click="$store.app.showSub('gcd')">GCD</button>
    <button data-sub="tiers" type="button" :aria-pressed="String($store.app.mathTab === 'tiers')" @click="$store.app.showSub('tiers')">Substat tiers</button>
  </nav>
  <label class="mctl" x-show="$store.app.mathTab === 'piece'">Slot
    <select id="p-slot" @change="$store.app.piece.slot = $event.target.value">
      <template x-for="o in slotOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === $store.app.piece.slot"></option></template>
    </select>
  </label>
  <label class="mctl" x-show="$store.app.mathTab !== 'tiers'">1st substat
    <select id="p-s1" @change="setSub(0, $event.target.value)">
      <template x-for="o in substatOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === $store.app.piece.subs[0]"></option></template>
    </select>
  </label>
  <label class="mctl" x-show="$store.app.mathTab !== 'tiers'">2nd substat
    <select id="p-s2" @change="setSub(1, $event.target.value)">
      <template x-for="o in [['', 'none']].concat(substatOptions)" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === ($store.app.piece.subs[1] || '')"></option></template>
    </select>
  </label>
  <div class="helpwrap" x-show="$store.app.mathTab !== 'tiers'">
    <button type="button" class="help" id="m-help" :aria-expanded="String(helpOpen)" aria-controls="m-help-pop" title="How sync works" @click.stop="helpOpen = !helpOpen">?</button>
    <div class="backdrop" x-show="helpOpen" @click="helpOpen = false"></div>
    <div class="popover" id="m-help-pop" role="dialog" aria-label="How sync works" x-show="helpOpen" @click.outside="helpOpen = false">
      <h2>How sync works</h2>
      <ul class="facts">
        <li><b>Sync caps stats instead of scaling gear down.</b> A stat above its slot’s cap drops to the cap. A stat below the cap stays the same. (For the main stat and Vitality this is a guess; the Wiki covers substats only.)</li>
        <li><b>A piece at or below the synced item level</b> is untouched and keeps its materia.</li>
        <li><b>A piece above the synced item level</b> loses all its materia.</li>
        <li><b>Both substats on a piece have the same cap.</b> The 70% substat reaches the cap when the piece is about 120 item levels above the synced item level.</li>
        <li><b>Overgeared or melded depends on the gap.</b> From about 95 item levels above the synced item level, overgeared gear has more substat points than melded gear at the synced item level. Below that gap, the melded gear has more.
          <ul><li>At levels 50 and 60, where materia adds little, the gap is much smaller.</li></ul>
        </li>
        <li><b>Every job gets the same caps.</b> Only Vitality on healer and caster gear is lower (90%).</li>
        <li><b>Level sync</b> lowers your character level. <b>Item level sync</b> caps your gear’s item level. A duty can use both; the item level cap wins.</li>
      </ul>
      <p class="small dim">Sources: FFXIV Wiki, <a href="https://ffxiv.consolegameswiki.com/wiki/Item_Level" target="_blank" rel="noopener">Item Level</a> and <a href="https://ffxiv.consolegameswiki.com/wiki/Level_Sync" target="_blank" rel="noopener">Level Sync</a>; game data from <a href="https://github.com/xivapi/ffxiv-datamining" target="_blank" rel="noopener">ffxiv-datamining</a>.</p>
    </div>
  </div>
  <div class="ilctl small" x-show="$store.app.mathTab !== 'tiers'">
    <label for="p-range">Gear item level</label>
    <span class="bound" x-text="range[0]" :title="rangeNote"></span>
    <input type="range" id="p-range" :min="range[0]" :max="range[1]" step="1" :value="il" :title="rangeNote" @input="setIlvl($event.target.value)">
    <span class="bound" x-text="range[1]" :title="rangeNote"></span>
    <input type="number" id="p-ilvl" :min="range[0]" :max="range[1]" step="1" inputmode="numeric" :value="il" aria-label="Gear item level" @change="setIlvl($event.target.value)">
    <button type="button" class="chip" id="p-ilvl-reset" @click="resetIlvl()">Reset</button>
  </div>
  <template x-if="$store.app.mathTab === 'tiers'"><div style="display:contents">
  <button type="button" class="chip" id="t-fill" :disabled="!tierFillReady" :title="tierFillReady ? 'The optimizer result as the character panel shows it' : 'No optimizer result for these settings: open the Gear optimizer to get one'" @click="$dispatch('tier-fill')">Fill from the optimizer result</button>
  </div></template>
</div>

<p class="panel empty" id="m-off" x-show="!view && $store.app.mathTab !== 'tiers'" x-text="$store.app.sync ? 'Enter a sync cap (item level) at the top to see what sync does.' : 'No sync applies: item level sync is off and the synced level is the job’s level cap. Turn item level sync on and enter a cap, or lower the synced level, to see what sync does.'"></p>

<!-- PIECE STATS: one piece before and after sync, and the same slot at every item level -->
<section class="subtab" id="tab-piece" :hidden="$store.app.mathTab !== 'piece'">
<template x-if="view"><div class="twopanel">
  <div class="panel" id="p-piece">
    <h2>One piece, before and after sync</h2>
    <p class="small" id="p-lead" x-text="view.lead"></p>
    <div class="bars" id="p-bars">
      <template x-for="b in view.bars" :key="b.label">
        <div style="display:contents">
          <div class="small" x-text="b.label"></div>
          <div class="bar"><div class="keep" :style="`width:${b.keep}`"></div><div class="rise" :style="`left:${b.riseLeft};width:${b.rise}`"></div><div class="cut" :style="`left:${b.cutLeft};width:${b.cut}`"></div><div class="meld" x-show="b.melds" :style="`left:${b.meldLeft};width:${b.meldWidth}`"></div><div class="capmark" :style="`left:${b.capAt}`"></div></div>
          <div class="num"><span x-text="b.raw"></span> → <b x-text="b.total"></b><span class="gold" x-show="b.extra" x-text="` +${b.extra}`"></span><span class="meldtxt" x-show="b.melds" x-text="` +${b.melds}`"></span></div>
        </div>
      </template>
      <div class="small">Materia</div>
      <div class="chips" id="p-materia">
        <template x-for="(c, i) in view.stoneChips" :key="i"><span class="meldchip on" x-text="c"></span></template>
        <span class="meldchip" style="visibility: hidden" aria-hidden="true" x-show="!view.stoneChips.length">+0</span>
        <span class="small dim meldnote" x-text="view.meldNote"></span>
      </div>
    </div>
    <p class="small dim" x-show="view.goalNote" x-text="view.goalNote"></p>
    <div class="legend">
      <span><i class="box" style="background:var(--accent)"></i>Kept</span>
      <span x-show="view.bars.some(b => b.melds)"><i class="box meldbox"></i>Materia</span>
      <span><i class="hatch"></i>Cut by sync</span>
      <span><i class="box" style="background:var(--gold)"></i><span x-text="`More than an item level ${view.cap} piece has`"></span></span>
      <span><i style="background:var(--fg);width:2px"></i><span x-text="`Cap at item level ${view.cap}`"></span></span>
    </div>
    <div class="versus flat" id="p-vs">
      <div class="tablewrap"><table class="compact">
        <colgroup><col class="c-il"><col><col class="c-pts"></colgroup>
        <thead><tr><th>Item level</th><th>Materia</th><th class="n">In the duty</th></tr></thead>
        <tbody>
          <template x-for="r in view.vsRows" :key="r.il"><tr :class="{ solo: view.vsRows.length < 2 }"><td><span x-text="r.il"></span><div class="dim small" x-text="r.tag || ' '"></div></td><td><span x-text="r.materia"></span><div class="dim small" x-text="r.materiaNote || ' '"></div></td><td class="n" x-text="r.points"></td></tr></template>
          <tr class="spacer" aria-hidden="true" x-show="view.vsRows.length < 2"><td>&nbsp;<div class="small">&nbsp;</div></td><td><span x-text="view.vsRows[0].materia"></span><div class="small" x-text="view.vsRows[0].materiaNote || ' '"></div></td><td></td></tr>
        </tbody>
      </table></div>
      <p class="small"><b x-text="view.verdict || ' '"></b></p>
    </div>
  </div>
  <div class="panel" id="p-curve">
    <h2>Overgeared or melded: which has more?</h2>
    <div class="legend" id="p-curve-legend">
      <template x-for="b in view.curveBands" :key="b.label"><span><i :style="`background:${b.fill};opacity:${b.opacity}`"></i><span x-text="b.label"></span></span></template>
      <span><i class="dash"></i><span x-text="`Synced item level ${view.cap}`"></span></span>
      <span><i style="background:var(--fg);opacity:.12"></i>Overgeared ≥ melded</span>
    </div>
    <div class="chartbox" id="p-curve-chart" x-ref="pieceChart" x-html="view.curveChartSvg"></div>
    <p class="callout small" id="p-curve-note" x-show="view.curveNote" x-text="view.curveNote"></p>
  </div>
</div></template>

<details class="panel" id="p-steps">
  <summary>Each stat, step by step</summary>
  <div id="p-out" class="steps">
    <p class="steps-sum" x-text="calc.summary"></p>
    <p class="small" x-show="calc.byLevel" x-text="`Level sync: at level ${calc.level}, gear with a higher equip level is synced to item level ${calc.cap}, used as the cap here.`"></p>
    <div>
      <p class="small"><b>Where the numbers come from.</b> Every item level has a budget for each stat, and each slot takes a fixed share of it; with both rings the shares add up to the whole budget. <span x-text="calc.slotShare ? `The ${calc.slotName} takes ${calc.slotShare}` : 'An off-hand is the two-handed weapon’s value minus the one-handed weapon’s'"></span>; its best substat gets all of that (<b>100%</b>), the second <b>70%</b> of it.<span x-show="calc.healerNote"> Older healer gear (item level 135 and below) also carries a small Direct Hit line at 20%, outside these two.</span></p>
      <div class="slices" id="p-slices" role="img" aria-label="Each slot's share of the budget">
        <template x-for="(s, i) in calc.slices" :key="i"><span :class="{ on: s.on }" :style="`flex:${s.width}`"><b x-text="s.label"></b><i x-text="s.share"></i></span></template>
      </div>
    </div>
    <p class="steps-rule" x-show="calc.status !== 'off'"><b>In the duty, each stat is the lower of two numbers:</b> <span x-text="`what this ${calc.slotName} has, and what a ${calc.slotName} at the synced item level has (its ceiling).`"></span></p>
    <div class="tablewrap"><table class="compact steps-table">
      <thead><tr>
        <th>Stat</th>
        <th x-text="`This ${calc.slotName} (item level ${calc.il})`"></th>
        <th x-show="calc.status !== 'off'" x-text="`A ${calc.slotName} at item level ${calc.cap} (the ceiling)`"></th>
        <th class="n" x-show="calc.status !== 'off'">In the duty</th>
      </tr></thead>
      <tbody>
        <template x-for="r in calc.rows" :key="r.stat">
          <tr>
            <td><b x-text="r.label"></b><div class="dim small" x-text="r.w + '%'"></div></td>
            <td><span class="num big" :class="{ dim: !r.ownKept }" x-text="r.raw"></span> <span class="small why" x-text="r.ownText"></span><div class="formula" x-text="r.ownFormula"></div></td>
            <td x-show="calc.status !== 'off'"><span class="num big" :class="{ dim: r.ownKept }" x-text="r.cap"></span> <span class="small why" x-text="r.capText"></span><div class="formula" x-text="r.capFormula"></div></td>
            <td class="n" x-show="calc.status !== 'off'"><span class="big" :class="{ clamp: r.lost }" x-text="r.syn"></span><template x-if="r.lost"><div class="small clamp" x-text="`−${r.lost}`"></div></template></td>
          </tr>
        </template>
      </tbody>
    </table></div>
  </div>
</details>
</section>

<!-- GCD: a full set at the chosen item level against the same set at the cap -->
<section class="subtab" id="tab-gcd" hidden :hidden="$store.app.mathTab !== 'gcd'">
<template x-if="view"><div>
  <p class="panel small" id="g-none" x-show="!view.gcd" x-text="`The GCD needs ${view.spdLabel} as one of the two substats. Pick it in the 1st or 2nd substat menu above.`"></p>
  <template x-if="view.gcd"><div class="twopanel">
    <div class="panel" id="g-sets">
      <h2>Full set: two item levels compared</h2>
      <p class="small" x-text="`A full set (every slot, ${view.spdLabel} on every piece as one of the two substats) in a duty synced to ${view.cap}. At or below ${view.cap} each piece keeps its melds.`"></p>
      <div class="tablewrap"><table class="compact" id="g-table">
        <thead><tr><th>Set item level</th><th class="n" x-text="view.spdLabel"></th><th class="n">GCD</th><th class="n">Past last step</th><th class="n">To next step</th></tr></thead>
        <tbody><template x-for="r in view.gcd.rows" :key="r.il"><tr><td><span x-text="r.il"></span> <span class="dim" x-show="r.tag" x-text="`(${r.tag})`"></span></td><td class="n" x-text="r.spd"></td><td class="n" x-text="r.gcd.toFixed(2) + 's'"></td><td class="n" x-text="r.past"></td><td class="n" x-text="r.next ?? '–'"></td></tr></template></tbody>
      </table></div>
      <p class="small dim" x-text="`The GCD changes in 0.01 s steps. Points past the last step don’t shorten it until the next step (they still add a little DoT and auto-attack damage).${view.gcd.haste ? ` Includes ${view.gcd.haste}.` : ''}`"></p>
      <div class="versus" id="g-vs" x-show="view.gcd.verdict"><b x-text="view.gcd.verdict"></b></div>
    </div>
    <div class="panel" id="g-curve">
      <h2>Full set GCD by item level</h2>
      <p class="small" x-text="view.gcd.step != null ? `The set’s GCD by its item level. At level ${view.level}, one GCD step (0.01 s) is about ${view.gcd.step} ${view.spdLabel}.` : `The set’s GCD by its item level.`"></p>
      <div class="legend">
        <span><i style="background:var(--accent);height:2px"></i>Set at each item level</span>
          <span><i class="dash"></i><span x-text="`Synced item level ${view.cap}`"></span></span>
          <span><i style="background:var(--fg);opacity:.12"></i>Shorter GCD than the melded set</span>
      </div>
      <div class="chartbox" id="g-chart" x-ref="gcdChart" x-html="view.gcd.chartSvg"></div>
    </div>
  </div></template>
</div></template>
</section>

<!-- TIERS: every substat's tiers around its value (a ladder); not about sync, so it shows whatever the sync settings -->
<section class="subtab" id="tab-tiers" hidden :hidden="$store.app.mathTab !== 'tiers'" x-data="tierTable" @tier-fill.window="fill()" @keydown.escape.window="helpFor = null" @click.window="if (helpFor && !$event.target.closest('#t-pop, [data-help]')) helpFor = null">
<template x-if="view"><div class="panel" id="t-panel" x-ref="panel" style="position:relative">
  <div class="panelhead"><h2 id="t-title" x-text="view.title"></h2><span style="flex:1"></span>
    <span class="subtabs small"><button type="button" id="t-more" :aria-pressed="String(more)" @click="more = !more">More tiers</button></span></div>
  <div class="tablewrap"><table class="compact ladder" id="t-table">
    <colgroup><col class="lrowcol"><template x-for="(c, k) in view.cols" :key="k"><col :class="c.first ? 'gfirst' : ''"></template></colgroup>
    <thead>
      <tr><th rowspan="2"></th><template x-for="g in view.groups" :key="g.stat">
        <th class="n gfirst" :colspan="g.span" :data-stat="g.stat">
          <div class="lname"><span x-text="g.label"></span> <button type="button" class="help shelp" :data-help="g.stat" :aria-expanded="String(helpFor === g.stat)" aria-controls="t-pop" :title="`About ${g.label}`" @click.stop="toggleHelp(g.stat, $el)">?</button></div>
          <input type="number" min="0" step="1" inputmode="numeric" :data-n="g.stat" :value="g.value" :aria-label="`${g.label} on the character panel`" @change="type(g.stat, $el)">
          <div class="leff"><template x-for="(line, k) in g.lines" :key="k"><span class="lline" x-text="line"></span></template></div>
          <div class="lnote" x-show="g.note" x-text="g.note"></div>
        </th>
      </template></tr>
      <tr class="lcols"><template x-for="(n, k) in view.names" :key="k"><th class="n" :class="{ gfirst: n.first }" x-text="n.text"></th></template></tr>
    </thead>
    <tbody><template x-for="r in view.rows" :key="r.label"><tr :class="{ cur: r.cur }">
      <td class="lrow" x-text="r.label"></td>
      <template x-for="(c, k) in r.cells" :key="k"><td class="n" :class="{ gfirst: c.first, eff: c.eff, chg2: c.mark, hov: c.to && hover === c.to }" :data-to="c.to" :title="c.title" x-text="c.text" @click="c.to && pick(c.to)" @mouseenter="hover = c.to || ''" @mouseleave="hover = ''"></td></template>
    </tr></template></tbody>
    <tfoot><tr><td class="lrow"></td><template x-for="(f, k) in view.foot" :key="k"><td class="n small lfoot gfirst" :colspan="f.span"><span><b x-text="f.spare"></b> spare</span><span x-show="f.toNext != null"><b x-text="`+${f.toNext}`"></b> to next</span><span x-show="f.toNext == null">last tier</span></td></template></tr></tfoot>
  </table></div>
  <p class="small dim" id="t-note">Values include the base, as on the character panel. Click a tier to set the value to its start.<span x-show="view.haste" x-text="` The GCD includes ${view.haste}.`"></span></p>
  <div class="popover statpop" id="t-pop" x-ref="pop" role="dialog" :aria-label="help ? `About ${help.title}` : 'About this substat'" x-show="help" :style="`top:${helpAt.top}px;left:${helpAt.left}px`">
    <template x-if="help"><div><h3 x-text="help.title"></h3><p x-text="help.affects"></p><p x-text="help.size"></p></div></template>
  </div>
</div></template>
</section>

</section>

<!-- OPTIMIZER -->
<section class="tab" id="tab-opt" role="tabpanel" hidden :hidden="$store.app.tab !== 'opt'">
  <div style="display:contents" x-data="optimizer">
    <h2>Gear optimizer</h2>
    <div class="panel" id="o-controls">
      <div class="part" id="o-gear" role="group" aria-labelledby="o-gear-h">
        <h3 id="o-gear-h">Gear to search <span class="count" id="o-count" x-text="countText ? '· ' + countText : ''"></span></h3>
        <div class="grid">
          <div class="f multi" x-data="{ open: false }" @click.outside="open = false" @keydown.escape="open = false">
            <span id="o-exp-label">Expansion</span>
            <button type="button" class="multi-btn" id="o-exp" aria-haspopup="true" :aria-expanded="String(open)" aria-labelledby="o-exp-label o-exp" @click="open = !open" x-text="expSummary()"></button>
            <div class="multi-menu" id="o-exp-menu" role="group" aria-labelledby="o-exp-label" x-show="open" x-cloak>
              <template x-for="e in expansions" :key="e[0]">
                <label class="multi-opt"><input type="checkbox" :data-exp="e[0]" :checked="expShown(e[0])" @change="setExpShown(e[0], $event.target.checked)"><span x-text="e[1]"></span></label>
              </template>
            </div>
          </div>
          <label class="f">Item level from<input type="number" id="o-min" min="0" :max="$store.app.maxReal" inputmode="numeric" placeholder="any" x-model.debounce.300ms="$store.app.opt.min"></label>
          <label class="f">Item level to<input type="number" id="o-max" min="0" :max="$store.app.maxReal" inputmode="numeric" placeholder="any" x-model.debounce.300ms="$store.app.opt.max"></label>
          <label class="f">Equip level up to<input type="number" id="o-lvl" min="1" :max="$store.app.jobCtx.maxLevel" inputmode="numeric" x-model.debounce.300ms="$store.app.opt.lvl"></label>
        </div>
        <div class="row groups-row" id="o-groups" role="group" aria-labelledby="o-groups-label">
          <span class="dim small" id="o-groups-label">Gear groups</span>
          <template x-for="g in gearGroups" :key="g.key">
            <label class="chk"><input type="checkbox" :data-source="g.key" :checked="groupOn(g.key)" @change="setGroup(g.key, $event.target.checked)"><span x-text="g.label"></span></label>
          </template>
        </div>
      </div>
      <div class="part" id="o-goal" role="group" aria-labelledby="o-goal-h">
        <h3 id="o-goal-h">Goal</h3>
        <div class="grid">
          <label class="f">Maximize<select id="o-target" @change="$store.app.opt.target = $event.target.value">
            <template x-for="o in statOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === $store.app.opt.target"></option></template>
          </select></label>
          <label class="f">Tiebreak 1<select id="o-tb1" @change="$store.app.opt.tb = $event.target.value">
            <template x-for="o in tiebreakOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === $store.app.opt.tb"></option></template>
          </select></label>
          <label class="f">Tiebreak 2<select id="o-tb2" @change="$store.app.opt.tb2 = $event.target.value">
            <template x-for="o in tiebreakOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === $store.app.opt.tb2"></option></template>
          </select></label>
          <template x-if="$store.app.opt.food">
            <label class="f">Meal (HQ)<select id="o-food-pair" @change="$store.app.opt.foodPair = $event.target.value">
              <template x-for="o in foodOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === $store.app.opt.foodPair"></option></template>
            </select></label>
          </template>
        </div>
        <div class="gcd-row" id="o-gcd-row">
          <label class="f" for="o-gcd" x-text="view?.gcdUi?.label || 'Target GCD'"></label>
          <div class="row">
            <input type="number" id="o-gcd" min="0.5" max="2.5" step="0.01" inputmode="decimal" placeholder="Any" :disabled="$store.app.opt.target === 'spd'" x-model.debounce.300ms="$store.app.opt.gcd">
            <div class="seg" id="o-gcd-mode" role="radiogroup" aria-label="Target GCD mode" :class="{ off: $store.app.opt.target === 'spd' }">
              <label><input type="radio" name="o-gcd-mode" value="exact" :disabled="$store.app.opt.target === 'spd'" :checked="$store.app.opt.gcdMode === 'exact'" @change="$store.app.opt.gcdMode = 'exact'">exactly</label>
              <label><input type="radio" name="o-gcd-mode" value="min" :disabled="$store.app.opt.target === 'spd'" :checked="$store.app.opt.gcdMode === 'min'" @change="$store.app.opt.gcdMode = 'min'">or faster</label>
            </div>
            <span class="small dim" id="o-gcd-hint" x-text="view?.gcdUi?.hint || ''"></span>
          </div>
        </div>
        <template x-if="view?.gcdLine"><div class="gcd-line" id="o-gcd-line" :class="{ bad: view.gcdLine.bad }" x-text="view.gcdLine.text"></div></template>
        <div class="row switches">
          <label class="toggle"><input type="checkbox" role="switch" class="switch" id="o-melds" :checked="$store.app.opt.melds" @change="$store.app.opt.melds = $event.target.checked"><span>Materia</span></label>
          <label class="toggle"><input type="checkbox" role="switch" class="switch" id="o-food" :checked="$store.app.opt.food" @change="$store.app.opt.food = $event.target.checked"><span>Food</span></label>
          <label class="toggle" title="Rank the goal and tiebreaks by their tiers (the steps their effects move in) before their points"><input type="checkbox" role="switch" class="switch" id="o-by-tier" :checked="$store.app.opt.byTier" @change="$store.app.opt.byTier = $event.target.checked"><span>Rank by tier</span></label>
        </div>
      </div>
    </div>
    <div id="o-out">
      <div class="progress" id="o-busy" x-show="busy" x-cloak role="progressbar" aria-label="Solving"><span></span></div>
      <template x-if="view && view.kind === 'excluded'"><div class="panel"><div class="empty" id="o-excluded">No gear to search: no piece passes the filters under Gear to search.</div></div></template>
      <template x-if="view && view.kind === 'error'"><div class="panel"><div class="empty"><b class="bad">The optimizer could not rank this gear.</b><br><span x-text="view.message"></span></div></div></template>
      <template x-if="view && view.kind === 'nogcd'"><div class="panel"><div class="empty" id="o-nogcd">No set fits this GCD.</div></div></template>
      <template x-if="view && view.kind === 'infeasible'"><div class="panel"><div class="empty"><b class="bad">The search stopped at its step limit before finding a loadout.</b><br>Leave out more gear groups and try again.</div></div></template>
      <template x-if="view && view.kind === 'ok'"><div class="panel" id="o-result" :data-target="view.target">
        <div class="readout">
          <div><b x-text="view.total"></b><span x-text="view.totalLabel"></span></div>
          <div><b x-text="view.gcd + 's'"></b><span x-text="`GCD${view.hasteText} with ${view.spdText} · ${view.tierText}`"></span></div>
          <div><b x-text="'+' + view.dot + '%'"></b><span>DoT/HoT tick scaling</span></div>
        </div>
        <template x-if="view.byTier"><p class="small" id="o-held"><b>Ranked by tier:</b> <span x-text="view.heldText"></span>.</p></template>
        <p class="small dim" id="o-time" x-text="`Solved in ${solveMs} ms.`"></p>
        <div class="tablewrap menus" id="o-table"><table>
          <thead><tr><th>Slot</th><th>Item</th><th class="n">ilvl</th><template x-for="(h, k) in view.headers" :key="k"><th class="n" x-text="h"></th></template></tr></thead>
          <tbody>
            <template x-for="(r, i) in view.rows" :key="i">
              <tr>
                <td x-text="r.label"></td>
                <template x-if="!r.item"><td class="dim" :colspan="view.headers.length + 2" x-text="r.blockedBy ? 'covered by ' + r.blockedBy : 'empty (no copy left)'"></td></template>
                <template x-if="r.item"><td class="item">
                  <template x-if="!r.same"><span x-text="r.item.name"></span></template>
                  <template x-if="r.same"><div class="same" @click.outside="if (menuOpen === i) menuOpen = null" @keydown.escape="menuOpen = null">
                    <button type="button" class="same-btn" :aria-expanded="menuOpen === i" :title="`${r.same.count} pieces give the same result here`" @click="menuOpen = menuOpen === i ? null : i"><span x-text="r.item.name"></span><span class="same-count" x-text="`1 of ${r.same.count}`"></span></button>
                    <div class="same-menu" x-show="menuOpen === i" x-cloak>
                      <template x-for="g in r.same.groups" :key="g.label">
                        <div><div class="same-head" x-text="g.label"></div>
                          <template x-for="x in g.items" :key="x.key"><button type="button" class="same-item" :class="{ on: x.on }" @click="pick(i, x.key)"><span><span x-text="x.name"></span><template x-if="x.category"><span class="pill" :class="'cat-' + x.category.key" x-text="x.category.label"></span></template></span><span class="same-lvl" x-text="`${x.ilvl}, lvl ${x.lvl}`"></span></button></template>
                        </div>
                      </template>
                      <div class="same-foot" x-text="`All ${r.same.count} give the same result here (counted with the other rows as shown).`"></div>
                    </div>
                  </div></template>
                  <template x-if="r.from"><div class="from"><template x-if="r.category"><span class="pill" :class="'cat-' + r.category.key" x-text="r.category.label"></span></template><span x-text="r.from"></span></div></template>
                  <template x-if="r.meld"><div class="small dim meld" x-text="r.meld"></div></template>
                </td></template>
                <template x-if="r.item"><td class="n" x-text="r.item.ilvl"></td></template>
                <template x-for="(c, k) in (r.cells || [])" :key="k"><td class="n" :class="{ gold: c.gold }"><span x-show="c.value" x-text="c.value" :class="{ atcap: c.atCap }" :title="c.atCap ? 'At this piece’s cap' : null"></span><span class="dim" x-show="!c.value">0</span></td></template>
              </tr>
            </template>
            <tr class="total"><td>Total</td><td class="small dim">base + gear</td><td class="n"></td><template x-for="(v, k) in view.totals" :key="k"><td class="n" x-text="v"></td></template></tr>
            <template x-if="view.food">
              <tr class="food" id="o-food-row"><td>Food</td><td><span x-text="view.food.name"></span><div class="small dim" x-text="`HQ${view.food.best ? ', best for the goal' : ''}`"></div></td><td class="n" x-text="view.food.ilvl"></td><template x-for="(c, k) in view.food.cells" :key="k"><td class="n"><template x-if="c"><span x-text="`+${c.value}`"></span></template><template x-if="c && c.capped"><div class="small dim">max</div></template></td></template></tr>
            </template>
            <template x-if="view.food">
              <tr class="total" id="o-food-total"><td>With food</td><td class="small dim">base + gear + food</td><td class="n"></td><template x-for="(v, k) in view.food.totals" :key="k"><td class="n" x-text="v"></td></template></tr>
            </template>
            <tr class="tier" id="o-effect"><td>Effect</td><td class="small dim" x-text="view.food ? 'gear and food' : 'gear only, no food'"></td><td class="n"></td><template x-for="(c, k) in view.tiers" :key="k"><td class="n" :class="{ dim: c && c.zero }" x-text="c ? c.effect : ''"></td></template></tr>
            <tr class="tier" id="o-tier"><td>Tier</td><td class="small dim">spare · to next</td><td class="n"></td><template x-for="(c, k) in view.tiers" :key="k"><td class="n small" :class="{ dim: c && c.zero, held: c && c.held }" :title="c && c.held ? 'Held at this tier by Rank by tier' : null" x-text="c ? `${c.spare} · ${c.toNext == null ? '–' : '+' + c.toNext}` : ''"></td></template></tr>
            <tr class="tier" id="o-defense"><td>Defense</td><td class="defense" :colspan="view.headers.length + 2">Physical <b x-text="view.defense.phys.toLocaleString('en-US')"></b> · Magic <b x-text="view.defense.mag.toLocaleString('en-US')"></b> · <span class="dim" x-text="`−${view.defense.physPct}% / −${view.defense.magPct}% damage taken`"></span></td></tr>
          </tbody>
        </table></div>
        <template x-if="view.truncated"><div class="note small">Search hit its node limit, so this result may not be optimal. Leave out more gear groups.</div></template>
        <p class="small dim" id="o-wd-note" x-show="view.weaponFirst">Weapon damage comes first, before the goal.</p>
        <template x-if="view.relicsLeftOut"><p class="small dim" id="o-relic-note">Relic weapons with customizable substats are left out: the optimizer can’t model your choice yet.</p></template>
        <p class="small dim" id="o-total-note" x-text="`Totals match the character panel, apart from your clan's bonus to ${view.headers[0]} and ${view.headers[1]} (3 points at most).`"></p>
        <template x-if="view.food"><p class="small dim" id="o-food-note">Food (community formula).<span x-show="!view.gcdOn"> The gear set is the same with any meal.</span></p></template>
      </div></template>
    </div>
  </div>
</section>

<!-- GEAR BROWSER -->
<section class="tab" id="tab-browse" role="tabpanel" hidden :hidden="$store.app.tab !== 'browse'">
  <div class="panel" x-data="gear">
    <h2>Gear browser <span class="count" id="b-count" x-text="view ? '· ' + view.countText : ''"></span></h2>
    <div class="grid">
      <div class="f multi" x-data="{ open: false }" @click.outside="open = false" @keydown.escape="open = false">
        <span id="b-exp-label">Expansion</span>
        <button type="button" class="multi-btn" id="b-exp" aria-haspopup="true" :aria-expanded="String(open)" aria-labelledby="b-exp-label b-exp" @click="open = !open" x-text="expSummary()"></button>
        <div class="multi-menu" id="b-exp-menu" role="group" aria-labelledby="b-exp-label" x-show="open" x-cloak>
          <template x-for="e in expansions" :key="e[0]">
            <label class="multi-opt"><input type="checkbox" :data-exp="e[0]" :checked="expShown(e[0])" @change="setExpShown(e[0], $event.target.checked)"><span x-text="e[1]"></span></label>
          </template>
        </div>
      </div>
      <label class="f">Item level from<input type="number" id="b-min" min="0" :max="$store.app.maxReal" inputmode="numeric" placeholder="any" x-model.debounce.300ms="$store.app.browse.min"></label>
      <label class="f">Item level to<input type="number" id="b-max" min="0" :max="$store.app.maxReal" inputmode="numeric" placeholder="any" x-model.debounce.300ms="$store.app.browse.max"></label>
      <label class="f">Equip level up to<input type="number" id="b-lvl" min="1" :max="$store.app.jobCtx.maxLevel" inputmode="numeric" x-model.debounce.300ms="$store.app.browse.lvl"></label>
      <label class="f">Name contains<input type="text" id="b-q" autocomplete="off" x-model.debounce.300ms="$store.app.browse.q"></label>
      <label class="f">Slot<select id="b-type" @change="$store.app.browse.type = $event.target.value">
        <template x-for="o in typeOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === $store.app.browse.type"></option></template>
      </select></label>
      <label class="f">Sort by<select id="b-sort" @change="$store.app.browse.sort = $event.target.value">
        <template x-for="o in sortOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === $store.app.browse.sort"></option></template>
      </select></label>
    </div>
    <div class="row groups-row" id="b-groups" role="group" aria-labelledby="b-groups-label">
      <span class="dim small" id="b-groups-label">Gear groups</span>
      <template x-for="g in gearGroups" :key="g.key">
        <label class="chk"><input type="checkbox" :data-source="g.key" :checked="groupOn(g.key)" @change="setGroup(g.key, $event.target.checked)"><span x-text="g.label"></span></label>
      </template>
    </div>
    <div class="tablewrap tall"><table id="gear-table">
      <template x-if="view && !view.shown.length"><tbody><tr><td class="empty">No gear matches these filters.</td></tr></tbody></template>
      <template x-if="view && view.shown.length"><thead><tr><th>Item</th><th>Slot</th><th class="n">Lv</th><th class="n">ilvl</th><template x-for="s in job.stats" :key="s"><th class="n" x-text="job.short[s]"></th></template></tr></thead></template>
      <template x-if="view && view.shown.length"><tbody>
        <template x-for="x in view.shown" :key="x.key">
          <tr :data-key="x.key">
            <td><span x-text="x.name"></span><span class="hq" x-show="x.hq" title="High quality (crafted): stats include the HQ bonus">HQ</span></td><td><span x-text="x.slot"></span><span class="x2" x-show="x.copies === 2" title="Not Unique: can be worn on both ring fingers"> ×2</span></td><td class="n dim" x-text="x.lvl"></td><td class="n" x-text="x.ilvl"></td>
            <template x-for="(c, k) in x.cells" :key="k"><td :class="c.cls" x-text="c.text"></td></template>
          </tr>
        </template>
        <template x-if="view.hidden"><tr><td :colspan="job.stats.length + 4" class="dim small" x-text="view.hidden + ' more matches not shown. Narrow the filters to view them.'"></td></tr></template>
      </tbody></template>
    </table></div>
    <p class="small dim">This list is for looking gear up; the optimizer has its own filters under Gear to search. A ring marked ×2 is not Unique, so it can be worn on both hands. <span class="num">raw → synced</span> where sync bites (item level above the cap with item level sync on, or equip level above the synced level); craftable gear shows high-quality stats.</p>
  </div>

</section>
</div></template>

<footer>
  <span><span x-show="dataSource" x-text="dataSource + ' · '"></span>Speed formulas: AkhMorning · FINAL FANTASY XIV and its job icons © SQUARE ENIX CO., LTD. Unofficial fan tool.</span>
  <!-- BUILD_INFO -->
</footer>
</div>
<!-- SCRIPT -->
</body>
