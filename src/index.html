<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- STARTUP -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gear Sync Analysis</title>
<!-- the fonts load without blocking first paint: print-only until loaded, then for all media, so a stalled request
     cannot hold the page up; the system fallbacks in src/styles/fallbacks.css show until then (and without the request). No referrer:
     Google is not told which page asked -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@500;600&display=swap" media="print" onload="this.media='all'" referrerpolicy="no-referrer">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@500;600&display=swap" referrerpolicy="no-referrer"></noscript>
<!-- STYLES -->
</head>
<body>
<noscript><p style="margin:24px 16px;font:15px/1.5 system-ui,'Segoe UI',sans-serif">Gear Sync Analysis needs JavaScript. Turn JavaScript on for this page and reload.</p></noscript>
<!-- The page is the one element <gsa-app> (src/ui/elements/app/app-root.ts), drawn by the app script, which is the last thing in the
     file. Until it has started, the startup script (startup-failure.js) keeps the element unpainted and shows the boot shell below
     in its place, so the browser, which paints the markup above the script while it is still reading it, never shows a half-built
     page: no tab bar with no tab, and no Job and sync strip with no job. Drop-down choices are <gsa-select> elements, drawn inside
     the screen elements (elements/shared/select.ts). -->
<!-- The boot shell: what shows from the first paint until the page has started (startup-failure.js shows it, with the saved
     tab chosen, and removes it at the check; it is hidden without JavaScript). Not part of the page: no data-tab. -->
<div class="boot" id="boot" aria-hidden="true">
  <div class="pagetop">
    <header><h1>Gear Sync Analysis</h1></header>
    <nav class="tabs" aria-label="Sections">
      <a data-boot="sheets">Sheets</a>
      <a data-boot="browse">Gear browser</a>
      <a data-boot="math" class="aside">How the math works</a>
    </nav>
  </div>
  <div class="bootload"></div>
</div>
<gsa-app class="wrap"></gsa-app>
<!-- SCRIPT -->
</body>
</html>
