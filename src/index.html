<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gear Sync Analysis</title>
<!-- the fonts load without blocking first paint: print-only until loaded, then for all media, so a stalled request
     cannot hold the page up; the system fallbacks in styles.css show until then (and without the request). No referrer:
     Google is not told which page asked -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@500;600&display=swap" media="print" onload="this.media='all'" referrerpolicy="no-referrer">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@500;600&display=swap" referrerpolicy="no-referrer"></noscript>
<!-- STYLES -->
</head>
<body>
<!-- Number boxes bound to a setting use x-bind="$num(path, lo, hi, options)" (helpers.js numberField), which also sets
     the box's min and max from lo and hi. The gear filters and the sync cap take any number from 1 up, as typed (hi
     Infinity): a minimum above every item level is a filter nothing passes, and the page says so; restoreState holds
     a saved one to the real range. Their :max here, the end of the real range, only stops the arrow keys. The Target
     GCD takes TARGET_GCD_RANGE (settings.js): a higher value moves to 2.50.
     Dynamic <select>s render options with x-for and mark the current one with :selected (x-model on a select
     whose options are created by x-for can miss the initial value). -->
<!-- x-cloak (styles.css) keeps the page unpainted until Alpine has built it: the script is the last thing in the file, and
     the browser paints the markup above it while it is still reading it, so without it the Job and sync panel (shown
     until x-show runs) and the tab bar showed with no tab, and no job, for a moment before every first paint -->
<div class="wrap" x-data="page" x-cloak>
<header>
  <h1>Gear Sync Analysis<!-- BUILD_BADGE --></h1>
</header>

<!-- Closed (the default while a job is chosen): a one-line strip, as in prototype B17. Change opens the full panel,
     Close shuts it (settings.open, page.js). -->
<section class="panel" :class="{ jobline: !open }" aria-label="Job and sync settings" x-data="settings" x-show="$store.app.tab !== 'sheets'" :data-job="$store.app.job || ''">
  <div class="row" id="job-strip" x-show="!open"><span>Job: <b x-text="$store.app.job ? jobCtx.jobName : 'none chosen'"></b> &middot; <span id="job-line" x-text="lineText"></span></span><span style="flex:1"></span><button class="chip" id="job-change" type="button" x-ref="changeButton" aria-expanded="false" aria-controls="job-panel" @click="toggleOpen()">Change</button></div>
  <div class="settings" id="job-panel" x-show="open" @keydown.escape="closeOnEscape()">
    <div class="f jobpick">
      <div class="row"><span id="job-label">Job: <b id="job-name" x-text="$store.app.job ? jobCtx.jobName : 'none chosen'"></b></span><span style="flex:1"></span><button class="chip" id="reset" type="button" @click="requestReset()">Reset to defaults</button><button class="chip" id="job-close" type="button" x-ref="closeButton" aria-expanded="true" aria-controls="job-panel" @click="toggleOpen()">Close</button></div>
      <div class="jobrows" role="radiogroup" aria-labelledby="job-label">
        <template x-for="row in jobRows" :key="row.label">
          <div class="jobrow" role="group" :aria-label="row.label">
            <span class="jobrow-label" x-text="row.label"></span>
            <div class="jobicons">
            <template x-for="j in row.jobs" :key="j.id">
              <button type="button" class="jobbtn" role="radio" :data-job-id="j.id" :title="j.name" :aria-label="j.name"
                :aria-checked="String(j.id === $store.app.job)" @click="requestJob(j.id)"><img :src="j.icon" alt="" width="40" height="40"></button>
            </template>
            </div>
          </div>
        </template>
      </div>
    </div>
    <label class="f"><span>Synced level <span class="f-range" id="level-range" x-text="`1–${$store.app.jobCtx.maxLevel}`"></span></span>
      <input type="number" id="level" step="1" inputmode="numeric" x-bind="$num('level', 1, () => $store.app.jobCtx.maxLevel, { live: true })">
    </label>
    <div class="f field"><label for="cap">Synced item level <span class="f-range" id="cap-range" x-text="`1–${$store.app.maxReal}`"></span></label>
      <input type="number" id="cap" x-ref="cap" :disabled="!$store.app.sync" :max="$store.app.maxReal" step="1" inputmode="numeric"
        x-bind="$num('cap', 1, Infinity, { snap: false })" @input="onCapInput($event.target.value)" :class="{ invalid: !!capError, lowered: !!capLoweredNote }" :aria-invalid="String(!!capError)" aria-describedby="cap-error cap-lowered">
      <span class="field-error" id="cap-error" x-show="capError" x-text="capError"></span>
      <span class="field-note lowered" id="cap-lowered" x-show="capLoweredNote" x-text="capLoweredNote" aria-live="polite"></span>
    </div>
    <label class="f">Item level sync
      <span class="toggle"><input type="checkbox" role="switch" class="switch" id="sync" x-model="$store.app.sync"><span x-text="$store.app.sync ? 'On' : 'Off'"></span></span>
    </label>
  </div>
</section>

<!-- the tabs stay while the open tab has no job: each tab has its own Job and sync panel (the Sheets tab none: a sheet
     holds its own), so another tab may have one -->
<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="sheets" type="button" :aria-selected="String($store.app.tab === 'sheets')" @click="goTab('sheets')">Sheets</button>
  <button role="tab" data-tab="browse" type="button" :aria-selected="String($store.app.tab === 'browse')" @click="goTab('browse')">Gear browser</button>
  <button role="tab" data-tab="math" type="button" class="aside" :aria-selected="String($store.app.tab === 'math')" @click="goTab('math')">How the math works</button>
</nav>
<!-- SHEETS: the sheet manager, a sheet's page, the frame of a set page and their dialogs (components/sheets.js; the store
     $store.sheets is ui/sheet-store.js). No Job and sync panel on this tab: each sheet holds its own job, level and sync. -->
<section class="tab" id="tab-sheets" role="tabpanel" aria-label="Sheets" hidden :hidden="$store.app.tab !== 'sheets'" x-data="sheetsTab">
<div class="sheetsview">
  <p class="sr-only" id="sh-live" aria-live="polite" x-text="$store.sheets.announcement"></p>
  <p class="callout small" id="sh-unavailable" x-show="manager.unavailableText" x-text="manager.unavailableText"></p>
  <p class="callout small" id="sh-save-error" role="alert" x-show="$store.sheets.saveMessage" x-text="$store.sheets.saveMessage"></p>

  <!-- THE SHEET MANAGER: every sheet, in the user's order -->
  <template x-if="screen === 'sheets'"><div class="sheetsview" id="sh-manager">
    <div class="listhead"><h2 x-text="manager.title"></h2><span class="sp"></span>
      <template x-if="manager.showNewButton"><button type="button" class="primary" id="sh-new" :disabled="$store.sheets.busy" @click="openNewSheet()">New sheet</button></template>
    </div>
    <template x-if="$store.sheets.note"><p class="toast floating" role="status" x-text="$store.sheets.note"></p></template>
    <p class="small dim" x-show="manager.indexNote" x-text="manager.indexNote"></p>
    <template x-if="manager.empty"><div class="startcard" id="sh-empty">
      <h3 x-text="manager.emptyCard.title"></h3><p x-text="manager.emptyCard.text"></p>
      <button type="button" class="primary" id="sh-new-first" :disabled="$store.sheets.busy" @click="openNewSheet()" x-text="manager.emptyCard.buttonText"></button>
    </div></template>
    <template x-if="!manager.empty"><div class="tablewrap"><table class="sets sheetlist" id="sh-list">
      <thead><tr><template x-for="(c, k) in manager.columns" :key="k"><th :class="{ n: k === 3 }" x-text="c"></th></template></tr></thead>
      <tbody>
        <template x-for="(r, i) in manager.rows" :key="r.id">
          <tr :data-sheet="r.id" :class="{ dragging: dragging?.kind === 'sheet' && dragging.from === i, dropbefore: dropMark('sheet', i) === 'before', dropafter: dropMark('sheet', i) === 'after' }"
              @dragover="dragOver('sheet', i, $event)" @drop="drop('sheet', i, $event)">
            <td><div class="dragcell">
              <span class="draghandle" role="button" tabindex="0" :class="{ off: $store.sheets.busy }" :draggable="String(!$store.sheets.busy)" :aria-label="`Reorder ${r.name}: drag it, or press Up or Down arrow`"
                  @dragstart="dragStart('sheet', i, $event)" @dragend="dragEnd()" @keydown="handleKey('sheet', i, $event)"></span>
              <div class="dragbody">
                <a href="#" class="sname clipname" :title="r.name" @click.prevent="$store.sheets.openSheet(r.id)" x-text="r.name"></a>
                <span class="sorigin clipname" :title="r.hasDescription ? r.descriptionLine : null" x-text="r.descriptionLine"></span>
                <div class="rowacts">
                  <button type="button" class="linkbtn" @click="$store.sheets.openSheet(r.id)">Open</button>
                  <button type="button" class="linkbtn" :disabled="$store.sheets.busy" @click="openEditSheet(r.id)">Edit</button>
                  <button type="button" class="linkbtn" :disabled="$store.sheets.busy" @click="openCopy(r.id)">Copy</button>
                  <button type="button" class="linkbtn" :disabled="$store.sheets.busy" @click="askDelete('sheet', r.id)">Delete</button>
                </div>
              </div>
            </div></td>
            <td><span class="jobcell"><img class="jobico" :src="jobIcons[r.jobId]" alt="" width="24" height="24"><span x-text="r.jobName"></span></span></td>
            <td x-text="r.settingsText"></td><td class="n" x-text="r.setCount"></td><td x-text="r.created"></td><td x-text="r.changed"></td><td x-text="r.gameData"></td>
          </tr>
        </template>
      </tbody>
    </table></div></template>
    <p class="small dim" x-show="!manager.empty" x-text="manager.reorderHint"></p>
    <template x-if="manager.unreadable.length"><div class="panel" id="sh-unreadable">
      <h3 x-text="manager.unreadableTitle"></h3>
      <template x-for="u in manager.unreadable" :key="u.id"><div class="row"><span class="small" x-text="u.text"></span><span class="small dim" x-text="u.key"></span><span style="flex:1"></span><button type="button" class="chip" :disabled="$store.sheets.busy" @click="askDelete('unreadable', u.id)">Delete</button></div></template>
    </div></template>
  </div></template>

  <!-- A SHEET'S PAGE: its settings (level and item level sync applied as typed), then its gear sets -->
  <template x-if="screen === 'sheet' && page"><div class="sheetsview" id="sh-sheet">
    <div class="setline"><nav class="setcrumb" aria-label="Breadcrumb"><a href="#" @click.prevent="goCrumb('sheets')">Sheets</a><span class="csep" aria-hidden="true">/</span><span class="crumbhere clipname" aria-current="page" :title="page.name" x-text="page.name"></span>
      <span class="setsw" @click.outside="sheetMenu = false" @keydown.escape="sheetMenu = false">
        <button type="button" class="crumbmenubtn" id="sh-sheet-switch" aria-haspopup="menu" :aria-expanded="String(sheetMenu)" aria-label="Switch sheet" :disabled="$store.sheets.busy" @click="toggleSheetMenu($el.parentElement)"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11.9999 13.1714L16.9497 8.22168L18.3639 9.63589L11.9999 15.9999L5.63599 9.63589L7.0502 8.22168L11.9999 13.1714Z"/></svg></button>
        <template x-if="sheetMenu"><div class="setmenu" role="menu" id="sh-sheet-menu">
          <button type="button" role="menuitem" class="setitem setall" @click="sheetMenu = false; goCrumb('sheets')"><span x-text="`All sheets (${manager.rows.length})`"></span><svg class="setarrow" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.1717 12.0007L8.22192 7.05093L9.63614 5.63672L16.0001 12.0007L9.63614 18.3646L8.22192 16.9504L13.1717 12.0007Z"/></svg></button>
          <template x-for="r in manager.rows" :key="r.id"><button type="button" role="menuitem" class="setitem clipname" :class="{ cur: r.id === $store.sheets.sheetId }" :aria-current="r.id === $store.sheets.sheetId ? 'true' : null" :title="r.name" @click="sheetMenu = false; r.id === $store.sheets.sheetId || $store.sheets.openSheet(r.id)" x-text="r.name"></button></template>
          <button type="button" role="menuitem" class="setitem setnew" @click="sheetMenu = false; goCrumb('sheets'); openNewSheet()">+ New sheet</button>
        </div></template>
      </span></nav></div>
    <template x-if="$store.sheets.note"><p class="toast floating" role="status" x-text="$store.sheets.note"></p></template>
    <section class="panel" aria-label="Sheet settings">
      <div class="sheettop"><h2 class="clipname" :title="page.name" x-text="page.name"></h2><span class="sp"></span>
        <button type="button" id="sh-edit" :disabled="$store.sheets.busy" @click="openEditSheet($store.sheets.sheetId)">Edit name and description</button>
        <button type="button" id="sh-copy" :disabled="$store.sheets.busy" @click="openCopy($store.sheets.sheetId)">Copy sheet</button>
        <button type="button" class="danger" id="sh-delete" :disabled="$store.sheets.busy" @click="askDelete('sheet', $store.sheets.sheetId)">Delete sheet</button>
      </div>
      <p class="sheetdesc" id="sh-description" :class="{ dim: page.description.empty }" x-text="page.description.text"></p>
      <div class="sheetfields">
        <div class="f field"><span>Job <span class="f-range">fixed</span></span><span class="jobcell jobfixed"><img class="jobico" :src="jobIcons[page.job.id]" alt="" width="28" height="28"><b x-text="page.job.name"></b></span></div>
        <label class="f"><span>Level <span class="f-range" id="sh-level-range" x-text="page.level.rangeText"></span></span><input type="number" id="sh-level" step="1" inputmode="numeric" :disabled="$store.sheets.busy" x-bind="levelField"></label>
        <label class="f">Item level sync <span class="toggle"><input type="checkbox" role="switch" class="switch" id="sh-sync" :disabled="$store.sheets.busy" :checked="page.sync.on" @change="toggleSync($event.target.checked)"><span x-text="page.sync.on ? 'On' : 'Off'"></span></span></label>
        <label class="f"><span>Item level cap <span class="f-range" id="sh-cap-range" x-text="page.sync.rangeText"></span></span><input type="number" id="sh-cap" x-ref="sheetCap" step="1" inputmode="numeric" :max="page.sync.max" :disabled="$store.sheets.busy || !page.sync.on" x-bind="capField" @input="onCapInput($event.target.value)" :class="{ invalid: !!capError, lowered: !!capLoweredNote }" :aria-invalid="String(!!capError)" aria-describedby="sh-cap-error sh-cap-lowered">
          <span class="field-error" id="sh-cap-error" x-show="capError" x-text="capError"></span>
          <span class="field-note lowered" id="sh-cap-lowered" x-show="capLoweredNote" x-text="capLoweredNote" aria-live="polite"></span></label>
      </div>
      <p class="small dim" x-text="page.note"></p>
    </section>
    <div class="listhead"><h2 x-text="page.title"></h2><span class="sp"></span>
      <template x-if="!page.empty"><button type="button" class="primary" id="sh-new-set" :disabled="$store.sheets.busy" @click="$store.sheets.newSet()">New set</button></template>
    </div>
    <template x-if="page.empty"><div class="startcard" id="sh-no-sets">
      <h3 x-text="page.emptyCard.title"></h3><p x-text="page.emptyCard.text"></p>
      <button type="button" class="primary" id="sh-new-set-first" :disabled="$store.sheets.busy" @click="$store.sheets.newSet()">New set</button>
    </div></template>
    <template x-if="!page.empty"><div class="tablewrap"><table class="sets setlist" id="sh-sets">
      <thead><tr><th>Set</th><template x-for="c in page.columns" :key="c"><th class="n" x-text="c"></th></template></tr></thead>
      <tbody>
        <template x-for="(r, i) in page.rows" :key="r.id">
          <tr :data-set="r.id" :class="{ dragging: dragging?.kind === 'set' && dragging.from === i, dropbefore: dropMark('set', i) === 'before', dropafter: dropMark('set', i) === 'after' }"
              @dragover="dragOver('set', i, $event)" @drop="drop('set', i, $event)">
            <td><div class="dragcell">
              <span class="draghandle" role="button" tabindex="0" :class="{ off: $store.sheets.busy }" :draggable="String(!$store.sheets.busy)" :aria-label="`Reorder ${r.name}: drag it, or press Up or Down arrow`"
                  @dragstart="dragStart('set', i, $event)" @dragend="dragEnd()" @keydown="handleKey('set', i, $event)"></span>
              <div class="dragbody">
                <a href="#" class="sname clipname" :title="r.name" @click.prevent="$store.sheets.openSet(r.id)" x-text="r.name"></a>
                <template x-if="r.descriptionLine"><span class="sorigin clipname setnotes" :title="r.description" x-text="r.descriptionLine"></span></template>
                <span class="sorigin" x-text="r.originText"></span>
                <div class="rowacts">
                  <button type="button" class="linkbtn" :disabled="$store.sheets.busy" @click="openEditSet(r.id)">Edit</button>
                  <button type="button" class="linkbtn" :disabled="$store.sheets.busy" @click="$store.sheets.copySet(r.id)">Copy</button>
                  <button type="button" class="linkbtn" :disabled="$store.sheets.busy" @click="askDelete('set', r.id)">Delete</button>
                </div>
              </div>
            </div></td>
            <template x-for="f in r.figures" :key="f.key"><td class="n" x-text="f.text"></td></template>
          </tr>
        </template>
      </tbody>
    </table></div></template>
    <p class="small dim" x-show="!page.empty" x-text="page.reorderHint"></p>
  </div></template>

  <!-- A SET'S PAGE (components/set-page.js, nested here and made again for each set: the x-for keyed by the set's id).
       The sticky header (breadcrumb with the set switcher, the sheet's settings read-only, the set bar, the stat block),
       the set's notes, the gear table, the Fill settings dialog and the question before leaving. -->
  <template x-if="screen === 'set' && setHeader"><div class="sheetsview" id="sh-set">
  <template x-for="sid in [$store.sheets.setId]" :key="sid">
  <div class="setpage" x-data="setPage" @keydown="pageKey($event)">
    <div class="shead" x-ref="head" :class="{ sug: view.mode === 'suggestion', man: view.mode === 'draft' }">
      <div class="setline">
        <nav class="setcrumb" aria-label="Breadcrumb"><a href="#" @click.prevent="goCrumb('sheets')">Sheets</a><span class="csep" aria-hidden="true">/</span><a href="#" class="clipname" :title="setHeader.crumbs[1].text" @click.prevent="goCrumb('sheet')" x-text="setHeader.crumbs[1].text"></a><span class="csep" aria-hidden="true">/</span><span class="crumbhere clipname" aria-current="page" :title="setHeader.crumbs[2].text" x-text="setHeader.crumbs[2].text"></span>
          <span class="setsw" @click.outside="closeMenu('sets')">
            <button type="button" class="crumbmenubtn" id="sh-set-switch" x-ref="setsButton" aria-haspopup="menu" :aria-expanded="String(open === 'sets')" aria-label="Switch gear set" @click="toggleMenu('sets', $el.parentElement)"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11.9999 13.1714L16.9497 8.22168L18.3639 9.63589L11.9999 15.9999L5.63599 9.63589L7.0502 8.22168L11.9999 13.1714Z"/></svg></button>
            <template x-if="open === 'sets'"><div class="setmenu" role="menu" id="sh-set-menu">
              <button type="button" role="menuitem" class="setitem setall" @click="open = null; goCrumb('sheet')"><span x-text="`All gear sets (${sheet.sets.length})`"></span><svg class="setarrow" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.1717 12.0007L8.22192 7.05093L9.63614 5.63672L16.0001 12.0007L9.63614 18.3646L8.22192 16.9504L13.1717 12.0007Z"/></svg></button>
              <template x-for="s in sheet.sets" :key="s.id"><button type="button" role="menuitem" class="setitem clipname" :class="{ cur: s.id === saved.id }" :aria-current="s.id === saved.id ? 'true' : null" :title="s.name" @click="open = null; s.id === saved.id || $store.sheets.openSet(s.id)" x-text="s.name"></button></template>
              <button type="button" role="menuitem" class="setitem setnew" :disabled="$store.sheets.busy" @click="newSet()">+ New set</button>
            </div></template>
          </span>
        </nav>
        <span class="sp"></span>
        <span class="sheetro" id="sh-set-settings" role="group" aria-label="Sheet settings, read-only"><img class="jobico" :src="jobIcons[setHeader.jobId]" alt="" width="20" height="20"><span x-text="setHeader.settingsText"></span></span>
      </div>
      <div class="tbar"><div class="topline bline">
        <span class="namebox"><span class="setname clipname" id="sh-set-name" :title="saved.name" x-text="saved.name"></span><button type="button" class="iconbtn" id="sh-set-edit" aria-label="Edit the name and notes" :disabled="$store.sheets.busy" @click="openEditSet(saved.id)"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.7279 9.57627L14.3137 8.16206L5 17.4758V18.89H6.41421L15.7279 9.57627ZM17.1421 8.16206L18.5563 6.74785L17.1421 5.33363L15.7279 6.74785L17.1421 8.16206ZM7.24264 20.89H3V16.6473L16.435 3.21231C16.8256 2.82179 17.4587 2.82179 17.8492 3.21231L20.6777 6.04074C21.0682 6.43126 21.0682 7.06443 20.6777 7.45495L7.24264 20.89Z"/></svg></button></span>
        <template x-if="view.mode === 'suggestion'"><div class="sugbtns"><button type="button" class="primary applybtn" id="sh-apply" x-ref="apply" :disabled="view.apply.disabled" @click="applySuggestion()" x-text="view.apply.text"></button><button type="button" id="sh-discard" x-ref="discard" @click="discardSuggestion()">Discard</button></div></template>
        <div class="fillbar">
          <template x-if="view.mode !== 'suggestion' && !running"><button type="button" class="primary" id="sh-fill" x-ref="fill" :disabled="fillButton.disabled" @click="fill()" x-text="fillButton.text"></button></template>
          <template x-if="running"><span class="fillrun"><button type="button" class="primary" disabled>Solving…</button><button type="button" id="sh-cancel" x-ref="cancel" @click="cancelFill()">Cancel</button></span></template>
          <template x-if="goalSummary"><span class="small goalsum" id="sh-goal">for<b class="gtxt" x-text="goalSummary.goal"></b><span class="gcnt" x-text="goalSummary.count"></span></span></template>

            <label class="f">Tiebreak 1<select id="s-tb1" @change="setGoal(1, $event.target.value)"><template x-for="o in tiebreakOptions(1)" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === fillSettings.goal.tb"></option></template></select></label>
            <label class="f">Tiebreak 2<select id="s-tb2" @change="setGoal(2, $event.target.value)"><template x-for="o in tiebreakOptions(2)" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === fillSettings.goal.tb2"></option></template></select></label>
            <div class="f field gcd-field"><label for="s-gcd" x-text="gcdLabel"></label>
              <div class="row">
                <input type="number" id="s-gcd" step="0.01" inputmode="decimal" placeholder="Any" :disabled="fillSettings.goal.target === 'spd'" x-bind="fillField('gcd')">
                <div class="seg" role="radiogroup" aria-label="Target GCD mode" :class="{ off: fillSettings.goal.target === 'spd' }">
                  <label :class="{ on: fillSettings.goal.gcdMode === 'exact' }"><input type="radio" name="s-gcd-mode" value="exact" :disabled="fillSettings.goal.target === 'spd'" :checked="fillSettings.goal.gcdMode === 'exact'" @change="setGoalField('gcdMode', 'exact')">exactly</label>
                  <label :class="{ on: fillSettings.goal.gcdMode === 'min' }"><input type="radio" name="s-gcd-mode" value="min" :disabled="fillSettings.goal.target === 'spd'" :checked="fillSettings.goal.gcdMode === 'min'" @change="setGoalField('gcdMode', 'min')">or faster</label>
                </div>
              </div>
            </div>
          </div>
          <div class="row switches">
            <label class="toggle"><input type="checkbox" role="switch" class="switch" id="s-melds" :checked="fillSettings.goal.melds" @change="setGoalField('melds', $event.target.checked)"><span>Materia</span></label>
            <label class="toggle"><input type="checkbox" role="switch" class="switch" id="s-food" :checked="fillSettings.goal.food" @change="setGoalField('food', $event.target.checked)"><span>Food</span></label>
            <span class="grow"></span>
            <span class="rankwrap" @click.outside="rankHelp = false">
              <label class="toggle" :class="{ off: !fillSettings.goal.tb }" :title="fillSettings.goal.tb ? null : 'Set Tiebreak 1 to use spare points'"><input type="checkbox" role="switch" class="switch" id="s-by-tier" :disabled="!fillSettings.goal.tb" :checked="fillSettings.goal.byTier" @change="setGoalField('byTier', $event.target.checked)"><span>Spare points to tiebreaks</span></label>
              <button type="button" class="help shelp" x-ref="rankBtn" aria-controls="s-rank-pop" :aria-expanded="String(rankHelp)" title="About this switch" @click="rankHelp = !rankHelp; $nextTick(() => placeMenu($refs.rankPop, $refs.rankBtn))">?</button>
              <div class="popover statpop" x-ref="rankPop" id="s-rank-pop" role="dialog" aria-label="About Spare points to tiebreaks" x-show="rankHelp" x-cloak><p>Substats only improve at tiers, so points short of the next tier do nothing in game. This sends those spare points to your tiebreaks instead.</p></div>
            </span>
            <button type="button" class="primary run" id="s-fill" :disabled="fillButton.disabled || !!suggestion" @click="fill()" x-text="fillButton.text"></button>
          </div>
          <p class="small dim rank-note" id="s-rank-note" role="status" x-show="rankNote" x-text="rankNote"></p>
        </div>
      </div>
    </div></template>

    <!-- the question before leaving the page with a draft, a running Fill or a Fill result waiting -->
    <template x-if="leaveAsk"><div>
      <div class="dlgback" @click="answerLeave('keep')"></div>
      <div class="dlg" id="sh-leave" x-ref="leave" role="alertdialog" aria-modal="true" aria-labelledby="sh-leave-q">
        <p class="question" id="sh-leave-q" x-text="leaveQuestion"></p>
        <template x-if="leaveAsk.kind === 'draft'"><div class="dlgbtns"><button type="button" class="primary" id="sh-leave-apply" @click="answerLeave('apply')">Apply and leave</button><button type="button" id="sh-leave-discard" @click="answerLeave('discard')">Discard and leave</button><button type="button" id="sh-leave-keep" x-ref="leaveKeep" @click="answerLeave('keep')">Keep editing</button></div></template>
        <template x-if="leaveAsk.kind === 'running'"><div class="dlgbtns"><button type="button" id="sh-leave-go" @click="answerLeave('leave')">Leave and cancel the Fill</button><button type="button" class="primary" id="sh-leave-keep" x-ref="leaveKeep" @click="answerLeave('keep')">Keep waiting</button></div></template>
        <template x-if="leaveAsk.kind === 'result'"><div class="dlgbtns"><button type="button" id="sh-leave-go" @click="answerLeave('leave')">Leave and drop the result</button><button type="button" class="primary" id="sh-leave-keep" x-ref="leaveKeep" @click="answerLeave('keep')">Keep reviewing</button></div></template>
      </div>
    </div></template>
  </div>
  </template>
  </div></template>

  <!-- THE DIALOGS: one at a time; Escape cancels, Enter in a one-line box presses the main button, Tab stays inside -->
  <template x-if="dialog"><div>
    <div class="dlgback" @click="closeDialog()"></div>
    <div class="dlg" x-ref="dialog" id="sh-dialog" :class="{ wide: dialog.kind === 'new' || dialog.kind === 'copy' }" :role="dialog.kind === 'delete' ? 'alertdialog' : 'dialog'" aria-modal="true" aria-labelledby="sh-dlg-title" @keydown="dialogKey($event)">
      <template x-if="dialog.kind === 'delete'"><div style="display:contents">
        <p class="question" id="sh-dlg-title" x-text="dialogView.question"></p>
        <p class="small dim" x-text="dialogView.note"></p>
        <div class="dlgbtns"><p class="dlgerr" role="alert" x-show="dialog.error" x-text="dialog.error"></p><button type="button" class="danger" id="sh-dlg-ok" @click="submitDialog()" x-text="dialogView.buttonText"></button><button type="button" id="sh-dlg-cancel" @click="closeDialog()">Cancel</button></div>
      </div></template>
      <template x-if="dialog.kind !== 'delete'"><div style="display:contents">
        <h3 id="sh-dlg-title" x-text="dialogView.title"></h3>
        <label class="f">Name<input type="text" id="sh-dlg-name" autocomplete="off" :maxlength="dialogView.nameMax" :placeholder="dialogView.namePlaceholder ?? ''" :value="dialogName" @input="typeName($event.target.value)"></label>
        <template x-if="dialog.kind !== 'copy'"><label class="f"><span>Description <span class="f-range" x-text="dialog.description.length ? `${dialog.description.length} / ${dialogView.descriptionMax}` : 'optional'"></span></span><textarea id="sh-dlg-description" :rows="dialog.kind === 'new' ? 2 : 3" :maxlength="dialogView.descriptionMax" x-model="dialog.description"></textarea></label></template>
        <template x-if="dialog.kind === 'new'"><div class="f jobpick"><span id="sh-dlg-job">Job: <b x-text="dialogView.jobText"></b> <span class="f-range" x-text="dialogView.jobNote"></span></span>
          <div class="jobrows" role="radiogroup" aria-labelledby="sh-dlg-job"><template x-for="row in jobPicker" :key="row.label"><div class="jobrow" role="group" :aria-label="row.label"><span class="jobrow-label" x-text="row.label"></span><div class="jobicons"><template x-for="j in row.jobs" :key="j.id"><button type="button" class="jobbtn" role="radio" :data-job-id="j.id" :title="j.name" :aria-label="j.name" :aria-checked="String(j.id === dialog.job)" @click="chooseJob(j.id)"><img :src="j.icon" alt="" width="40" height="40"></button></template></div></div></template></div>
        </div></template>
        <template x-if="dialog.kind === 'copy'"><div class="f jobpick"><span id="sh-dlg-job">Job: <b x-text="dialogView.jobText"></b> <span class="f-range" x-text="dialogView.jobNote"></span></span>
          <div class="jobchoices" role="radiogroup" aria-labelledby="sh-dlg-job"><template x-for="j in dialogView.jobs" :key="j.id"><button type="button" class="jobchoice" role="radio" :data-job-id="j.id" :aria-checked="String(j.checked)" @click="chooseJob(j.id)"><img class="jobico" :src="jobIcons[j.id]" alt="" width="28" height="28"><span x-text="j.name"></span></button></template></div>
        </div></template>
        <template x-if="dialog.kind === 'new' || dialog.kind === 'copy'"><div class="dlgrow">
          <label class="f"><span>Level <span class="f-range" x-text="dialogView.level.rangeText"></span></span><input type="number" id="sh-dlg-level" step="1" inputmode="numeric" x-bind="formField('level')"></label>
          <label class="f">Item level sync <span class="toggle"><input type="checkbox" role="switch" class="switch" id="sh-dlg-sync" :checked="dialog.sync.on" @change="setFormSync($event.target.checked)"><span x-text="dialog.sync.on ? 'On' : 'Off'"></span></span></label>
          <label class="f"><span>Item level cap <span class="f-range" x-text="dialogView.cap.rangeText"></span></span><input type="number" id="sh-dlg-cap" step="1" inputmode="numeric" :max="dialogView.cap.max" :disabled="!dialog.sync.on" x-bind="formField('cap')" :class="{ lowered: !!formCapNote }" aria-describedby="sh-dlg-cap-lowered">
            <span class="field-note lowered" id="sh-dlg-cap-lowered" x-show="formCapNote" x-text="formCapNote" aria-live="polite"></span></label>
        </div></template>
        <template x-if="dialog.kind === 'copy' && dialogView.warning"><div class="clearwarn" role="group" aria-label="Pieces that will be cleared" id="sh-dlg-clear">
          <p><b x-text="dialogView.warning.title"></b> <span x-text="dialogView.warning.text"></span></p>
          <ul><template x-for="item in dialogView.warning.items" :key="item.key"><li><span class="dim" x-text="`${item.setName} ·`"></span> <span x-text="`${item.slotLabel}: ${item.name}`"></span></li></template></ul>
          <label class="ackline"><input type="checkbox" id="sh-dlg-ack" x-model="dialog.ack"><span x-text="dialogView.warning.ackText"></span></label>
        </div></template>
        <div class="dlgbtns"><p class="dlgerr" role="alert" x-show="dialog.error" x-text="dialog.error"></p><button type="button" class="primary" id="sh-dlg-ok" :disabled="!!dialogView.disabled" @click="submitDialog()" x-text="dialogView.buttonText"></button><button type="button" @click="closeDialog()">Cancel</button></div>
      </div></template>
    </div>
  </div></template>
</div>
</section>

<template x-if="!$store.app.job && $store.app.tab !== 'sheets'"><div class="panel empty" id="no-job">Choose a job above to see its gear.</div></template>
<template x-if="$store.app.job"><div style="display:contents">

<!-- THE MATH: what sync does to one piece (Piece stats) and to a full set's GCD (GCD), and the substats' tiers (Substat tiers);
     controls in a sticky bar, each shown on the sub-tabs it applies to -->
<section class="tab" id="tab-math" role="tabpanel" hidden :hidden="$store.app.tab !== 'math'" x-data="syncExplainer" @keydown.escape.window="helpOpen = false">
<div class="mathbar" id="m-bar">
  <nav class="subtabs" aria-label="Math views">
    <button data-sub="piece" type="button" :aria-pressed="String($store.app.mathTab === 'piece')" @click="$store.app.showSub('piece')">Piece stats</button>
    <button data-sub="gcd" type="button" :aria-pressed="String($store.app.mathTab === 'gcd')" @click="$store.app.showSub('gcd')">GCD</button>
    <button data-sub="tiers" type="button" :aria-pressed="String($store.app.mathTab === 'tiers')" @click="$store.app.showSub('tiers')">Substat tiers</button>
  </nav>
  <label class="mctl" x-show="$store.app.mathTab === 'piece'">Slot
    <select id="p-slot" @change="$store.app.piece.slot = $event.target.value">
      <template x-for="o in slotOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === $store.app.piece.slot"></option></template>
    </select>
  </label>
  <label class="mctl" x-show="$store.app.mathTab === 'piece'">1st substat
    <select id="p-s1" @change="setSub(0, $event.target.value)">
      <template x-for="o in substatOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === $store.app.piece.subs[0]"></option></template>
    </select>
  </label>
  <label class="mctl" x-show="$store.app.mathTab === 'piece'">2nd substat
    <select id="p-s2" @change="setSub(1, $event.target.value)">
      <template x-for="o in substat2Options" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === ($store.app.piece.subs[1] || '')"></option></template>
    </select>
  </label>
  <div class="helpwrap" x-show="$store.app.mathTab === 'piece'">
    <button type="button" class="help" id="m-help" :aria-expanded="String(helpOpen)" aria-controls="m-help-pop" title="How sync works" @click.stop="helpOpen = !helpOpen">?</button>
    <div class="backdrop" x-show="helpOpen" @click="helpOpen = false"></div>
    <div class="popover" id="m-help-pop" role="dialog" aria-label="How sync works" x-show="helpOpen" @click.outside="helpOpen = false">
      <h2>How sync works</h2>
      <ul class="facts">
        <li><b>Sync caps stats instead of scaling gear down.</b> A stat above its slot’s cap drops to the cap. A stat below the cap stays the same. (For the main stat and Vitality this is a guess; the Wiki covers substats only.)</li>
        <li><b>A piece at or below the synced item level</b> is untouched and keeps its materia.</li>
        <li><b>A piece above the synced item level</b> loses all its materia.</li>
        <li><b>Both substats on a piece have the same cap.</b> The 70% substat reaches the cap when the piece is about 120 item levels above the synced item level.</li>
        <li><b>Overgeared or melded depends on the gap.</b> From about 95 item levels above the synced item level, overgeared gear has more substat points than melded gear at the synced item level. Below that gap, the melded gear has more.
          <ul><li>At levels 50 and 60, where materia adds little, the gap is much smaller.</li></ul>
        </li>
        <li><b>Every job gets the same caps.</b> A few are lower (90%): Vitality on healer and caster gear, and the main stat and Vitality on gear for every job.</li>
        <li><b>Level sync</b> lowers your character level. <b>Item level sync</b> caps your gear’s item level. A duty can use both; the item level cap wins, up to the best gear made for the synced level.</li>
      </ul>
      <p class="small dim">Sources: FFXIV Wiki, <a href="https://ffxiv.consolegameswiki.com/wiki/Item_Level" target="_blank" rel="noopener">Item Level</a> and <a href="https://ffxiv.consolegameswiki.com/wiki/Level_Sync" target="_blank" rel="noopener">Level Sync</a>; game data from <a href="https://github.com/xivapi/ffxiv-datamining" target="_blank" rel="noopener">ffxiv-datamining</a>.</p>
    </div>
  </div>
  <div class="ilctl small" x-show="$store.app.mathTab === 'piece'">
    <label for="p-range">Gear item level</label>
    <span class="bound" x-text="ilvlRange[0]" :title="ilvlNote"></span>
    <input type="range" id="p-range" :min="ilvlRange[0]" :max="ilvlRange[1]" step="1" :value="il" :style="`--fill: ${ilvlFill}%`" :title="ilvlNote" @input="setIlvl($event.target.value)">
    <span class="bound" x-text="ilvlRange[1]" :title="ilvlNote"></span>
    <input type="number" id="p-ilvl" :min="ilvlRange[0]" :max="ilvlRange[1]" step="1" inputmode="numeric" :value="il" aria-label="Gear item level" @change="setIlvl($event.target.value)">
    <button type="button" class="chip" id="p-ilvl-reset" @click="resetIlvl()">Reset</button>
  </div>
  <!-- GCD: its own level, haste and speed ($store.app.gcd), whatever the job and sync -->
  <template x-if="$store.app.mathTab === 'gcd'"><div style="display:contents" x-data="gcdControls">
  <label class="mctl">Level
    <input type="number" id="g-level" class="tlevel" min="1" :max="gcdLevels" step="1" inputmode="numeric" :value="level" aria-label="Level of the GCD tab" :class="{ invalid: !!levelError }" :title="levelError || levelNote" :aria-invalid="String(!!levelError)" @input="typeLevel($el)" @change="typeLevel($el, true)">
    <span class="f-range" x-text="`1–${gcdLevels}`"></span>
  </label>
  <label class="mctl">Haste
    <select id="g-haste" @change="$store.app.gcd.haste = $event.target.value">
      <template x-for="o in hasteOptions" :key="o.value"><option :value="o.value" x-text="o.label" :selected="o.value === $store.app.gcd.haste"></option></template>
    </select>
  </label>
  <div class="ilctl small">
    <label for="g-range">Speed (base + gear + food)</label>
    <span class="bound" x-text="speedRange.base"></span>
    <input type="range" id="g-range" :min="speedRange.base" :max="speedRange.most" step="1" :value="speed" :style="`--fill: ${speedFill}%`" :title="`From the base at level ${level} to the most any job and sync can have there: the best gear with melds, and the best HQ meal`" @input="slide($event.target.value)">
    <span class="bound" id="g-most" x-text="speedRange.most" :title="`The most speed any job and sync can have at level ${level}`"></span>
    <input type="number" id="g-speed" :min="speedRange.base" :max="speedRange.most" step="1" inputmode="numeric" :value="speed" aria-label="Speed (base + gear + food)" @input="typeSpeed($el)" @change="typeSpeed($el, true)">
    <button type="button" class="chip" id="g-reset" @click="resetSpeed()">Reset</button>
  </div>
  </div></template>
  <!-- TIERS: its own level ($store.app.tiers) -->
  <template x-if="$store.app.mathTab === 'tiers'"><div style="display:contents" x-data="tierControls">
  <label class="mctl">Level
    <input type="number" id="t-level" class="tlevel" step="1" inputmode="numeric" x-bind="levelField" aria-label="Level of the tiers">
    <span class="f-range" id="t-level-range" x-text="`1–${$store.app.jobCtx.maxLevel}`"></span>
  </label>
  </div></template>
</div>

<p class="panel empty" id="m-off" x-show="!explainer && $store.app.mathTab === 'piece'" x-text="offText"></p>

<!-- PIECE STATS: one piece before and after sync, and the same slot at every item level -->
<section class="subtab" id="tab-piece" :hidden="$store.app.mathTab !== 'piece'">
<template x-if="explainer"><div class="twopanel">
  <div class="panel" id="p-piece">
    <h2>An example piece, before and after sync</h2>
    <p class="small dim" id="p-example" x-text="explainer.example"></p>
    <p class="small" id="p-lead" x-text="explainer.lead"></p>
    <div class="bars" id="p-bars">
      <template x-for="b in explainer.bars" :key="b.label">
        <div style="display:contents">
          <div class="small" x-text="b.label"></div>
          <div class="bar"><div class="keep" :style="`width:${b.keep}`"></div><div class="rise" :style="`left:${b.riseLeft};width:${b.rise}`"></div><div class="cut" :style="`left:${b.cutLeft};width:${b.cut}`"></div><div class="meld" x-show="b.melds" :style="`left:${b.meldLeft};width:${b.meldWidth}`"></div><div class="capmark" :style="`left:${b.capAt}`"></div></div>
          <div class="num"><span x-text="b.raw"></span> → <b x-text="b.total"></b><span class="gold" x-show="b.extra" x-text="` +${b.extra}`"></span><span class="meldtxt" x-show="b.melds" x-text="` +${b.melds}`"></span></div>
        </div>
      </template>
      <div class="small">Materia</div>
      <div class="chips" id="p-materia">
        <template x-for="(c, i) in explainer.stoneChips" :key="i"><span class="meldchip on" x-text="c"></span></template>
        <span class="meldchip" style="visibility: hidden" aria-hidden="true" x-show="!explainer.stoneChips.length">+0</span>
        <span class="small dim meldnote" x-text="explainer.meldNote"></span>
      </div>
    </div>
    <div class="legend">
      <span><i class="box" style="background:var(--accent)"></i>Kept</span>
      <span x-show="explainer.bars.some(b => b.melds)"><i class="box meldbox"></i>Materia</span>
      <span><i class="hatch"></i>Cut by sync</span>
      <span><i class="box" style="background:var(--gold)"></i><span x-text="`More than an item level ${explainer.cap} piece has`"></span></span>
      <span><i style="background:var(--fg);width:2px"></i><span x-text="`Cap at item level ${explainer.cap}`"></span></span>
    </div>
    <div class="versus flat" id="p-vs">
      <div class="tablewrap"><table class="compact">
        <colgroup><col class="c-il"><col><col class="c-pts"></colgroup>
        <thead><tr><th>Item level</th><th>Materia</th><th class="n">In the duty</th></tr></thead>
        <tbody>
          <template x-for="r in explainer.vsRows" :key="r.il"><tr :class="{ solo: explainer.vsRows.length < 2 }"><td><span x-text="r.il"></span><div class="dim small" x-text="r.tag || ' '"></div></td><td><span x-text="r.materia"></span><div class="dim small" x-text="r.materiaNote || ' '"></div></td><td class="n" x-text="r.points"></td></tr></template>
          <tr class="spacer" aria-hidden="true" x-show="explainer.vsRows.length < 2"><td>&nbsp;<div class="small">&nbsp;</div></td><td><span x-text="explainer.vsRows[0].materia"></span><div class="small" x-text="explainer.vsRows[0].materiaNote || ' '"></div></td><td></td></tr>
        </tbody>
      </table></div>
      <p class="small"><b x-text="explainer.verdict || ' '"></b></p>
    </div>
  </div>
  <div class="panel" id="p-curve">
    <h2>Overgeared or melded: which has more?</h2>
    <div class="legend" id="p-curve-legend">
      <template x-for="b in explainer.curveBands" :key="b.label"><span><i :style="`background:${b.fill};opacity:${b.opacity}`"></i><span x-text="b.label"></span></span></template>
      <span><i class="dash"></i><span x-text="`Synced item level ${explainer.cap}`"></span></span>
      <span><i style="background:var(--fg);opacity:.12"></i>Overgeared ≥ melded</span>
    </div>
    <div class="chartbox" id="p-curve-chart" x-ref="pieceChart" x-init="observeChart($el)" x-html="explainer.curveChartSvg"></div>
    <p class="callout small" id="p-curve-note" x-show="explainer.curveNote" x-text="explainer.curveNote"></p>
  </div>
</div></template>

<details class="panel" id="p-steps">
  <summary>Each stat, step by step</summary>
  <div id="p-out" class="steps">
    <p class="steps-sum" x-text="steps.summary"></p>
    <p class="small" x-show="steps.byLevel" x-text="steps.byLevelText"></p>
    <div>
      <p class="small"><b>Where the numbers come from.</b> Every item level has a budget for each stat, and each slot takes a fixed share of it; with both rings the shares add up to the whole budget. <span x-text="steps.shareText"></span>; its best substat gets all of that (<b>100%</b>), the second <b>70%</b> of it.<span x-show="steps.healerNote"> Older healer gear (item level 135 and below) also carries a small Direct Hit line at 20%, outside these two.</span></p>
      <div class="slices" id="p-slices" role="img" aria-label="Each slot's share of the budget">
        <template x-for="(s, i) in steps.slices" :key="i"><span :class="{ on: s.on }" :style="`flex:${s.width}`"><b x-text="s.label"></b><i x-text="s.share"></i></span></template>
      </div>
    </div>
    <p class="steps-rule" x-show="steps.status !== 'off'"><b>In the duty, each stat is the lower of two numbers:</b> <span x-text="steps.ruleText"></span></p>
    <div class="tablewrap"><table class="compact steps-table">
      <thead><tr>
        <th>Stat</th>
        <th x-text="steps.ownHead"></th>
        <th x-show="steps.status !== 'off'" x-text="steps.capHead"></th>
        <th class="n" x-show="steps.status !== 'off'">In the duty</th>
      </tr></thead>
      <tbody>
        <template x-for="r in steps.rows" :key="r.stat">
          <tr>
            <td><b x-text="r.label"></b><div class="dim small" x-text="r.w + '%'"></div></td>
            <td><span class="num big" :class="{ dim: !r.ownKept }" x-text="r.raw"></span> <span class="small why" x-text="r.ownText"></span><div class="formula" x-text="r.ownFormula"></div></td>
            <td x-show="steps.status !== 'off'"><span class="num big" :class="{ dim: r.ownKept }" x-text="r.cap"></span> <span class="small why" x-text="r.capText"></span><div class="formula" x-text="r.capFormula"></div></td>
            <td class="n" x-show="steps.status !== 'off'"><span class="big" :class="{ clamp: r.lost }" x-text="r.syn"></span><template x-if="r.lost"><div class="small clamp" x-text="`−${r.lost}`"></div></template></td>
          </tr>
        </template>
      </tbody>
    </table></div>
  </div>
</details>
</section>

<!-- GCD: how speed becomes the GCD at a level, on its own settings (views/gcd.js) -->
<section class="subtab" id="tab-gcd" hidden :hidden="$store.app.mathTab !== 'gcd'" x-data="gcdTab">
<div class="gcdgrid">
  <div class="panel" id="g-facts"><div class="gfacts"><template x-for="f in view.facts" :key="f.label"><div><b x-text="f.value"></b><span x-text="f.label"></span></div></template></div></div>
  <div class="panel" id="g-curve">
    <h2>Speed per 0.01 s, by level</h2>
    <p class="small dim">How much speed it takes to shorten the GCD by 0.01 s at each level. Click a bar to see that level.</p>
    <div class="chartbox" id="g-chart" x-ref="chart" x-html="view.chartSvg" @click="pickLevel($event)"></div>
  </div>
  <div class="panel" id="g-steps">
    <h2>GCD steps</h2>
    <table class="compact gsteps" id="g-table">
      <thead><tr><th class="n">Speed</th><th class="n">GCD</th><th class="n" title="How much speed (and haste) cut every cast and recast time, before rounding">Reduction</th></tr></thead>
      <tbody><template x-for="r in view.steps" :key="r.speed"><tr :class="{ cur: r.cur, out: r.out }" :title="r.out ? 'More than any job can have at this level' : `Use ${r.speed} speed`" @click="pickSpeed(r)"><td class="n" x-text="r.speed"></td><td class="n" x-text="r.gcd"></td><td class="n" x-text="r.cut"></td></tr></template></tbody>
    </table>
  </div>
</div>
</section>

<!-- TIERS: every substat's tiers around its value (a ladder); not about sync, so it shows whatever the sync settings -->
<section class="subtab" id="tab-tiers" hidden :hidden="$store.app.mathTab !== 'tiers'" x-data="tierTable" @keydown.escape.window="helpFor = null" @click.window="if (helpFor && !$event.target.closest('#t-pop, [data-help]')) helpFor = null">
<template x-if="view"><div id="t-panel" x-ref="panel" style="position:relative">
  <!-- a card per substat, each its own small table -->
  <div class="tiercards" id="t-table"><template x-for="g in view.cards" :key="g.stat"><div class="tablewrap"><table class="compact ladder" :data-stat="g.stat">
    <thead>
      <tr><th class="n" :colspan="g.names.length">
        <div class="lname"><span x-text="g.label"></span> <button type="button" class="help shelp" :data-help="g.stat" :aria-expanded="String(helpFor === g.stat)" aria-controls="t-pop" :title="`About ${g.label}`" @click.stop="toggleHelp(g.stat, $el)">?</button></div>
        <input type="number" min="0" step="1" inputmode="numeric" :data-n="g.stat" :value="g.value" :aria-label="`${g.label} on the character panel`" @change="type(g.stat, $el)">
        <div class="leff"><template x-for="(line, k) in g.lines" :key="k"><span class="lline" x-text="line"></span></template><span class="lline lhaste" x-show="g.haste" x-text="g.haste"></span></div>
      </th></tr>
      <tr class="lcols"><template x-for="(n, k) in g.names" :key="k"><th class="n" x-text="n"></th></template></tr>
    </thead>
    <tbody><template x-for="(r, i) in g.rows" :key="i"><tr>
      <template x-for="(c, k) in r" :key="k"><td class="n" :class="{ eff: c.eff, chg2: c.mark, cur: c.cur, hov: hover === c.to }" :data-to="c.to" :title="c.title" x-text="c.text" @click="pick(c.to)" @mouseenter="hover = c.to" @mouseleave="hover = ''"></td></template>
    </tr></template></tbody>
    <tfoot><tr><td class="n small lfoot" :colspan="g.names.length"><span><b x-text="g.foot.spare"></b> spare</span><span x-show="g.foot.toNext != null"><b x-text="`+${g.foot.toNext}`"></b> to next</span><span x-show="g.foot.toNext == null">last tier</span></td></tr></tfoot>
  </table></div></template></div>
  <div class="popover statpop" id="t-pop" x-ref="pop" role="dialog" :aria-label="help ? `About ${help.title}` : 'About this substat'" x-show="help" :style="`top:${helpAt.top}px;left:${helpAt.left}px`">
    <template x-if="help"><div><h3 x-text="help.title"></h3><p x-text="help.affects"></p><p x-text="help.size"></p></div></template>
  </div>
</div></template>
</section>

</section>

<!-- GEAR BROWSER -->
<section class="tab" id="tab-browse" role="tabpanel" hidden :hidden="$store.app.tab !== 'browse'">
  <div class="panel" x-data="gear" @keydown.window="slashToSearch($event)">
    <div class="titleline">
      <h2>Gear browser</h2>
      <span class="menu-search big-search"><input type="text" id="b-q" x-ref="search" placeholder="Search gear by name" autocomplete="off" :maxlength="searchMaxLength" aria-label="Search gear by name" x-model.debounce.300ms="$store.app.browse.q"><span class="kbd" x-show="!$store.app.browse.q" title="Press / to search">/</span><button type="button" class="clear" x-show="$store.app.browse.q" x-cloak aria-label="Clear the search" @click="$store.app.browse.q = ''; $refs.search.focus()">×</button></span>
      <span class="count" id="b-count" x-text="view ? view.countText : ''"></span>
    </div>
    <div class="pillline">
    <div class="slotpills" id="b-slots" role="group" aria-label="Slot">
      <template x-for="(p, k) in (view ? view.slots : [])" :key="p.key"><span style="display:contents"><template x-if="p.sep"><span class="sep" aria-hidden="true"></span></template><button type="button" :data-slot="p.key" :class="{ on: $store.app.browse.type === p.key }" :aria-pressed="String($store.app.browse.type === p.key)" :disabled="!p.count && $store.app.browse.type !== p.key" @click="$store.app.browse.type = p.key"><span x-text="p.label"></span><span class="n" x-text="p.count"></span></button></span></template>
    </div>
      <button type="button" class="resetbtn" id="b-reset" :class="{ off: !filtered }" :disabled="!filtered" :aria-hidden="String(!filtered)" title="Reset filters" aria-label="Reset filters" @click="resetBrowseFilters()">Reset</button>
    </div>
    <div class="grid browse-filters">
      <!-- INCLUDE expansion-menu.html id=b -->
      <label class="f"><span>Equip level <span class="f-range" x-text="`1–${$store.app.jobCtx.maxLevel}`"></span></span><input type="number" id="b-lvl" :max="$store.app.jobCtx.maxLevel" inputmode="numeric" x-bind="$num('browse.lvl', 1, Infinity, { empty: '' })"></label>
      <div class="f field ilvl-field"><span id="b-ilvl-label">Item level <span class="f-range" x-text="`1–${$store.app.maxReal}`"></span></span><div class="pair" role="group" aria-labelledby="b-ilvl-label"><input type="number" id="b-min" :max="$store.app.maxReal" inputmode="numeric" placeholder="min" aria-label="Item level min" x-bind="$num('browse.min', 1, Infinity, { empty: '' })"><span aria-hidden="true">–</span><input type="number" id="b-max" :max="$store.app.maxReal" inputmode="numeric" placeholder="max" aria-label="Item level max" x-bind="$num('browse.max', 1, Infinity, { empty: '' })"></div></div>
      <!-- INCLUDE gear-from-menu.html id=b -->
    </div>
    <template x-if="view"><div class="tablekey pageline">
      <nav class="pager" id="b-pages" aria-label="Pages" x-show="view.pageButtons.length"><button type="button" class="step" aria-label="Previous page" :disabled="!view.prevPage" @click="goPage(view.prevPage)">‹</button><template x-for="b in view.pageButtons" :key="b.key"><span style="display:contents"><template x-if="!b.page"><span class="gap" aria-hidden="true">…</span></template><template x-if="b.page"><button type="button" :aria-current="b.current ? 'page' : null" :aria-label="'Page ' + b.page" @click="goPage(b.page)" x-text="b.page"></button></template></span></template><button type="button" class="step" aria-label="Next page" :disabled="!view.nextPage" @click="goPage(view.nextPage)">›</button></nav>
      <p class="small dim" id="b-key" x-show="view.anySynced"><b class="atcap">48</b> maxed on this piece</p>
    </div></template>
    <div class="tablewrap tall" x-ref="rows"><table id="gear-table" @mouseover="$el.dataset.col = $event.target.closest('[data-col]')?.dataset.col ?? ''" @mouseleave="$el.dataset.col = ''">
      <template x-if="view && !view.shown.length"><tbody><tr><td class="empty">No gear matches these filters. <template x-if="filtered"><button type="button" class="linkbtn" @click="resetBrowseFilters()">Reset filters</button></template></td></tr></tbody></template>
      <template x-if="view && view.shown.length"><thead><tr><th :aria-sort="sortState('name')"><button type="button" class="sortbtn" data-sort="name" @click="sortBy('name')">Item</button></th><th>Slot</th><th class="n" data-col="lvl" :aria-sort="sortState('lvl')"><button type="button" class="sortbtn" data-sort="lvl" @click="sortBy('lvl')">Lv</button></th><th class="n" data-col="ilvl" :aria-sort="sortState('ilvl')"><button type="button" class="sortbtn" data-sort="ilvl" @click="sortBy('ilvl')">ilvl</button></th><template x-for="s in jobCtx.stats" :key="s"><th class="n" :data-col="s" :aria-sort="sortState(s)"><button type="button" class="sortbtn" :data-sort="s" :title="`Sort by synced ${jobCtx.label[s]}`" @click="sortBy(s)" x-text="jobCtx.short[s]"></button></th></template></tr></thead></template>
      <template x-if="view && view.shown.length"><tbody>
        <template x-for="x in view.shown" :key="x.key">
          <tr :data-key="x.key" :class="x.rowCls">
            <td><template x-for="(part, j) in x.nameParts" :key="j"><span :class="part.cls" x-text="part.text"></span></template><span class="hqg" role="img" aria-label="High quality" x-show="x.hq"></span></td><td><span x-text="x.slot"></span><span class="x2" title="Not Unique: can be worn on both ring fingers" x-show="x.twice"> ×2</span></td><td class="n dim" data-col="lvl" x-text="x.lvl"></td><td class="n" data-col="ilvl" x-text="x.ilvl"></td>
            <template x-for="c in x.cells" :key="c.col"><td :class="c.cls" :data-col="c.col" :data-was="c.was"><span :title="c.title" x-text="c.text"></span></td></template>
          </tr>
        </template>
      </tbody></template>
    </table></div>
  </div>

</section>
</div></template>

<footer>
  <span><span x-show="dataSource" x-text="dataSource + ' · '"></span>Speed formulas: AkhMorning · Icons: Remix Icon (Apache 2.0) · HQ symbol: Lodestone font via the ewwwin/ffxiv-symbol-fonts mirror · FINAL FANTASY XIV and its job icons © SQUARE ENIX CO., LTD. Unofficial fan tool. Code © 2026 redactedkai, MIT.</span>
  <!-- BUILD_INFO -->
</footer>
</div>
<!-- SCRIPT -->
</body>
</html>
