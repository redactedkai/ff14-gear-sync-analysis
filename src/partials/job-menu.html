<!-- The job menu: one line of 40 px job icons for each role, the chosen job lit. The Gear browser's strip and the math bar show it under
     their Job button (components/job-menu.js has the members it reads: jobMenuOpen, jobRows, menuJobId, requestJob).
     {{id}}: the menu's id; {{label}}: the id of the element that names it. -->
<div class="jobmenu" id="{{id}}" x-ref="jobMenu" x-show="jobMenuOpen" role="radiogroup" aria-labelledby="{{label}}">
  <template x-for="row in jobRows" :key="row.label">
    <div class="jobrow" role="group" :aria-label="row.label">
      <span class="jobrow-label" x-text="row.label"></span>
      <div class="jobicons">
        <template x-for="j in row.jobs" :key="j.id">
          <button
            type="button"
            class="jobbtn"
            role="radio"
            :data-job-id="j.id"
            :title="j.name"
            :aria-label="j.name"
            :aria-checked="String(j.id === menuJobId)"
            @click="requestJob(j.id)"><img :src="j.icon" alt="" width="40" height="40"></button>
        </template>
      </div>
    </div>
  </template>
</div>
