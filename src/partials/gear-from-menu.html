<!-- The "Gear categories" filter's menu, shared by the Gear browser and a set's Auto-fill settings: a Lit element (an island, see
     ui/elements/gear-browser/gear-categories.ts, with the tabs in gear-sections.ts). The component gives it the filter's settings
     (`filters`: exclude and market) and the pieces per box (`fromCounts`: null until the count is known) by x-effect, and takes the
     patch for the settings from its event (`setFilters`); x-ignore keeps Alpine out of the markup the element draws.
     {{id}}: the id prefix ('b' the browser, 's' the Auto-fill settings). -->
<div
  class="filter-island"
  x-effect="$el.firstElementChild.exclude = [...filters.exclude]; $el.firstElementChild.market = Boolean(filters.market); $el.firstElementChild.counts = fromCounts"
  @categories-change="setFilters($event.detail)">
  <gsa-gear-categories class="f multi" id-prefix="{{id}}" x-ignore></gsa-gear-categories>
</div>
