<!-- The Expansion filter's dropdown, shared by the Gear browser and a set's Fill settings (helpers.js expansionToggles).
     {{id}}: the id prefix ('b' the browser, 's' the Fill settings). -->
<div class="f multi" x-data="{ open: false }" @click.outside="open = false" @keydown.escape.window.capture="closeMenuOnEscape($data, $event, $refs.expBtn)" @resize.window="open && placeMenu($refs.expMenu, $refs.expBtn)" @scroll.window.capture="open && placeMenu($refs.expMenu, $refs.expBtn)">
  <span id="{{id}}-exp-label">Expansion</span>
  <button type="button" class="multi-btn" x-ref="expBtn" id="{{id}}-exp" aria-haspopup="true" :aria-expanded="String(open)" aria-labelledby="{{id}}-exp-label {{id}}-exp" @click="open = !open; $nextTick(() => placeMenu($refs.expMenu, $refs.expBtn))" x-text="expSummary()"></button>
  <div class="multi-menu" x-ref="expMenu" id="{{id}}-exp-menu" role="group" aria-labelledby="{{id}}-exp-label" x-show="open" x-cloak>
    <template x-for="e in expansions" :key="e.short">
      <label class="multi-opt"><input type="checkbox" :data-exp="e.short" :checked="expShown(e.short)" @change="setExpShown(e.short, $event.target.checked)"><span x-text="e.name"></span></label>
    </template>
  </div>
</div>
