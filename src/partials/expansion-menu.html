<!-- The Expansion filter's dropdown, shared by the Gear browser and a set's Auto-fill settings (components/filter-menus.js expansionToggles).
     {{id}}: the id prefix ('b' the browser, 's' the Auto-fill settings). -->
<div
  class="f multi"
  x-data="menuScope('{{id}}-exp', 'expBtn', '{{id}}' === 's' ? 'settings' : null)"
  @resize.window="filterMenuOpen && placeMenu($refs.expMenu, $refs.expBtn)"
  @scroll.window.capture="isOwnScroll($event, $refs.expMenu) || (filterMenuOpen && placeMenu($refs.expMenu, $refs.expBtn))">
  <span id="{{id}}-exp-label">Expansion</span>
  <button
    type="button"
    class="multi-btn"
    x-ref="expBtn"
    id="{{id}}-exp"
    aria-haspopup="true"
    :aria-expanded="String(filterMenuOpen)"
    aria-labelledby="{{id}}-exp-label {{id}}-exp"
    @click="toggleFilterMenu(); $nextTick(() => placeMenu($refs.expMenu, $refs.expBtn))"
    @keydown.arrow-down.prevent="openFilterMenu(); $nextTick(() => placeMenu($refs.expMenu, $refs.expBtn))"
    x-text="expSummary()"></button>
  <div
    class="multi-menu"
    x-ref="expMenu"
    id="{{id}}-exp-menu"
    role="group"
    aria-labelledby="{{id}}-exp-label"
    x-show="filterMenuOpen"
    x-cloak>
    <template x-for="e in expansions" :key="e.short">
      <label class="multi-opt"><input
        type="checkbox"
        :data-exp="e.short"
        :checked="expShown(e.short)"
        @change="setExpShown(e.short, $event.target.checked)"><span x-text="e.name"></span></label>
    </template>
  </div>
</div>
