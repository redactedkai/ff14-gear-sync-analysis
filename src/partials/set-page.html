<!-- A set's page (`setPage`, made again for each set): header, notes, gear table, the Food and stone menus, the Fill
     settings dialog and the leave question. Includes the Expansion and "Gear from" menus for the Fill settings.
     Included once, inside the Sheets tab's root in index.html. No keys. -->
<!-- A SET'S PAGE (components/set-page.js, nested here and made again for each set: the x-for keyed by the set's id).
     The sticky header (breadcrumb with the set switcher, the sheet's settings read-only, the set bar, the stat block),
     the set's notes, the gear table, the Fill settings dialog and the question before leaving. -->
<template x-if="screen === 'set' && setHeader"><div class="sheetsview" id="sh-set">
<template x-for="sid in [$store.sheets.setId]" :key="sid">
<div class="setpage" x-data="setPage" @keydown="pageKey($event)">
  <div class="shead" x-ref="head" :class="{ sug: view.mode === 'suggestion', man: view.mode === 'draft' }">
    <div class="setline">
      <nav class="setcrumb" aria-label="Breadcrumb"><a href="#" @click.prevent="goCrumb('sheets')">Sheets</a><span class="csep" aria-hidden="true">/</span><a href="#" class="clipname" :title="setHeader.crumbs[1].text" @click.prevent="goCrumb('sheet')" x-text="setHeader.crumbs[1].text"></a><span class="csep" aria-hidden="true">/</span><span class="crumbhere clipname" aria-current="page" :title="setHeader.crumbs[2].text" x-text="setHeader.crumbs[2].text"></span>
        <span class="setsw" @click.outside="closeMenu('sets')">
          <button type="button" class="crumbmenubtn" id="sh-set-switch" x-ref="setsButton" aria-haspopup="menu" :aria-expanded="String(open === 'sets')" aria-label="Switch gear set" @click="toggleMenu('sets', $el.parentElement)"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11.9999 13.1714L16.9497 8.22168L18.3639 9.63589L11.9999 15.9999L5.63599 9.63589L7.0502 8.22168L11.9999 13.1714Z"/></svg></button>
          <template x-if="open === 'sets'"><div class="setmenu" role="menu" id="sh-set-menu">
            <button type="button" role="menuitem" class="setitem setall" @click="open = null; goCrumb('sheet')"><span x-text="`All gear sets (${sheet.sets.length})`"></span><svg class="setarrow" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.1717 12.0007L8.22192 7.05093L9.63614 5.63672L16.0001 12.0007L9.63614 18.3646L8.22192 16.9504L13.1717 12.0007Z"/></svg></button>
            <template x-for="s in sheet.sets" :key="s.id"><button type="button" role="menuitem" class="setitem clipname" :class="{ cur: s.id === saved.id }" :aria-current="s.id === saved.id ? 'true' : null" :title="s.name" @click="open = null; s.id === saved.id || $store.sheets.openSet(s.id)" x-text="s.name"></button></template>
            <button type="button" role="menuitem" class="setitem setnew" :disabled="$store.sheets.busy" @click="newSet()">+ New set</button>
          </div></template>
        </span>
      </nav>
      <span class="sp"></span>
      <span class="sheetro" id="sh-set-settings" role="group" aria-label="Sheet settings, read-only"><img class="jobico" :src="jobIcons[setHeader.jobId]" alt="" width="20" height="20"><span x-text="setHeader.settingsText"></span></span>
    </div>
    <div class="tbar"><div class="topline bline">
      <span class="namebox"><span class="setname clipname" id="sh-set-name" :title="saved.name" x-text="saved.name"></span><button type="button" class="iconbtn" id="sh-set-edit" aria-label="Edit the name and notes" :disabled="$store.sheets.busy" @click="openEditSet(saved.id)"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.7279 9.57627L14.3137 8.16206L5 17.4758V18.89H6.41421L15.7279 9.57627ZM17.1421 8.16206L18.5563 6.74785L17.1421 5.33363L15.7279 6.74785L17.1421 8.16206ZM7.24264 20.89H3V16.6473L16.435 3.21231C16.8256 2.82179 17.4587 2.82179 17.8492 3.21231L20.6777 6.04074C21.0682 6.43126 21.0682 7.06443 20.6777 7.45495L7.24264 20.89Z"/></svg></button></span>
      <template x-if="view.mode === 'suggestion'"><div class="sugbtns"><button type="button" class="primary applybtn" id="sh-apply" x-ref="apply" :disabled="view.apply.disabled" @click="applySuggestion()" x-text="view.apply.text"></button><button type="button" id="sh-discard" x-ref="discard" @click="discardSuggestion()">Discard</button></div></template>
      <div class="fillbar">
        <template x-if="view.mode !== 'suggestion' && !running"><button type="button" class="primary" id="sh-fill" x-ref="fill" :disabled="fillButton.disabled" @click="fill()" x-text="fillButton.text"></button></template>
        <template x-if="running"><span class="fillrun"><button type="button" class="primary" disabled>Solving…</button><button type="button" id="sh-cancel" x-ref="cancel" @click="cancelFill()">Cancel</button></span></template>
        <template x-if="goalSummary"><span class="small goalsum" id="sh-goal">for<b class="gtxt" x-text="goalSummary.goal"></b><span class="gcnt" x-text="goalSummary.count"></span></span></template>
        <button type="button" class="linkbtn gearbtn" id="sh-settings" x-ref="gear" aria-label="Fill settings" :disabled="$store.sheets.busy" @click="openSettings()"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5.33409 4.54491C6.3494 3.63637 7.55145 2.9322 8.87555 2.49707C9.60856 3.4128 10.7358 3.99928 12 3.99928C13.2642 3.99928 14.3914 3.4128 15.1245 2.49707C16.4486 2.9322 17.6506 3.63637 18.6659 4.54491C18.2405 5.637 18.2966 6.90531 18.9282 7.99928C19.5602 9.09388 20.6314 9.77679 21.7906 9.95392C21.9279 10.6142 22 11.2983 22 11.9993C22 12.7002 21.9279 13.3844 21.7906 14.0446C20.6314 14.2218 19.5602 14.9047 18.9282 15.9993C18.2966 17.0932 18.2405 18.3616 18.6659 19.4536C17.6506 20.3622 16.4486 21.0664 15.1245 21.5015C14.3914 20.5858 13.2642 19.9993 12 19.9993C10.7358 19.9993 9.60856 20.5858 8.87555 21.5015C7.55145 21.0664 6.3494 20.3622 5.33409 19.4536C5.75952 18.3616 5.7034 17.0932 5.0718 15.9993C4.43983 14.9047 3.36862 14.2218 2.20935 14.0446C2.07212 13.3844 2 12.7002 2 11.9993C2 11.2983 2.07212 10.6142 2.20935 9.95392C3.36862 9.77679 4.43983 9.09388 5.0718 7.99928C5.7034 6.90531 5.75952 5.637 5.33409 4.54491ZM13.5 14.5974C14.9349 13.7689 15.4265 11.9342 14.5981 10.4993C13.7696 9.0644 11.9349 8.57277 10.5 9.4012C9.06512 10.2296 8.5735 12.0644 9.40192 13.4993C10.2304 14.9342 12.0651 15.4258 13.5 14.5974Z"/></svg></button>
      </div>
      <template x-if="view.mode === 'draft'"><div class="sugbtns"><button type="button" class="primary applybtn" id="sh-apply" x-ref="apply" :disabled="view.apply.disabled" @click="applyDraft()" x-text="view.apply.text"></button><button type="button" id="sh-discard" x-ref="discard" @click="discardDraft()">Discard</button></div></template>
      <span class="sp"></span>
      <button type="button" id="sh-set-copy" :disabled="$store.sheets.busy" @click="copySet()">Copy</button>
      <button type="button" class="danger" id="sh-set-delete" :disabled="$store.sheets.busy" @click="askDelete('set', saved.id)">Delete</button>
    </div></div>
    <template x-if="view.head.rows.length"><div class="totals tb3" id="sh-figures" :style="`--figs: ${view.head.names.length}`">
      <div class="crow hrow"><span class="cl"></span><template x-for="n in view.head.names" :key="n.key"><span class="cn" x-text="n.label"></span></template></div>
      <template x-for="(r, k) in view.head.rows" :key="k"><div class="crow" :class="{ after: r.after }"><span class="cl" :title="r.label" x-text="r.label"></span><template x-for="f in r.figures" :key="f.key"><span class="cc" :class="{ chg: !!f.change }" :data-fig="f.key"><template x-if="f.change"><em class="dl" :class="f.change.good ? 'good' : 'bad'"><svg class="dlarrow" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" :d="f.change.up ? 'M12 8L18 14H6L12 8Z' : 'M12 16L6 10H18L12 16Z'"/></svg><span x-text="f.change.text"></span></em></template><b :class="f.change ? 'chgfig' : ''" x-text="f.text"></b></span></template></div></template>
    </div></template>
  </div>
  <template x-if="setHeader.notes"><p class="setnotes" id="sh-set-notes" x-text="setHeader.notes"></p></template>
  <p class="small stale-note" id="sh-fill-line" role="alert" x-show="fillLine" x-text="fillLine"></p>
  <p class="small stale-note" id="sh-empty-note" x-show="view.suggest?.emptyNote" x-text="view.suggest?.emptyNote"></p>
  <template x-if="$store.sheets.note"><p class="toast floating" role="status" id="sh-toast" x-text="$store.sheets.note"></p></template>

  <div class="tablewrap menus settable" x-ref="table" :class="{ ghostlock: view.mode === 'suggestion' }" @click="tableClick($event)"><table class="coltint" id="sh-gear">
    <thead><tr><th>Slot</th><th>Item</th><th class="n" data-col="ilvl">ilvl</th><template x-for="h in view.rows.headers" :key="h.stat"><th class="n" :data-col="h.stat"><template x-if="h.rank"><i class="rk" :aria-label="h.rankLabel" x-text="h.rank"></i></template><span x-text="h.text"></span></th></template></tr></thead>
    <tbody>
      <template x-for="r in view.rows.rows" :key="r.index"><tr :data-row="r.index" :class="{ changed: r.changed, emptyrow: r.empty }">
        <td class="pnc"><button type="button" class="pinic" x-show="!r.empty" :class="{ on: r.pinned }" :aria-pressed="String(r.pinned)" :aria-label="`${r.label}: ${r.pinned ? 'pinned' : 'unpinned'}`" :title="r.pinned ? `${r.label}: pinned. Fill leaves it as it is. Click to unpin it.` : `${r.label}: unpinned. Fill may replace it. Click to pin it.`" :disabled="locked" @click="togglePin(r.index)"><svg x-show="r.pinned" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M22.3126 10.1753L20.8984 11.5895L20.1913 10.8824L15.9486 15.125L15.2415 18.6606L13.8273 20.0748L9.58466 15.8321L4.63492 20.7819L3.2207 19.3677L8.17045 14.4179L3.92781 10.1753L5.34202 8.76107L8.87756 8.05396L13.1202 3.81132L12.4131 3.10422L13.8273 1.69L22.3126 10.1753Z"/></svg><svg x-show="!r.pinned" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M13.8273 1.69L22.3126 10.1753L20.8984 11.5895L20.1913 10.8824L15.9486 15.125L15.2415 18.6606L13.8273 20.0748L9.58466 15.8321L4.63492 20.7819L3.2207 19.3677L8.17045 14.4179L3.92781 10.1753L5.34202 8.76107L8.87756 8.05396L13.1202 3.81132L12.4131 3.10422L13.8273 1.69ZM14.5344 5.22554L9.86358 9.89637L7.0417 10.4607L13.5418 16.9609L14.1062 14.139L18.7771 9.46818L14.5344 5.22554Z"/></svg></button><span class="pinspacer" x-show="r.empty"></span><span x-text="r.label"></span></td>
        <td class="item">
          <div class="same" @click.outside="closeMenu(`pick:${r.index}`)">
            <button type="button" class="same-btn" :class="{ 'choose-empty': r.empty }" :data-pick="r.index" :aria-expanded="String(open === `pick:${r.index}`)" :disabled="locked" @click="toggleMenu(`pick:${r.index}`, $el.parentElement)"><span><span x-text="r.empty ? r.emptyText : r.name"></span><template x-if="r.hq"><span class="hqg" role="img" aria-label="High quality"></span></template></span></button>
            <template x-if="open === `pick:${r.index}`"><div class="same-menu search-menu pick-menu" x-data="{ get pk() { return picker(r.index) } }">
              <div class="menu-tools"><span class="menu-search"><input type="text" autocomplete="off" aria-label="Search pieces" :placeholder="pk.placeholder" x-model="query"></span></div>
              <div class="menu-list" @click="pickClick($event, r.index)">
                <template x-if="pk.canEmpty"><button type="button" class="same-item" data-empty-slot><span>Empty this slot</span><span class="same-lvl"></span></button></template>
                <template x-for="g in pk.groups" :key="g.label"><div><div class="same-head" x-text="g.label"></div>
                  <template x-for="x in g.items" :key="x.key"><button type="button" class="same-item" :class="x.onClass" :data-game-id="x.key" :disabled="x.taken"><span><span x-text="x.name"></span><template x-if="x.hq"><span class="hqg" role="img" aria-label="High quality"></span></template><span :class="x.pillClass" x-text="x.pillLabel"></span><template x-if="x.unique"><span class="same-lvl" x-text="x.uniqueText"></span></template><span class="pick-subs" x-text="x.line"></span></span><span class="same-lvl" x-text="x.levels"></span></button></template>
                </div></template>
                <template x-if="pk.emptyText"><div class="menu-empty"><span x-text="pk.emptyText"></span> <template x-if="query.trim()"><button type="button" class="linkbtn" @click="query = ''">Clear search</button></template></div></template>
              </div>
              <div class="same-foot" x-text="pk.footText"></div>
            </div></template>
          </div>
          <template x-if="r.take"><label class="takebox"><input type="checkbox" :checked="r.take.taken" @change="setTake(r.index, $event.target.checked)"><span>Take <span class="dim" x-text="r.take.text"></span></span></label></template>
          <div class="from" x-show="!r.empty && (r.category || r.from)"><span class="pill" x-show="r.category" :class="r.category ? 'cat-' + r.category.key : ''" x-text="r.category?.label ?? ''"></span><span x-text="r.from ?? ''"></span></div>
          <template x-if="!r.empty && r.chips.length"><div class="slots"><template x-for="c in r.chips" :key="c.index"><span class="pop" @click.outside="closeMenu(`mat:${r.index}:${c.index}`)">
            <button type="button" class="mchip" :class="{ over: c.over, empty: c.empty, on: open === `mat:${r.index}:${c.index}`, 'cap-none': c.fit === 'none', removed: !!c.removed }" :data-chip="`${r.index}:${c.index}`" :title="c.removed === 'sync' ? 'Not counted: a synced piece keeps no materia' : c.removed ? 'Not counted' : null" :disabled="locked || c.locked" @click="toggleMenu(`mat:${r.index}:${c.index}`, $el.parentElement)" x-text="c.text"></button>
            <template x-if="open === `mat:${r.index}:${c.index}`"><div class="matpop" :class="{ all: matAll }" x-data="{ get m() { return materia(r.index, c.index) } }">
              <h5><span x-text="m.title"></span></h5>
              <template x-for="b in m.bands" :key="b.key"><div class="matgrid" :style="`grid-template-columns: 36px repeat(${m.columns}, 1fr)`"><span></span><template x-for="col in b.columns" :key="col.grade"><span class="h" :class="{ na: !col.ok }"><span x-text="col.roman"></span> <i x-text="`(${col.grade})`"></i></span></template><template x-if="m.showOdds"><span style="display:contents"><span class="s">odds</span><template x-for="col in b.columns" :key="col.grade"><span class="pc" :class="{ na: !col.ok }" x-text="col.odds"></span></template></span></template><template x-for="row in b.rows" :key="row.stat"><span style="display:contents"><span class="s" x-text="row.short"></span><template x-for="cell in row.cells" :key="cell.grade"><button type="button" :class="{ on: cell.on, na: !cell.ok, 'cap-none': cell.fit === 'none', 'cap-part': cell.fit === 'part' }" :data-stone="`${row.stat}:${cell.grade}`" :disabled="!cell.ok" @click="setStone(r.index, c.index, row.stat, cell.grade)" x-text="cell.ok ? cell.text : '–'"></button></template></span></template></div></template>
              <template x-if="m.highNote"><p class="rmnote" x-text="m.highNote"></p></template>
              <template x-if="m.nqNote"><p class="rmnote" x-text="m.nqNote"></p></template>
              <div class="matfoot"><span><template x-if="m.hasStone"><button type="button" class="linkish" :disabled="!m.canRemove" @click="removeStone(r.index, c.index)">Remove</button></template></span><button type="button" class="linkish" @click="matAll = !matAll" x-text="m.allText"></button><button type="button" class="linkish" @click="open = null">Close</button></div>
              <template x-if="m.removeNote"><p class="rmnote" x-text="m.removeNote"></p></template>
            </div></template>
          </span></template></div></template>
          <template x-if="!r.empty && !r.chips.length"><div class="small dim" x-text="r.noChipsText"></div></template>
        </td>
        <td class="n" data-col="ilvl" x-text="r.empty ? '' : r.ilvlText" :title="!r.empty && r.target ? `synced to item level ${r.target}` : null"></td>
        <template x-for="(h, k) in view.rows.headers" :key="h.stat"><td class="n" :data-col="h.stat"><span x-show="!r.empty" :class="{ atcap: r.cells?.[k].atCap, dim: r.cells?.[k].zero }"><span x-text="r.cells?.[k].text ?? ''"></span><template x-if="r.cells?.[k].beforeCap"><i class="lost" x-text="`(${r.cells[k].beforeCap})`"></i></template></span></td></template>
      </tr></template>
      <tr class="sect"><th :colspan="view.rows.headers.length + 3" x-text="view.rows.consumablesLabel"></th></tr>
      <tr class="food" id="sh-food-row" :class="{ changed: view.rows.food.changed }">
        <td class="pnc"><template x-if="!view.rows.food.empty"><button type="button" class="pinic" id="sh-meal-pin" :class="{ on: view.rows.food.pinned }" :aria-pressed="String(view.rows.food.pinned)" :aria-label="`Food: ${view.rows.food.pinned ? 'pinned' : 'unpinned'}`" :title="view.rows.food.pinned ? 'Food: pinned. Fill leaves it as it is. Click to unpin it.' : 'Food: unpinned. Fill may replace it. Click to pin it.'" :disabled="locked" @click="toggleMealPin()"><svg x-show="view.rows.food.pinned" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M22.3126 10.1753L20.8984 11.5895L20.1913 10.8824L15.9486 15.125L15.2415 18.6606L13.8273 20.0748L9.58466 15.8321L4.63492 20.7819L3.2207 19.3677L8.17045 14.4179L3.92781 10.1753L5.34202 8.76107L8.87756 8.05396L13.1202 3.81132L12.4131 3.10422L13.8273 1.69L22.3126 10.1753Z"/></svg><svg x-show="!view.rows.food.pinned" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M13.8273 1.69L22.3126 10.1753L20.8984 11.5895L20.1913 10.8824L15.9486 15.125L15.2415 18.6606L13.8273 20.0748L9.58466 15.8321L4.63492 20.7819L3.2207 19.3677L8.17045 14.4179L3.92781 10.1753L5.34202 8.76107L8.87756 8.05396L13.1202 3.81132L12.4131 3.10422L13.8273 1.69ZM14.5344 5.22554L9.86358 9.89637L7.0417 10.4607L13.5418 16.9609L14.1062 14.139L18.7771 9.46818L14.5344 5.22554Z"/></svg></button></template><template x-if="view.rows.food.empty"><span class="pinspacer"></span></template><span x-text="view.rows.food.label"></span></td>
        <td class="item">
          <div class="mealline"><div class="same" x-data="mealMenu(mealSource)" @click.outside="mealOpen = false" @keydown.escape.stop="mealOpen = false">
            <button type="button" class="same-btn" id="sh-meal-btn" :class="{ 'choose-empty': view.rows.food.empty }" :aria-expanded="String(mealOpen)" :disabled="locked" @click="toggleMealMenu()"><span><span x-text="view.rows.food.empty ? view.rows.food.emptyText : view.rows.food.name"></span><template x-if="!view.rows.food.empty"><span class="hqg" role="img" aria-label="High quality"></span></template></span><template x-if="view.rows.food.best.count"></template></button>
            <template x-if="mealOpen"><div class="same-menu search-menu meal-menu" id="sh-meal-menu">
              <div class="menu-tools">
                <span class="menu-search"><input type="text" x-ref="mealQuery" placeholder="Search meals" autocomplete="off" aria-label="Search meals" x-model="mealQuery"></span>
                <div class="meal-pills" role="group" aria-label="Meal stats"><template x-for="p in mealPills" :key="p.stat"><button type="button" class="meal-pill" :class="{ on: mealStats.includes(p.stat) }" :aria-pressed="String(mealStats.includes(p.stat))" :disabled="mealPillOff(p.stat)" :title="p.label" @click="toggleMealStat(p.stat)" x-text="p.short"></button></template></div>
                <template x-if="mealMenuView.hasBest"><label class="toggle"><input type="checkbox" role="switch" class="switch" :checked="mealBestOnly" @change="setMealBest($event.target.checked)"><span><span class="star" aria-hidden="true"></span>Best for goal</span></label></template>
              </div>
              <template x-if="mealView.sorts.length"><div class="meal-sort"><span id="sh-meal-sort-label">Sort</span><div class="seg" role="radiogroup" aria-labelledby="sh-meal-sort-label"><template x-for="o in mealView.sorts" :key="o.key"><label :class="{ on: mealSortBy === o.key }"><input type="radio" name="sh-meal-sort" :value="o.key" :checked="mealSortBy === o.key" @change="mealSortBy = o.key"><span x-text="o.label"></span></label></template></div></div></template>
              <div class="menu-list" x-ref="mealList" @click="mealClick($event)">
                <template x-if="mealMenuView.hasMeal"><button type="button" class="same-item" data-meal=""><span>No food</span><span class="same-lvl"></span></button></template>
                <template x-for="g in mealView.groups" :key="g.key"><div :data-group="g.key"><template x-if="g.label"><div class="same-head" x-text="g.label"></div></template>
                  <template x-for="x in g.items" :key="x.key"><button type="button" class="same-item meal-item" :class="x.rowClass" :data-meal="x.key" :title="x.title"><span class="meal-lead"><span class="meal-ilvl" x-text="x.ilvlText"></span><span class="meal-name" x-text="x.name"></span></span><span class="same-lvl meal-line"><span :class="x.line[0].cls" x-text="x.line[0].text"></span><span :class="x.line[1].cls" x-text="x.line[1].text"></span><span :class="x.line[2]?.cls" x-text="x.line[2]?.text" x-show="x.line[2]"></span></span></button></template>
                </div></template>
                <template x-if="mealView.empty"><div class="menu-empty"><span x-text="mealView.empty.text"></span> <button type="button" class="linkbtn" @click="mealQuery = ''">Clear search</button></div></template>
              </div>
            </div></template>
          </div><span class="small" x-show="view.rows.food.best.note"><span class="star" aria-hidden="true"></span><span class="sr-only" x-text="view.rows.food.best.note"></span></span></div>
          <template x-if="view.rows.food.take"><label class="takebox"><input type="checkbox" :checked="view.rows.food.take.taken" @change="setTake(null, $event.target.checked)"><span>Take <span class="dim" x-text="view.rows.food.take.text"></span></span></label></template>
        </td>
        <td class="n" data-col="ilvl" x-text="view.rows.food.ilvl ?? ''"></td>
        <template x-for="(h, k) in view.rows.headers" :key="h.stat"><td class="n" :data-col="h.stat"><template x-if="view.rows.food.cells[k]"><span><span x-text="view.rows.food.cells[k].text"></span><template x-if="view.rows.food.cells[k].capped"><span class="small dim capped">capped</span></template></span></template></td></template>
      </tr>
      <tr class="total" id="sh-total"><td x-text="view.totals.total.label"></td><td class="small dim" x-text="view.totals.total.emptyText"></td><td class="n"></td><template x-for="c in view.totals.total.cells" :key="c.stat"><td class="n" :data-col="c.stat" x-text="c.value"></td></template></tr>
      <tr class="tier" id="sh-tier"><td x-text="view.totals.tier.label"></td><td class="small dim" x-text="view.totals.tier.caption"></td><td class="n"></td><template x-for="(c, k) in view.totals.tier.cells" :key="k"><td class="n small" :class="{ dim: c && c.zero }" x-text="c ? c.text : ''"></td></template></tr>
      <tr class="tier" id="sh-defense"><td x-text="view.totals.defense.label"></td><td class="defense" :colspan="view.rows.headers.length + 2"><span x-text="view.totals.defense.phys.label"></span> <b x-text="view.totals.defense.phys.valueText"></b> <em><span class="defdot">·</span><span x-text="view.totals.defense.phys.pctText"></span></em> <span class="defsep">/</span> <span x-text="view.totals.defense.mag.label"></span> <b x-text="view.totals.defense.mag.valueText"></b> <em><span class="defdot">·</span><span x-text="view.totals.defense.mag.pctText"></span></em></td></tr>
    </tbody>
  </table></div>
  <template x-if="view.rows.anyAtCap"><p class="small dim" id="sh-cap-key"><span class="atcap">48</span> <span x-text="view.rows.capKeyText"></span></p></template>
  <p class="small dim" x-text="view.helpText"></p>
  <p class="small dim" x-text="view.clanNote"></p>

  <!-- the Fill settings (the gear icon): Gear to search and the goal, saved on the set as they change -->
  <template x-if="settingsOpen"><div>
    <div class="dlgback" @click="closeSettings()"></div>
    <div class="dlg wide cfgdlg" id="sh-settings-dialog" x-ref="settings" role="dialog" aria-modal="true" aria-labelledby="sh-cfg-title">
      <div class="cfghead"><h3 id="sh-cfg-title">Fill settings</h3><button type="button" class="linkbtn" aria-label="Close settings" @click="closeSettings()"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11.9997 10.5865L16.9495 5.63672L18.3637 7.05093L13.4139 12.0007L18.3637 16.9504L16.9495 18.3646L11.9997 13.4149L7.04996 18.3646L5.63574 16.9504L10.5855 12.0007L5.63574 7.05093L7.04996 5.63672L11.9997 10.5865Z"/></svg></button></div>
      <div class="part" role="group" aria-labelledby="s-gear-h">
        <h3 id="s-gear-h">Gear to search <span class="count" id="s-count" x-text="countText ? '· ' + countText : ''"></span></h3>
        <div class="grid">
          <!-- INCLUDE expansion-menu.html id=s -->
          <label class="f"><span>Equip level <span class="f-range" x-text="`1–${job.maxLevel}`"></span></span><input type="number" id="s-lvl" inputmode="numeric" x-bind="fillField('lvl')"></label>
          <div class="f field ilvl-field"><span id="s-ilvl-label">Item level <span class="f-range" x-text="`1–${$store.app.maxReal}`"></span></span><div class="pair" role="group" aria-labelledby="s-ilvl-label"><input type="number" id="s-min" :max="$store.app.maxReal" inputmode="numeric" placeholder="min" aria-label="Item level min" x-bind="fillField('min')"><span aria-hidden="true">–</span><input type="number" id="s-max" :max="$store.app.maxReal" inputmode="numeric" placeholder="max" aria-label="Item level max" x-bind="fillField('max')"></div></div>
          <!-- INCLUDE gear-from-menu.html id=s -->
        </div>
      </div>
      <div class="part" role="group" aria-labelledby="s-goal-h">
        <h3 id="s-goal-h">Goal</h3>
        <div class="grid">
          <label class="f">Maximize<select id="s-target" @change="setGoal(0, $event.target.value)"><template x-for="o in statOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === fillSettings.goal.target"></option></template></select></label>
          <label class="f">Tiebreak 1<select id="s-tb1" @change="setGoal(1, $event.target.value)"><template x-for="o in tiebreakOptions(1)" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === fillSettings.goal.tb"></option></template></select></label>
          <label class="f">Tiebreak 2<select id="s-tb2" @change="setGoal(2, $event.target.value)"><template x-for="o in tiebreakOptions(2)" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === fillSettings.goal.tb2"></option></template></select></label>
          <div class="f field gcd-field"><label for="s-gcd" x-text="gcdLabel"></label>
            <div class="row">
              <input type="number" id="s-gcd" step="0.01" inputmode="decimal" placeholder="Any" :disabled="targetIsSpeed" x-bind="fillField('gcd')">
              <div class="seg" role="radiogroup" aria-label="Target GCD mode" :class="{ off: targetIsSpeed }">
                <label :class="{ on: fillSettings.goal.gcdMode === 'exact' }"><input type="radio" name="s-gcd-mode" value="exact" :disabled="targetIsSpeed" :checked="fillSettings.goal.gcdMode === 'exact'" @change="setGoalField('gcdMode', 'exact')">exactly</label>
                <label :class="{ on: fillSettings.goal.gcdMode === 'min' }"><input type="radio" name="s-gcd-mode" value="min" :disabled="targetIsSpeed" :checked="fillSettings.goal.gcdMode === 'min'" @change="setGoalField('gcdMode', 'min')">or faster</label>
              </div>
            </div>
          </div>
        </div>
        <div class="row switches">
          <label class="toggle"><input type="checkbox" role="switch" class="switch" id="s-melds" :checked="fillSettings.goal.melds" @change="setGoalField('melds', $event.target.checked)"><span>Materia</span></label>
          <label class="toggle"><input type="checkbox" role="switch" class="switch" id="s-food" :checked="fillSettings.goal.food" @change="setGoalField('food', $event.target.checked)"><span>Food</span></label>
          <span class="grow"></span>
          <span class="rankwrap" @click.outside="rankHelp = false">
            <label class="toggle" :class="{ off: !fillSettings.goal.tb }" :title="fillSettings.goal.tb ? null : 'Set Tiebreak 1 to use spare points'"><input type="checkbox" role="switch" class="switch" id="s-by-tier" :disabled="!fillSettings.goal.tb" :checked="fillSettings.goal.byTier" @change="setGoalField('byTier', $event.target.checked)"><span>Spare points to tiebreaks</span></label>
            <button type="button" class="help shelp" x-ref="rankBtn" aria-controls="s-rank-pop" :aria-expanded="String(rankHelp)" title="About this switch" @click="rankHelp = !rankHelp; $nextTick(() => placeMenu($refs.rankPop, $refs.rankBtn))">?</button>
            <div class="popover statpop" x-ref="rankPop" id="s-rank-pop" role="dialog" aria-label="About Spare points to tiebreaks" x-show="rankHelp" x-cloak><p>Substats only improve at tiers, so points short of the next tier do nothing in game. This sends those spare points to your tiebreaks instead.</p></div>
          </span>
          <button type="button" class="primary run" id="s-fill" :disabled="fillButton.disabled || !!suggestion" @click="fill()" x-text="fillButton.text"></button>
        </div>
        <p class="small dim rank-note" id="s-rank-note" role="status" x-show="rankNote" x-text="rankNote"></p>
      </div>
    </div>
  </div></template>

  <!-- the question before leaving the page with a draft, a running Fill or a Fill result waiting -->
  <template x-if="leaveAsk"><div>
    <div class="dlgback" @click="answerLeave('keep')"></div>
    <div class="dlg" id="sh-leave" x-ref="leave" role="alertdialog" aria-modal="true" aria-labelledby="sh-leave-q">
      <p class="question" id="sh-leave-q" x-text="leaveQuestion"></p>
      <template x-if="leaveAsk.kind === 'draft'"><div class="dlgbtns"><button type="button" class="primary" id="sh-leave-apply" @click="answerLeave('apply')">Apply and leave</button><button type="button" id="sh-leave-discard" @click="answerLeave('discard')">Discard and leave</button><button type="button" id="sh-leave-keep" x-ref="leaveKeep" @click="answerLeave('keep')">Keep editing</button></div></template>
      <template x-if="leaveAsk.kind === 'running'"><div class="dlgbtns"><button type="button" id="sh-leave-go" @click="answerLeave('leave')">Leave and cancel the Fill</button><button type="button" class="primary" id="sh-leave-keep" x-ref="leaveKeep" @click="answerLeave('keep')">Keep waiting</button></div></template>
      <template x-if="leaveAsk.kind === 'result'"><div class="dlgbtns"><button type="button" id="sh-leave-go" @click="answerLeave('leave')">Leave and drop the result</button><button type="button" class="primary" id="sh-leave-keep" x-ref="leaveKeep" @click="answerLeave('keep')">Keep reviewing</button></div></template>
    </div>
  </div></template>
</div>
</template>
</div></template>
