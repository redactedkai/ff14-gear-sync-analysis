<!-- A set's page (`setPage`, made again for each set): header (with the set's notes), gear table, the Food and stone menus, the Auto-fill
     settings popover and the leave question. Includes the Expansion and "Gear categories" menus for the Auto-fill settings.
     Included once, inside the Sheets tab's root in index.html. No keys. -->
<!-- A SET'S PAGE (components/set-page.js, nested here and made again for each set: the x-for keyed by the set's id).
     The sticky header (breadcrumb with the set switcher, the sheet's settings read-only, the heading with the set's name,
     Edit, Copy, Delete and the notes, the set bar, the stat block), the gear table, the Auto-fill settings popover and the question
     before leaving. -->
<template x-if="screen === 'set' && setHeader"><div class="sheetsview" id="sh-set">
<template x-for="sid in [$store.sheets.setId]" :key="sid">
<div class="setpage" x-data="setPage" @keydown="pageKey($event)">
  <div class="shead" x-ref="head" :class="{ sug: view.mode === 'suggestion', man: view.mode === 'draft' }">
    <div class="setline">
      <nav class="setcrumb" aria-label="Breadcrumb"><a :href="$store.sheets.href()" @click="goCrumb('sheets', $event)">Sheets</a><span class="csep" aria-hidden="true">/</span><a
        :href="$store.sheets.href($store.sheets.sheetId)"
        class="clipname"
        :title="setHeader.crumbs[1].text"
        @click="goCrumb('sheet', $event)"
        x-text="setHeader.crumbs[1].text"></a><span class="csep" aria-hidden="true">/</span><span
        class="crumbhere clipname"
        aria-current="page"
        :title="setHeader.crumbs[2].text"
        x-text="setHeader.crumbs[2].text"></span>
        <!-- the set switcher: a Lit element (an island), given the rows by x-effect and telling the pick by an event; x-ignore
             keeps Alpine out of the markup the element draws -->
        <span class="setsw" x-effect="Object.assign($el.firstElementChild, setSwitcher)" @switch-pick="pickSet($event.detail)">
          <gsa-switch-menu x-ignore button-id="sh-set-switch" menu-id="sh-set-menu" button-label="Switch gear set" menu-label="Gear sets"></gsa-switch-menu>
        </span>
      </nav>
      <span class="sp"></span>
      <span class="sheetro" id="sh-set-settings" role="group" aria-label="Sheet settings, read-only"><img class="jobico" :src="jobIcons[setHeader.jobId]" alt="" width="20" height="20"><span x-text="setHeader.settingsText"></span></span>
    </div>
    <div class="setbox">
    <div class="setheading">
      <div class="sethd">
        <h2 class="setname" id="sh-set-name" :title="saved.name" x-text="saved.name"></h2>
        <p class="setnotes" id="sh-set-notes" :class="{ dim: setHeader.notes.empty }" x-text="setHeader.notes.text"></p>
      </div>
      <div class="setactions">
        <button type="button" id="sh-set-edit" :disabled="$store.sheets.busy" @click="openEditSet(saved.id, $el)"><svg class="btnicon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path
          fill="currentColor"
          d="M15.7279 9.57627L14.3137 8.16206L5 17.4758V18.89H6.41421L15.7279 9.57627ZM17.1421 8.16206L18.5563 6.74785L17.1421 5.33363L15.7279 6.74785L17.1421 8.16206ZM7.24264 20.89H3V16.6473L16.435 3.21231C16.8256 2.82179 17.4587 2.82179 17.8492 3.21231L20.6777 6.04074C21.0682 6.43126 21.0682 7.06443 20.6777 7.45495L7.24264 20.89Z"
        /></svg>Edit</button>
        <button type="button" id="sh-set-copy" :disabled="$store.sheets.busy" @click="copySet()"><svg class="btnicon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path
          fill="currentColor"
          d="M6.9998 6V3C6.9998 2.44772 7.44752 2 7.9998 2H19.9998C20.5521 2 20.9998 2.44772 20.9998 3V17C20.9998 17.5523 20.5521 18 19.9998 18H16.9998V20.9991C16.9998 21.5519 16.5499 22 15.993 22H4.00666C3.45059 22 3 21.5554 3 20.9991L3.0026 7.00087C3.0027 6.44811 3.45264 6 4.00942 6H6.9998ZM5.00242 8L5.00019 20H14.9998V8H5.00242ZM8.9998 6H16.9998V16H18.9998V4H8.9998V6Z"
        /></svg>Copy</button>
        <button
          type="button"
          class="danger"
          id="sh-set-delete"
          :disabled="$store.sheets.busy"
          @click="askDelete('set', saved.id, $el)"><svg class="btnicon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path
          fill="currentColor"
          d="M17 6H22V8H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V8H2V6H7V3C7 2.44772 7.44772 2 8 2H16C16.5523 2 17 2.44772 17 3V6ZM18 8H6V20H18V8ZM9 11H11V17H9V11ZM13 11H15V17H13V11ZM9 4V6H15V4H9Z"
        /></svg>Delete</button>
      </div>
    </div>
    <div class="tbar"><div class="topline bline">
      <!-- the bar follows the state: at rest Auto-fill, the goal and the gear; a draft, Apply and Discard; a result, Apply and Discard with the goal; a running Auto-fill, "Solving…" and Cancel -->
      <template x-if="view.mode === 'suggestion'"><div class="fillbar"><div class="sugbtns"><button
        type="button"
        class="primary applybtn"
        id="sh-apply"
        x-ref="apply"
        :disabled="view.apply.disabled"
        @click="applySuggestion()"
        x-text="view.apply.text"></button><button type="button" id="sh-discard" x-ref="discard" @click="discardSuggestion()">Discard</button></div>
        <span class="small goalsum" id="sh-goal">for<b class="gtxt" x-text="view.goalLine"></b></span>
      </div></template>
      <template x-if="view.mode === 'draft'"><div class="sugbtns"><button
        type="button"
        class="primary applybtn"
        id="sh-apply"
        x-ref="apply"
        :disabled="view.apply.disabled"
        @click="applyDraft()"
        x-text="view.apply.text"></button><button type="button" id="sh-discard" x-ref="discard" @click="discardDraft()">Discard</button></div></template>
      <template x-if="view.mode === 'rest' && running"><span class="fillrun"><span class="solving" role="status">Solving…</span><button type="button" id="sh-cancel" x-ref="cancel" @click="cancelFill()">Cancel</button></span></template>
      <template x-if="view.mode === 'rest' && !running"><div class="fillbar">
        <!-- Auto-fill comes up where Apply and Discard were: the second click of a double-click on them (detail 2) must not start a run -->
        <button
          type="button"
          class="primary"
          id="sh-fill"
          x-ref="fill"
          :disabled="fillButton.disabled"
          :title="fillButton.title"
          @click="$event.detail < 2 && fill()"
          x-text="fillButton.text"></button>
        <template x-if="goalSummary"><span class="small goalsum" id="sh-goal">for<b class="gtxt" x-text="goalSummary.goal"></b></span></template>
        <span class="gearwrap" x-ref="gearWrap">
          <button
            type="button"
            class="linkbtn gearbtn"
            id="sh-settings"
            x-ref="gear"
            aria-label="Auto-fill settings"
            :disabled="$store.sheets.busy"
            aria-haspopup="dialog"
            aria-controls="sh-settings-dialog"
            :aria-expanded="String(settingsOpen)"
            @click="toggleSettings()"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path
            fill="currentColor"
            d="M5.33409 4.54491C6.3494 3.63637 7.55145 2.9322 8.87555 2.49707C9.60856 3.4128 10.7358 3.99928 12 3.99928C13.2642 3.99928 14.3914 3.4128 15.1245 2.49707C16.4486 2.9322 17.6506 3.63637 18.6659 4.54491C18.2405 5.637 18.2966 6.90531 18.9282 7.99928C19.5602 9.09388 20.6314 9.77679 21.7906 9.95392C21.9279 10.6142 22 11.2983 22 11.9993C22 12.7002 21.9279 13.3844 21.7906 14.0446C20.6314 14.2218 19.5602 14.9047 18.9282 15.9993C18.2966 17.0932 18.2405 18.3616 18.6659 19.4536C17.6506 20.3622 16.4486 21.0664 15.1245 21.5015C14.3914 20.5858 13.2642 19.9993 12 19.9993C10.7358 19.9993 9.60856 20.5858 8.87555 21.5015C7.55145 21.0664 6.3494 20.3622 5.33409 19.4536C5.75952 18.3616 5.7034 17.0932 5.0718 15.9993C4.43983 14.9047 3.36862 14.2218 2.20935 14.0446C2.07212 13.3844 2 12.7002 2 11.9993C2 11.2983 2.07212 10.6142 2.20935 9.95392C3.36862 9.77679 4.43983 9.09388 5.0718 7.99928C5.7034 6.90531 5.75952 5.637 5.33409 4.54491ZM13.5 14.5974C14.9349 13.7689 15.4265 11.9342 14.5981 10.4993C13.7696 9.0644 11.9349 8.57277 10.5 9.4012C9.06512 10.2296 8.5735 12.0644 9.40192 13.4993C10.2304 14.9342 12.0651 15.4258 13.5 14.5974Z"
          /></svg></button>
          <template x-if="settingsOpen"><div class="setpop" id="sh-settings-dialog" data-overlay-layer="settings" x-ref="settings" role="dialog" aria-label="Auto-fill settings">
            <button type="button" class="dlgclose" aria-label="Close settings" @click="closeSettings()"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 10.5858L16.9497 5.63604L18.364 7.05025L13.4142 12L18.364 16.9497L16.9497 18.364L12 13.4142L7.05025 18.364L5.63604 16.9497L10.5858 12L5.63604 7.05025L7.05025 5.63604L12 10.5858Z"/></svg></button>
            <div class="part" role="group" aria-labelledby="s-goal-h">
              <h3 id="s-goal-h">Goal</h3>
              <div class="grid">
                <label class="f">Maximize<select id="s-target" @change="setGoal(0, $event.target.value)"><template x-for="o in statOptions" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === fillSettings.goal.target"></option></template></select></label>
                <label class="f">Tiebreak 1<select id="s-tb1" @change="setGoal(1, $event.target.value)"><template x-for="o in tiebreakOptions(1)" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === fillSettings.goal.tb"></option></template></select></label>
                <label class="f">Tiebreak 2<select id="s-tb2" @change="setGoal(2, $event.target.value)"><template x-for="o in tiebreakOptions(2)" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="o[0] === fillSettings.goal.tb2"></option></template></select></label>
                <div class="f field gcd-field"><label for="s-gcd" class="gcd-label"><span class="gcd-left" aria-hidden="true"><span x-text="gcdLabel.name"></span><template x-if="gcdLabel.range"><span> · <span class="gcd-range" x-text="gcdLabel.range"></span></span></template></span><template x-if="gcdLabel.haste || gcdLabel.off"><span class="gcd-side" aria-hidden="true" :title="gcdLabel.haste" x-text="gcdLabel.haste || gcdLabel.off"></span></template><span class="sr-only" x-text="gcdLabel.full"></span></label>
                  <div class="row">
                    <input
                      type="number"
                      id="s-gcd"
                      step="0.01"
                      inputmode="decimal"
                      placeholder="Any"
                      :disabled="targetIsSpeed"
                      x-bind="fillField('gcd')">
                    <div class="seg" role="radiogroup" aria-label="Target GCD mode" :class="{ off: targetIsSpeed }">
                      <label><input
                        type="radio"
                        name="s-gcd-mode"
                        value="exact"
                        :disabled="targetIsSpeed"
                        :checked="fillSettings.goal.gcdMode === 'exact'"
                        @change="setGoalField('gcdMode', 'exact')">exactly</label>
                      <label><input
                        type="radio"
                        name="s-gcd-mode"
                        value="min"
                        :disabled="targetIsSpeed"
                        :checked="fillSettings.goal.gcdMode === 'min'"
                        @change="setGoalField('gcdMode', 'min')">or faster</label>
                    </div>
                  </div>
                </div>
              </div>
              <div class="row switches">
                <label class="toggle"><input
                  type="checkbox"
                  role="switch"
                  class="switch"
                  id="s-melds"
                  :checked="fillSettings.goal.melds"
                  @change="setGoalField('melds', $event.target.checked)"><span>Materia</span></label>
                <label class="toggle"><input
                  type="checkbox"
                  role="switch"
                  class="switch"
                  id="s-food"
                  :checked="fillSettings.goal.food"
                  @change="setGoalField('food', $event.target.checked)"><span>Food</span></label>
                <span
                  class="rankwrap"
                  x-ref="rankWrap"
                  @resize.window="rankHelp && placeMenu($refs.rankPop, $refs.rankBtn)"
                  @scroll.window.capture="rankHelp && !isOwnScroll($event, $refs.rankPop) && placeMenu($refs.rankPop, $refs.rankBtn)">
                  <label class="toggle" :class="{ off: !fillSettings.goal.tb }"><input
                    type="checkbox"
                    role="switch"
                    class="switch"
                    id="s-by-tier"
                    :disabled="!fillSettings.goal.tb"
                    :checked="fillSettings.goal.byTier"
                    @change="setGoalField('byTier', $event.target.checked)"><span>Spare points to tiebreaks</span></label>
                  <button
                    type="button"
                    class="help shelp"
                    x-ref="rankBtn"
                    aria-controls="s-rank-pop"
                    :aria-expanded="String(rankHelp)"
                    @click="toggleRankHelp()">?</button>
                  <div
                    class="popover statpop"
                    x-ref="rankPop"
                    id="s-rank-pop"
                    role="dialog"
                    aria-label="About Spare points to tiebreaks"
                    x-show="rankHelp"
                    x-cloak><p>Substats only improve at tiers, so points short of the next tier do nothing in game. This sends those spare points to your tiebreaks instead.</p></div>
                </span>
              </div>
              <p class="small dim rank-note" id="s-rank-note" role="status" x-show="rankNote" x-text="rankNote"></p>
            </div>
            <div class="part" role="group" aria-labelledby="s-gear-h">
              <h3 id="s-gear-h">Gear to search <span class="count" id="s-count" :data-state="searchedCount === null ? 'pending' : 'ready'" x-text="countText ? '· ' + countText : ''"></span></h3>
              <div class="grid">
                <!-- INCLUDE expansion-menu.html id=s -->
                <label class="f"><span>Equip level <span class="f-range" x-text="`1–${job.maxLevel}`"></span></span><input type="number" id="s-lvl" inputmode="numeric" x-bind="fillField('lvl')"></label>
                <div class="f field ilvl-field"><span id="s-ilvl-label">Item level <span class="f-range" x-text="`1–${$store.app.maxReal}`"></span></span><div class="pair" role="group" aria-labelledby="s-ilvl-label"><input
                  type="number"
                  id="s-min"
                  inputmode="numeric"
                  placeholder="min"
                  aria-label="Item level min"
                  x-bind="fillField('min')"><span aria-hidden="true">–</span><input
                  type="number"
                  id="s-max"
                  inputmode="numeric"
                  placeholder="max"
                  aria-label="Item level max"
                  x-bind="fillField('max')"></div></div>
                <!-- INCLUDE gear-from-menu.html id=s -->
              </div>
            </div>
          </div></template>
        </span>
        <!-- No piece in the pool: the chip says why the Auto-fill button is off. Its text is also always in the page, as a spoken line (as the cap flags do). -->
        <template x-if="noPiecesFlag"><span class="nopieces" id="sh-no-pieces" :title="noPiecesFlag.full" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12.8659 3.00017L22.3922 19.5002C22.6684 19.9785 22.5045 20.5901 22.0262 20.8662C21.8742 20.954 21.7017 21.0002 21.5262 21.0002H2.47363C1.92135 21.0002 1.47363 20.5525 1.47363 20.0002C1.47363 19.8246 1.51984 19.6522 1.60761 19.5002L11.1339 3.00017C11.41 2.52187 12.0216 2.358 12.4999 2.63414C12.6519 2.72191 12.7782 2.84815 12.8659 3.00017ZM4.20568 19.0002H19.7941L11.9999 5.50017L4.20568 19.0002ZM10.9999 16.0002H12.9999V18.0002H10.9999V16.0002ZM10.9999 9.00017H12.9999V14.0002H10.9999V9.00017Z"/></svg><span x-text="noPiecesFlag.short"></span></span></template>
        <span class="sr-only" id="sh-no-pieces-note" role="status" x-text="noPiecesFlag ? noPiecesFlag.full : ''"></span>
      </div></template>
    </div></div>
    </div>
    <template x-if="view.head.rows.length"><div class="totals tb3" id="sh-figures" :style="`--figs: ${view.head.names.length}; --cols: ${view.head.columns}`">
      <div class="crow hrow"><span class="cl"></span><template x-for="n in view.head.names" :key="n.key"><span class="cn" x-text="n.label"></span></template></div>
      <template x-for="(r, k) in view.head.rows" :key="k"><div class="crow" :class="{ after: r.after, moved: r.moved }"><span class="cl" :title="r.label" x-text="r.label"></span><template x-for="f in r.figures" :key="f.key"><span class="cc" :class="{ chg: !!f.change }" :data-fig="f.key"><template x-if="f.change"><em class="dl" :class="f.change.good ? 'good' : 'bad'"><svg class="dlarrow" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" :d="f.change.up ? 'M12 8L18 14H6L12 8Z' : 'M12 16L6 10H18L12 16Z'"/></svg><span x-text="f.change.text"></span></em></template><b :class="f.change ? 'chgfig' : ''" x-text="f.shown ?? f.text"></b></span></template></div></template>
    </div></template>
  </div>
  <p class="small stale-note" id="sh-fill-line" role="alert" x-show="fillLine" x-text="fillLine"></p>
  <p class="small stale-note" id="sh-empty-note" x-show="view.suggest?.emptyNote" x-text="view.suggest?.emptyNote"></p>

  <div
    class="tablewrap menus settable"
    x-ref="table"
    :class="{ ghostlock: view.mode === 'suggestion' }"
    @click="tableClick($event)"><table class="coltint" id="sh-gear">
    <thead><tr><th>Slot</th><th>Item</th><th class="n" data-col="ilvl">ilvl</th><template x-for="h in view.rows.headers" :key="h.stat"><th class="n" :data-col="h.stat"><template x-if="h.rank"><i class="rk" x-text="h.rank"></i></template><span x-text="h.text"></span></th></template></tr></thead>
    <tbody>
      <template x-for="r in view.rows.rows" :key="r.index"><tr :data-row="r.index" :class="{ changed: r.changed, emptyrow: r.empty }">
        <td class="pnc"><button
          type="button"
          class="pinic"
          x-show="!r.empty"
          :class="{ on: r.pinned }"
          :aria-pressed="String(r.pinned)"
          :aria-label="`${r.label}: ${r.pinned ? 'pinned' : 'unpinned'}`"
          :disabled="locked"
          @click="togglePin(r.index)"><svg x-show="r.pinned" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path
          fill="currentColor"
          d="M22.3126 10.1753L20.8984 11.5895L20.1913 10.8824L15.9486 15.125L15.2415 18.6606L13.8273 20.0748L9.58466 15.8321L4.63492 20.7819L3.2207 19.3677L8.17045 14.4179L3.92781 10.1753L5.34202 8.76107L8.87756 8.05396L13.1202 3.81132L12.4131 3.10422L13.8273 1.69L22.3126 10.1753Z"
        /></svg><svg x-show="!r.pinned" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path
          fill="currentColor"
          d="M13.8273 1.69L22.3126 10.1753L20.8984 11.5895L20.1913 10.8824L15.9486 15.125L15.2415 18.6606L13.8273 20.0748L9.58466 15.8321L4.63492 20.7819L3.2207 19.3677L8.17045 14.4179L3.92781 10.1753L5.34202 8.76107L8.87756 8.05396L13.1202 3.81132L12.4131 3.10422L13.8273 1.69ZM14.5344 5.22554L9.86358 9.89637L7.0417 10.4607L13.5418 16.9609L14.1062 14.139L18.7771 9.46818L14.5344 5.22554Z"
        /></svg></button><span class="pinspacer" x-show="r.empty"></span><span x-text="r.label"></span></td>
        <td class="item">
          <div class="same">
            <button
              type="button"
              class="same-btn"
              :class="{ 'choose-empty': r.empty && !r.covered, covered: r.covered }"
              :data-pick="r.index"
              :data-empty="String(r.empty)"
              :aria-expanded="String(open === `pick:${r.index}`)"
              :aria-disabled="r.covered ? 'true' : null"
              :aria-describedby="r.shieldNote ? `shield-note-${r.index}` : null"
              :title="r.shieldNote || r.coveredTitle"
              :disabled="locked"
              @click="r.covered || toggleMenu(`pick:${r.index}`, $el.parentElement)"><span><span x-text="r.empty ? r.emptyText : r.name"></span><template x-if="r.hq"><span class="hqg" role="img" aria-label="High quality"></span></template></span></button>
            <template x-if="open === `pick:${r.index}`"><div class="same-menu search-menu pick-menu" x-data="{ get pk() { return picker(r.index) } }">
              <div class="menu-tools"><span class="menu-search"><input type="text" autocomplete="off" aria-label="Search pieces" :placeholder="pk.placeholder" x-model="query"></span><template x-if="pk.canEmpty"><button type="button" class="menu-clear" data-empty-slot aria-label="Empty this slot" @click="pick(r.index, null)"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M12 10.5858L16.9497 5.63604L18.364 7.05025L13.4142 12L18.364 16.9497L16.9497 18.364L12 13.4142L7.05025 18.364L5.63604 16.9497L10.5858 12L5.63604 7.05025L7.05025 5.63604L12 10.5858Z"/></svg>Empty</button></template></div>
              <div class="menu-list" @click="pickClick($event, r.index)">
                <template x-for="g in pk.groups" :key="g.label"><div><div class="same-head" x-text="g.label"></div>
                  <template x-for="x in g.items" :key="x.key"><button type="button" class="same-item" :class="x.onClass" :data-game-id="x.key" :disabled="x.taken"><span><span x-text="x.name"></span><template x-if="x.hq"><span class="hqg" role="img" aria-label="High quality"></span></template><span :class="x.pillClass" x-text="x.pillLabel"></span><template x-if="x.unique"><span class="same-lvl" x-text="x.uniqueText"></span></template><span class="pick-subs" x-text="x.line"></span></span><span class="same-lvl" x-text="x.levels"></span></button></template>
                </div></template>
                <template x-if="pk.emptyText"><div class="menu-empty"><span x-text="pk.emptyText"></span> <template x-if="query.trim()"><button type="button" class="linkbtn" @click="query = ''">Clear search</button></template></div></template>
              </div>
              <div class="same-foot" x-text="pk.footText"></div>
            </div></template>
          </div>
          <template x-if="r.shieldNote"><div class="shield-note" :id="`shield-note-${r.index}`" x-text="r.shieldNote"></div></template>

              :data-empty="String(view.rows.food.empty)"

              :aria-expanded="String(mealOpen)"

              @click="toggleMealMenu()"><span><span x-text="view.rows.food.empty ? view.rows.food.emptyText : view.rows.food.name"></span><template x-if="!view.rows.food.empty"><span class="hqg" role="img" aria-label="High quality"></span></template></span><template x-if="view.rows.food.best.count"></template></button>

  <!-- the question before leaving the page with a draft, a running Auto-fill or an Auto-fill result waiting: a native <dialog> only
       while it is asked (x-modal, ui/native-dialog.js); Escape, the X and the backdrop all answer Keep -->
  <template x-if="leaveAsk"><dialog
    class="dlg"
    id="sh-leave"
    x-ref="leave"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="sh-leave-q"
    x-modal="answerLeave('keep')"
    @cancel.prevent="answerLeave('keep')">
      <p class="question" id="sh-leave-q" x-text="leaveQuestion"></p>
      <template x-if="leaveAsk.kind === 'draft'"><div class="dlgbtns"><button type="button" class="primary" id="sh-leave-apply" @click="answerLeave('apply')">Apply and leave</button><button type="button" id="sh-leave-discard" @click="answerLeave('discard')">Discard and leave</button><button type="button" id="sh-leave-keep" x-ref="leaveKeep" @click="answerLeave('keep')">Keep editing</button></div></template>
      <template x-if="leaveAsk.kind === 'running'"><div class="dlgbtns"><button type="button" id="sh-leave-go" @click="answerLeave('leave')">Leave and cancel the Auto-fill</button><button type="button" class="primary" id="sh-leave-keep" x-ref="leaveKeep" @click="answerLeave('keep')">Keep waiting</button></div></template>
      <template x-if="leaveAsk.kind === 'result'"><div class="dlgbtns"><button type="button" id="sh-leave-go" @click="answerLeave('leave')">Leave and discard the result</button><button type="button" class="primary" id="sh-leave-keep" x-ref="leaveKeep" @click="answerLeave('keep')">Keep reviewing</button></div></template>
      <button type="button" class="dlgclose" aria-label="Close" @click="answerLeave('keep')"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 10.5858L16.9497 5.63604L18.364 7.05025L13.4142 12L18.364 16.9497L16.9497 18.364L12 13.4142L7.05025 18.364L5.63604 16.9497L10.5858 12L5.63604 7.05025L7.05025 5.63604L12 10.5858Z"/></svg></button>
  </dialog></template>
