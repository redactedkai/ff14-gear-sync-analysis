<!-- A SET'S PAGE (elements/set-page/set-page.ts): one Lit element, <gsa-set-page>, an island in the Sheets tab. Included once, inside the
     Sheets tab's root in index.html. The template keys it by the set's id (the x-for), so each set gets a page of its own and nothing of
     one set's page outlives it. The wrapper's x-effect gives the element its ports (the store, the solver), the set's id, the page's top
     line and whether a dialog of the tab is open; it listens for the element's `sheet-action` (Edit and Delete of the set, whose dialogs
     are this tab's). x-ignore keeps Alpine out of the markup the element draws. -->
<template x-if="screen === 'set' && setHeader"><div class="sheetsview" id="sh-set">
<template x-for="sid in [$store.sheets.setId]" :key="sid">
<div class="sheets-island" x-effect="Object.assign($el.firstElementChild, { ...setPageProps, setId: sid })" @sheet-action="onSheetAction($event.detail)">
  <gsa-set-page x-ignore></gsa-set-page>
</div>
</template>
</div></template>
