<!-- The Gear browser page (`gear`): title line, filters (with the Expansion and "Gear from" menus), the result table and
     its paging. Included once, from index.html's job template. No keys. -->
<section class="tab" id="tab-browse" role="tabpanel" hidden :hidden="$store.app.tab !== 'browse'">
  <div class="panel" x-data="gear" @keydown.window="slashToSearch($event)">
    <div class="titleline">
      <h2>Gear browser</h2>
      <span class="menu-search big-search"><input type="text" id="b-q" x-ref="search" placeholder="Search gear by name" autocomplete="off" :maxlength="searchMaxLength" aria-label="Search gear by name" x-model.debounce.300ms="$store.app.browse.q"><span class="kbd" x-show="!$store.app.browse.q" title="Press / to search">/</span><button type="button" class="clear" x-show="$store.app.browse.q" x-cloak aria-label="Clear the search" @click="$store.app.browse.q = ''; $refs.search.focus()">×</button></span>
      <span class="count" id="b-count" x-text="view ? view.countText : ''"></span>
    </div>
    <div class="pillline">
    <div class="slotpills" id="b-slots" role="group" aria-label="Slot">
      <template x-for="(p, k) in (view ? view.slots : [])" :key="p.key"><span style="display:contents"><template x-if="p.sep"><span class="sep" aria-hidden="true"></span></template><button type="button" :data-slot="p.key" :class="{ on: $store.app.browse.type === p.key }" :aria-pressed="String($store.app.browse.type === p.key)" :disabled="!p.count && $store.app.browse.type !== p.key" @click="$store.app.browse.type = p.key"><span x-text="p.label"></span><span class="n" x-text="p.count"></span></button></span></template>
    </div>
      <button type="button" class="resetbtn" id="b-reset" :class="{ off: !filtered }" :disabled="!filtered" :aria-hidden="String(!filtered)" title="Reset filters" aria-label="Reset filters" @click="resetBrowseFilters()">Reset</button>
    </div>
    <div class="grid browse-filters">
      <!-- INCLUDE expansion-menu.html id=b -->
      <label class="f"><span>Equip level <span class="f-range" x-text="`1–${$store.app.jobCtx.maxLevel}`"></span></span><input type="number" id="b-lvl" :max="$store.app.jobCtx.maxLevel" inputmode="numeric" x-bind="$num('browse.lvl', 1, Infinity, { empty: '' })"></label>
      <div class="f field ilvl-field"><span id="b-ilvl-label">Item level <span class="f-range" x-text="`1–${$store.app.maxReal}`"></span></span><div class="pair" role="group" aria-labelledby="b-ilvl-label"><input type="number" id="b-min" :max="$store.app.maxReal" inputmode="numeric" placeholder="min" aria-label="Item level min" x-bind="$num('browse.min', 1, Infinity, { empty: '' })"><span aria-hidden="true">–</span><input type="number" id="b-max" :max="$store.app.maxReal" inputmode="numeric" placeholder="max" aria-label="Item level max" x-bind="$num('browse.max', 1, Infinity, { empty: '' })"></div></div>
      <!-- INCLUDE gear-from-menu.html id=b -->
    </div>
    <template x-if="view"><div class="tablekey pageline">
      <nav class="pager" id="b-pages" aria-label="Pages" x-show="view.pageButtons.length"><button type="button" class="step" aria-label="Previous page" :disabled="!view.prevPage" @click="goPage(view.prevPage)">‹</button><template x-for="b in view.pageButtons" :key="b.key"><span style="display:contents"><template x-if="!b.page"><span class="gap" aria-hidden="true">…</span></template><template x-if="b.page"><button type="button" :aria-current="b.current ? 'page' : null" :aria-label="'Page ' + b.page" @click="goPage(b.page)" x-text="b.page"></button></template></span></template><button type="button" class="step" aria-label="Next page" :disabled="!view.nextPage" @click="goPage(view.nextPage)">›</button></nav>
      <p class="small dim" id="b-key" x-show="view.anySynced"><b class="atcap">48</b> maxed on this piece</p>
    </div></template>
    <div class="tablewrap tall" x-ref="rows"><table id="gear-table" @mouseover="$el.dataset.col = $event.target.closest('[data-col]')?.dataset.col ?? ''" @mouseleave="$el.dataset.col = ''">
      <template x-if="view && !view.shown.length"><tbody><tr><td class="empty">No gear matches these filters. <template x-if="filtered"><button type="button" class="linkbtn" @click="resetBrowseFilters()">Reset filters</button></template></td></tr></tbody></template>
      <template x-if="view && view.shown.length"><thead><tr><th :aria-sort="sortState('name')"><button type="button" class="sortbtn" data-sort="name" @click="sortBy('name')">Item</button></th><th>Slot</th><th class="n" data-col="lvl" :aria-sort="sortState('lvl')"><button type="button" class="sortbtn" data-sort="lvl" @click="sortBy('lvl')">Lv</button></th><th class="n" data-col="ilvl" :aria-sort="sortState('ilvl')"><button type="button" class="sortbtn" data-sort="ilvl" @click="sortBy('ilvl')">ilvl</button></th><template x-for="s in jobCtx.stats" :key="s"><th class="n" :data-col="s" :aria-sort="sortState(s)"><button type="button" class="sortbtn" :data-sort="s" :title="`Sort by synced ${jobCtx.label[s]}`" @click="sortBy(s)" x-text="jobCtx.short[s]"></button></th></template></tr></thead></template>
      <template x-if="view && view.shown.length"><tbody>
        <template x-for="x in view.shown" :key="x.key">
          <tr :data-key="x.key" :class="x.rowCls">
            <td><template x-for="(part, j) in x.nameParts" :key="j"><span :class="part.cls" x-text="part.text"></span></template><span class="hqg" role="img" aria-label="High quality" x-show="x.hq"></span></td><td><span x-text="x.slot"></span><span class="x2" title="Not Unique: can be worn on both ring fingers" x-show="x.twice"> ×2</span></td><td class="n dim" data-col="lvl" x-text="x.lvl"></td><td class="n" data-col="ilvl" x-text="x.ilvl"></td>
            <template x-for="c in x.cells" :key="c.col"><td :class="c.cls" :data-col="c.col" :data-was="c.was"><span :title="c.title" x-text="c.text"></span></td></template>
          </tr>
        </template>
      </tbody></template>
    </table></div>
  </div>

</section>
