<!-- The Gear browser page (`gear`): title line (the name search with the Slot menu, the match count, Reset filters), filters (with the
     Expansion and "Gear categories" menus), the result table and its paging. Included once, from index.html's job template. No keys.
     The page is one Lit element, <gsa-gear-browser> (ui/elements/gear-browser/gear-browser.ts), an island: the wrapper's x-effect gives it
     the browser's Job and sync panel, its filters and sort, and whether the tab is open, and the wrapper takes every change of the
     filters or the sort from the element's `browse-edit` event (the detail is the patch for the store's editBrowse); x-ignore keeps
     Alpine out of the markup the element draws. -->
<section class="tab" id="tab-browse" aria-labelledby="b-heading" hidden :hidden="$store.app.tab !== 'browse'">
  <div
    x-effect="$el.firstElementChild.panel = $store.app.panel('browse'); $el.firstElementChild.browse = $store.app.browse; $el.firstElementChild.active = $store.app.tab === 'browse'"
    @browse-edit="$store.app.editBrowse($event.detail)">
    <gsa-gear-browser class="panel" x-ignore></gsa-gear-browser>
  </div>
</section>
