<!-- The Gear browser page (`gear`): title line (the name search with the Slot menu, the match count, Reset filters), filters (with the
     Expansion and "Gear categories" menus), the result table and its paging. Included once, from index.html's job template. No keys. -->
<section class="tab" id="tab-browse" aria-labelledby="b-heading" hidden :hidden="$store.app.tab !== 'browse'">
  <div class="panel" x-data="gear" @keydown.window="slashToSearch($event)">
    <div class="titleline">
      <h2 id="b-heading">Gear browser</h2>
      <div class="searchbar">
        <!-- the Slot menu: a Lit element (an island), given the choices and the chosen slot by x-effect and telling the pick by an event;
             x-ignore keeps Alpine out of the markup the element draws -->
        <div
          class="slot-island"
          x-effect="$el.firstElementChild.choices = view ? view.slots : []; $el.firstElementChild.label = view?.slotLabel; $el.firstElementChild.value = $store.app.browse.type"
          @slot-change="$store.app.editBrowse({ type: $event.detail })">
          <gsa-slot-menu x-ignore></gsa-slot-menu>
        </div>
        <span class="menu-search big-search"><input
          type="text"
          id="b-q"
          x-ref="search"
          placeholder="Search gear by name"
          autocomplete="off"
          :maxlength="searchMaxLength"
          aria-label="Search gear by name"
          x-model.debounce.300ms="search"><span class="kbd" x-show="!$store.app.browse.q">/</span><button
          type="button"
          class="clear"
          x-show="$store.app.browse.q"
          x-cloak
          aria-label="Clear the search"
          @click="$store.app.editBrowse({ q: '' }); $refs.search.focus()">×</button></span>
      </div>
      <span class="count" id="b-count" x-text="view ? view.countText : ''"></span>
      <button
        type="button"
        class="resetbtn"
        id="b-reset"
        :class="{ off: !filtered }"
        :disabled="!filtered"
        :aria-hidden="String(!filtered)"
        title="Reset filters"
        aria-label="Reset filters"
        @click="resetBrowseFilters()">Reset</button>
    </div>
    <div class="grid browse-filters">
      <!-- INCLUDE expansion-menu.html id=b -->
      <label class="f"><span>Equip level <span class="f-range" x-text="`1–${$store.app.jobCtx.maxLevel}`"></span></span><input
        type="number"
        id="b-lvl"
        :max="$store.app.jobCtx.maxLevel"
        inputmode="numeric"
        x-bind="$num('browse.lvl', 1, Infinity, { empty: '' })"></label>
      <div class="f field ilvl-field"><span id="b-ilvl-label">Item level <span class="f-range" x-text="`1–${$store.app.maxReal}`"></span></span><div class="pair" role="group" aria-labelledby="b-ilvl-label"><input
        type="number"
        id="b-min"
        inputmode="numeric"
        placeholder="min"
        aria-label="Item level min"
        x-bind="$num('browse.min', 1, $store.app.maxReal, { empty: '' })"><span aria-hidden="true">–</span><input
        type="number"
        id="b-max"
        inputmode="numeric"
        placeholder="max"
        aria-label="Item level max"
        x-bind="$num('browse.max', 1, $store.app.maxReal, { empty: '' })"></div></div>
      <!-- INCLUDE gear-from-menu.html id=b -->
    </div>
    <template x-if="view"><div class="tablekey pageline">
      <nav class="pager" id="b-pages" aria-label="Pages"><button type="button" class="step" aria-label="Previous page" :disabled="!view.prevPage" @click="goPage(view.prevPage)">‹</button><template x-for="b in view.pageButtons" :key="b.key"><span style="display:contents"><template x-if="!b.page"><span class="gap" aria-hidden="true">…</span></template><template x-if="b.page"><button
        type="button"
        :aria-current="b.current ? 'page' : null"
        :aria-label="'Page ' + b.page"
        @click="goPage(b.page)"
        x-text="b.page"></button></template></span></template><button type="button" class="step" aria-label="Next page" :disabled="!view.nextPage" @click="goPage(view.nextPage)">›</button></nav>
      <p class="small dim" id="b-key" x-show="view.anySynced"><b class="atcap">48</b> max while synced</p>
    </div></template>
    <div class="tablewrap tall" x-ref="rows"><table
      id="gear-table"
      :data-hot="hotCol"
      :data-sorted="$store.app.browse.sort"
      @mouseover="hotCol = $event.target.closest('th[data-col], td[data-col]')?.dataset.col ?? ''"
      @mouseleave="hotCol = ''">
      <template x-if="view && !view.shown.length"><tbody><tr><td class="empty">No gear matches these filters. <template x-if="filtered"><button type="button" class="linkbtn" @click="resetBrowseFilters()">Reset filters</button></template></td></tr></tbody></template>
      <template x-if="view && view.shown.length"><thead><tr><th class="c-slot">Slot</th><th :aria-sort="sortState('name')"><button type="button" class="sortbtn" data-sort="name" @click="sortBy('name')">Item</button></th><th class="n" data-col="lvl" :aria-sort="sortState('lvl')"><button type="button" class="sortbtn" data-sort="lvl" @click="sortBy('lvl')">Lv</button></th><th class="n" data-col="ilvl" :aria-sort="sortState('ilvl')"><button type="button" class="sortbtn" data-sort="ilvl" @click="sortBy('ilvl')">ilvl</button></th><template x-for="s in jobCtx.stats" :key="s"><th class="n" :data-col="s" :aria-sort="sortState(s)"><button type="button" class="sortbtn" :data-sort="s" @click="sortBy(s)" x-text="jobCtx.short[s]"></button></th></template></tr></thead></template>
      <template x-if="view && view.shown.length"><tbody>
        <template x-for="(x, rowPlace) in view.shown" :key="rowPlace">
          <tr :data-key="x.key" :class="x.rowCls">
            <td :title="x.slot"><span class="slotname" x-text="x.slotText"></span><span class="x2" :hidden="!x.twice"> ×2</span></td><td :title="x.nameParts.map(part => part.text).join('')"><template x-for="(part, j) in x.nameParts" :key="j"><span :class="part.cls" x-text="part.text"></span></template><span class="hqg" role="img" aria-label="High quality" :hidden="!x.hq"></span></td><td class="n dim" data-col="lvl" x-text="x.lvl"></td><td class="n" data-col="ilvl" x-text="x.ilvl"></td>
            <template x-for="c in x.cells" :key="c.col"><td :class="c.cls" :data-col="c.col" :data-was="c.was"><span x-text="c.text"></span></td></template>
          </tr>
        </template>
      </tbody></template>
    </table></div>
  </div>

</section>
