<!-- The reason a refused Sheets dialog shows, in the label row of the field it is about (Name, Job, the tick box) or in the title row
     (a reason about no field): an icon (Remix's error-warning-line, as in cap-flag.ts) and the text, a live region. It takes the
     place's text from the dialog view (views/sheet-forms.js errorPlaces), so only the place that has the reason shows.
     {{id}}: the id of the message; {{place}}: the key of `dialogView.errors` (name, job, ack or title). -->
<span class="dlgmsg" id="{{id}}" role="alert" x-show="dialogView.errors.{{place}}">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20ZM11 15H13V17H11V15ZM11 7H13V13H11V7Z"/></svg>
  <span x-text="dialogView.errors.{{place}}"></span>
</span>
