<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" role="img" aria-labelledby="t d">
  <title id="t">Restoring a saved state, field by field</title>
  <desc id="d">Restoring splits the saved settings into one panel per tab (an older save with a single panel gives it to both tabs), starts each tab from the defaults for its own saved job, then takes each saved field only if it has the right type and range; an invalid field falls back to its default and the valid ones are kept. Example from running the code (2026-11-10), a save whose How the math works panel is for Blue Mage (level cap 80) and whose Gear browser panel is for Sage. Tab "pool", an older name, is translated to the Gear browser. The math panel's job Blue Mage is a known job and is kept. Its level 95 becomes 80, clamped to 1 to the job's level cap. Its sync cap 9999 becomes 795, clamped to 1 to 795, the highest real item level. Piece stats slot off-hand becomes head, since Blue Mage has no off-hand. Piece stats substats speed, speed, Critical Hit become speed, none: the repeat and the older third rank are dropped. The Gear browser's job Sage and level 95 are kept. Its sort by Tenacity becomes item level, since Sage has no Tenacity. An older save's Gear optimizer settings are dropped, since a search's settings live on each gear set.</desc>
  <style>
    .bg { fill: #fffdf7; }
    .box { fill: #ece9dd; stroke: #1b2a2c; stroke-width: 1.5; }
    .fg { fill: #1b2a2c; }
    .muted { fill: #586869; }
    .accent { fill: #0d6e72; }
    .bad { fill: #b0402c; }
    .good { fill: #25773a; }
    .flow { fill: none; stroke: #0d6e72; stroke-width: 1.5; }
    .head { fill: #0d6e72; }
    .rule { stroke: #586869; stroke-width: 1; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .t { font-size: 14px; font-weight: 600; }
    .l { font-size: 12px; font-weight: 600; }
    .s { font-size: 12px; }
    .n { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #142023; }
      .box { fill: #1b2b2e; stroke: #e5eeed; }
      .fg { fill: #e5eeed; }
      .muted { fill: #92a5a5; }
      .accent { fill: #4cc2b6; }
      .bad { fill: #f08a74; }
      .good { fill: #6cc788; }
      .flow { stroke: #4cc2b6; }
      .head { fill: #4cc2b6; }
      .rule { stroke: #92a5a5; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="520"/>

  <!-- The steps: four boxes 150 wide, 27 apart -->
  <rect class="box" x="20" y="20" width="150" height="72" rx="4"/>
  <text class="fg t" x="95" y="47" text-anchor="middle">Saved JSON</text>
  <text class="muted s" x="95" y="66" text-anchor="middle">old, from another job,</text>
  <text class="muted s" x="95" y="82" text-anchor="middle">or hand-edited</text>

  <rect class="box" x="197" y="20" width="150" height="72" rx="4"/>
  <text class="fg t" x="272" y="47" text-anchor="middle">One panel per tab</text>
  <text class="muted s" x="272" y="66" text-anchor="middle">an older single panel</text>
  <text class="muted s" x="272" y="82" text-anchor="middle">goes to both tabs</text>

  <rect class="box" x="374" y="20" width="150" height="72" rx="4"/>
  <text class="fg t" x="449" y="47" text-anchor="middle">Defaults per job</text>
  <text class="muted s" x="449" y="66" text-anchor="middle">each tab for its own</text>
  <text class="muted s" x="449" y="82" text-anchor="middle">job (none if unknown)</text>

  <rect class="box" x="551" y="20" width="150" height="72" rx="4"/>
  <text class="fg t" x="626" y="47" text-anchor="middle">Check each field</text>
  <text class="good s" x="626" y="66" text-anchor="middle">right type, range: kept</text>
  <text class="bad s" x="626" y="82" text-anchor="middle">otherwise: its default</text>

  <line class="flow" x1="170" y1="56" x2="195" y2="56" marker-end="url(#arrow)"/>
  <line class="flow" x1="347" y1="56" x2="372" y2="56" marker-end="url(#arrow)"/>
  <line class="flow" x1="524" y1="56" x2="549" y2="56" marker-end="url(#arrow)"/>

  <!-- Example table -->
  <text class="fg t" x="20" y="132">Example: Math tab for Blue Mage (level cap 80), Gear browser for Sage</text>
  <text class="muted l" x="20" y="162">Field</text>
  <text class="muted l" x="170" y="162">Saved</text>
  <text class="muted l" x="350" y="162">Restored</text>
  <text class="muted l" x="470" y="162">Rule</text>
  <line class="rule" x1="20" y1="172" x2="700" y2="172"/>

  <text class="fg s" x="20" y="196">Tab</text>
  <text class="fg s" x="170" y="196">"pool"</text>
  <text class="bad s" x="350" y="196">Gear browser</text>
  <text class="muted s" x="470" y="196">older name translated</text>

  <text class="fg s" x="20" y="226">Math tab: job</text>
  <text class="fg s" x="170" y="226">Blue Mage</text>
  <text class="good s" x="350" y="226">Blue Mage</text>
  <text class="muted s" x="470" y="226">a known job</text>

  <text class="fg s" x="20" y="256">Math tab: level</text>
  <text class="fg n" x="170" y="256">95</text>
  <text class="bad n" x="350" y="256">80</text>
  <text class="muted s" x="470" y="256">clamped to 1 to the job's cap</text>

  <text class="fg s" x="20" y="286">Math tab: sync cap</text>
  <text class="fg n" x="170" y="286">9999</text>
  <text class="bad n" x="350" y="286">795</text>
  <text class="muted s" x="470" y="286">clamped to 1 to 795</text>

  <text class="fg s" x="20" y="316">Piece stats slot</text>
  <text class="fg s" x="170" y="316">off-hand</text>
  <text class="bad s" x="350" y="316">head</text>
  <text class="muted s" x="470" y="316">not a slot this job has</text>

  <text class="fg s" x="20" y="346">Piece stats substats</text>
  <text class="fg s" x="170" y="346">speed, speed, Critical Hit</text>
  <text class="bad s" x="350" y="346">speed, none</text>
  <text class="muted s" x="470" y="346">repeat, old third rank dropped</text>

  <text class="fg s" x="20" y="376">Browser: job, level</text>
  <text class="fg s" x="170" y="376">Sage, 95</text>
  <text class="good s" x="350" y="376">Sage, 95</text>
  <text class="muted s" x="470" y="376">its own job, level cap 100</text>

  <text class="fg s" x="20" y="406">Browser: sort</text>
  <text class="fg s" x="170" y="406">Tenacity</text>
  <text class="bad s" x="350" y="406">item level</text>
  <text class="muted s" x="470" y="406">not a column this job has</text>

  <text class="fg s" x="20" y="436">Gear optimizer settings</text>
  <text class="fg s" x="170" y="436">target: special substat</text>
  <text class="bad s" x="350" y="436">dropped</text>
  <text class="muted s" x="470" y="436">a set holds its own search</text>

  <line class="rule" x1="20" y1="452" x2="700" y2="452"/>
  <text class="muted s" x="20" y="474">Kept values in green; changed ones in red. From running the code, 2026-11-10.</text>
</svg>
