<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" aria-label="Step chart of the GCD against gear speed at level 50, from 2.50 s at 0 down to 2.15 s at 360, with the generic maximum under cap 123 marked at 296 (2.22 s) and 344 (2.17 s)">
<desc>Level 50, no haste. The GCD drops one 0.01 s step at a time: 2.50 s at gear speed 0, 2.49 s from 3, 2.35 s from 150, 2.30 s from 202, 2.22 s from 286, 2.21 s from 297, 2.20 s from 307, 2.16 s from 349. After 3, a new step starts about every 10.5 points. The generic maximum under cap 123, every armor and accessory slot at its speed cap (3 × 29 + 2 × 47 + 5 × 23), is 296: 2.22 s, one point below the 2.21 s step at 297. With the weapon too (48) it is 344: 2.17 s.</desc>
<style>
  .bg { fill: #fffdf7; }
  .box { fill: #ece9dd; stroke: #1b2a2c; stroke-width: 1.5; }
  .goodbox { fill: #ece9dd; stroke: #25773a; stroke-width: 1.5; }
  .clampbox { fill: #ece9dd; stroke: #b0402c; stroke-width: 1.5; }
  .fg { fill: #1b2a2c; }
  .muted { fill: #586869; }
  .accent { fill: #0d6e72; }
  .gold { fill: #8f5f0c; }
  .bad { fill: #b0402c; }
  .good { fill: #25773a; }
  .s-muted { stroke: #586869; }
  .s-accent { stroke: #0d6e72; }
  .s-gold { stroke: #8f5f0c; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
  .num { font-family: ui-monospace, Consolas, monospace; }
  .small { font-size: 12px; }
  .title { font-size: 16px; font-weight: 600; }
  .strong { font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #142023; }
    .box { fill: #1b2b2e; stroke: #e5eeed; }
    .goodbox { fill: #1b2b2e; stroke: #6cc788; }
    .clampbox { fill: #1b2b2e; stroke: #f08a74; }
    .fg { fill: #e5eeed; }
    .muted { fill: #92a5a5; }
    .accent { fill: #4cc2b6; }
    .gold { fill: #e2b659; }
    .bad { fill: #f08a74; }
    .good { fill: #6cc788; }
    .s-muted { stroke: #92a5a5; }
    .s-accent { stroke: #4cc2b6; }
    .s-gold { stroke: #e2b659; }
  }
</style>
