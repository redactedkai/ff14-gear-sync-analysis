    .bg { fill: #fffdf7; }
    .box { fill: #ece9dd; stroke: #1b2a2c; stroke-width: 1.5; }
    .on { fill: #ece9dd; stroke: #0d6e72; stroke-width: 2; }
    .fg { fill: #1b2a2c; }
    .muted { fill: #586869; }
    .accent { fill: #0d6e72; }
    .bad { fill: #b0402c; }
    .flow { fill: none; stroke: #0d6e72; stroke-width: 1.5; }
    .head { fill: #0d6e72; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
    .s { font-size: 12px; }
    .h { font-size: 14px; font-weight: 600; }
    .num { font-family: ui-monospace, Consolas, monospace; font-size: 14px; }
    .nums { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #142023; }
      .box { fill: #1b2b2e; stroke: #e5eeed; }
      .on { fill: #1b2b2e; stroke: #4cc2b6; }
      .fg { fill: #e5eeed; }
      .muted { fill: #92a5a5; }
      .accent { fill: #4cc2b6; }
      .bad { fill: #f08a74; }
      .flow { stroke: #4cc2b6; }
      .head { fill: #4cc2b6; }
    }
  </style>
