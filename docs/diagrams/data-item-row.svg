  <text class="muted nums" x="668.0" y="536" text-anchor="middle">id 46</text>
  <text class="fg h" x="20" y="574">Job mask: bit i is set when job i (in the shared job order) can equip the item</text>
  <text class="muted s" x="20" y="594">Category 64 lists CNJ WHM SCH AST SGE. CNJ is a base class, not one of the 22 jobs, so it sets no bit.</text>
  <text class="muted s" x="45.0" y="614" text-anchor="middle">PLD</text>
  <rect class="box" x="32.0" y="638" width="26" height="30" rx="6"/>
