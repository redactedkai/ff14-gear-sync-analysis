  <rect class="box" x="586.0" y="466" width="52" height="52" rx="8"/>
  <text class="muted s" x="612.0" y="486" text-anchor="middle">sks</text>
  <text class="muted num" x="612.0" y="508" text-anchor="middle">0</text>
  <text class="muted nums" x="612.0" y="536" text-anchor="middle">id 45</text>
  <rect class="on" x="642.0" y="466" width="52" height="52" rx="8"/>
  <text class="muted s" x="668.0" y="486" text-anchor="middle">sps</text>
