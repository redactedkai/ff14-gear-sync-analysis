<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 736" role="img" aria-labelledby="t d">
  <title id="t">How one Item sheet row becomes an item database row</title>
  <desc id="d">Worked example with Void Ark Helm of Fending, a tank head piece. Each Item sheet column on the left maps to a field of the database row on the right: name copied, equip slot category 3 becomes slot code 3 (head), item level 200 kept because it is at least 100, equip level 60 copied, job category 59 becomes job mask 15, four stat id and value pairs are placed into a 14-position stat vector, the HQ bonus is skipped because the item cannot be high quality, and the Unique flag becomes 1. The row has more fields after these (gear groups, stat factor kind, materia slots, rarity; data-pipeline.md section 4). Below, the 14 stat positions (the 12 named stats, then the generic Main and Secondary Attribute) with their BaseParam ids and values, and the 22 job bits with PLD, WAR, DRK and GNB set.</desc>
