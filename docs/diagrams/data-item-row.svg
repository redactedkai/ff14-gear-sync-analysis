  <text class="muted s" x="108.0" y="486" text-anchor="middle">dex</text>
  <text class="muted num" x="108.0" y="508" text-anchor="middle">0</text>
  <text class="muted nums" x="108.0" y="536" text-anchor="middle">id 2</text>
