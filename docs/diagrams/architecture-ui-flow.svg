<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t d">
  <title id="t">How data moves through the page at run time</title>
  <desc id="d">At page load the saved state is read from browser storage, checked and repaired, and becomes the shared store. When a store field changes, every component effect that read it runs again: it calls the core logic, which reads the item database outside reactive state, and derives a frozen view. The template displays the view. User input calls store actions, which change the store and start the cycle again. Separately, the store is saved back to browser storage 150 ms after the last change.</desc>
  <style>
    .bg { fill: #fffdf7; }
    .box { fill: #ece9dd; stroke: #1b2a2c; stroke-width: 1.5; }
    .hub { fill: #ece9dd; stroke: #0d6e72; stroke-width: 1.5; }
    .fg { fill: #1b2a2c; }
    .muted { fill: #586869; }
    .accent { fill: #0d6e72; }
    .flow { fill: none; stroke: #0d6e72; stroke-width: 1.5; }
    .head { fill: #0d6e72; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .t { font-size: 14px; font-weight: 600; }
    .s { font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #142023; }
      .box { fill: #1b2b2e; stroke: #e5eeed; }
      .hub { fill: #1b2b2e; stroke: #4cc2b6; }
      .fg { fill: #e5eeed; }
      .muted { fill: #92a5a5; }
      .accent { fill: #4cc2b6; }
      .flow { stroke: #4cc2b6; }
      .head { fill: #4cc2b6; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="440"/>

  <!-- Row 1 -->
  <rect class="box" x="20" y="30" width="180" height="72" rx="8"/>
  <text class="fg t" x="110" y="57" text-anchor="middle">Browser storage</text>
  <text class="muted s" x="110" y="76" text-anchor="middle">one saved state under</text>
  <text class="muted s" x="110" y="92" text-anchor="middle">a versioned key</text>

  <rect class="box" x="520" y="30" width="180" height="72" rx="8"/>
  <text class="fg t" x="610" y="57" text-anchor="middle">Core logic</text>
  <text class="muted s" x="610" y="76" text-anchor="middle">item database kept</text>
  <text class="muted s" x="610" y="92" text-anchor="middle">outside reactive state</text>

  <!-- Row 2 -->
  <rect class="box" x="20" y="152" width="180" height="120" rx="8"/>
  <text class="fg t" x="110" y="182" text-anchor="middle">Restore and repair</text>
  <text class="muted s" x="110" y="204" text-anchor="middle">check type and range</text>
  <text class="muted s" x="110" y="220" text-anchor="middle">of every field; a bad</text>
  <text class="muted s" x="110" y="236" text-anchor="middle">value falls back to</text>
  <text class="muted s" x="110" y="252" text-anchor="middle">its default</text>

  <rect class="hub" x="270" y="152" width="180" height="120" rx="8"/>
  <text class="accent t" x="360" y="182" text-anchor="middle">Shared store</text>
  <text class="muted s" x="360" y="212" text-anchor="middle">saved settings</text>
  <text class="muted s" x="360" y="228" text-anchor="middle">current job context</text>
  <text class="muted s" x="360" y="244" text-anchor="middle">actions</text>

  <rect class="box" x="520" y="152" width="180" height="120" rx="8"/>
  <text class="fg t" x="610" y="182" text-anchor="middle">Component effect</text>
  <text class="muted s" x="610" y="204" text-anchor="middle">reads the fields it needs</text>
  <text class="muted s" x="610" y="220" text-anchor="middle">and derives its view;</text>
  <text class="muted s" x="610" y="236" text-anchor="middle">heavy work is debounced</text>
  <text class="muted s" x="610" y="252" text-anchor="middle">and waits for its tab</text>

  <!-- Row 3 -->
  <rect class="box" x="270" y="338" width="180" height="72" rx="8"/>
  <text class="fg t" x="360" y="365" text-anchor="middle">User input</text>
  <text class="muted s" x="360" y="384" text-anchor="middle">edits, clicks,</text>
  <text class="muted s" x="360" y="400" text-anchor="middle">job change</text>

  <rect class="box" x="520" y="338" width="180" height="72" rx="8"/>
  <text class="fg t" x="610" y="365" text-anchor="middle">Template</text>
  <text class="muted s" x="610" y="384" text-anchor="middle">displays the view,</text>
  <text class="muted s" x="610" y="400" text-anchor="middle">no math of its own</text>

  <!-- arrows -->
  <line class="flow" x1="110" y1="102" x2="110" y2="150" marker-end="url(#arrow)"/>
  <text class="muted s" x="120" y="131">page load</text>

  <line class="flow" x1="200" y1="212" x2="268" y2="212" marker-end="url(#arrow)"/>

  <path class="flow" d="M360,152 V66 H202" marker-end="url(#arrow)"/>
  <text class="muted s" x="216" y="58">saved 150 ms after the last change</text>

  <line class="flow" x1="450" y1="212" x2="518" y2="212" marker-end="url(#arrow)"/>
  <text class="muted s" x="484" y="202" text-anchor="middle">change</text>

  <line class="flow" x1="610" y1="152" x2="610" y2="104" marker-end="url(#arrow)"/>
  <text class="muted s" x="620" y="131">calls</text>

  <line class="flow" x1="610" y1="272" x2="610" y2="336" marker-end="url(#arrow)"/>
  <text class="muted s" x="620" y="308">frozen view</text>

  <line class="flow" x1="520" y1="374" x2="452" y2="374" marker-end="url(#arrow)"/>

  <line class="flow" x1="360" y1="338" x2="360" y2="274" marker-end="url(#arrow)"/>
  <text class="muted s" x="370" y="308">action</text>
</svg>
