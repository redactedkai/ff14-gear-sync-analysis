<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="A small branch-and-bound search tree over head, body and neck. The first descent finds a total of 43; body B2 and head H2 are pruned because their upper bound cannot beat 43. Seven nodes are visited out of fifteen.">
<style>
  .bg { fill: #fffdf7; }
  .box { fill: #ece9dd; stroke: #1b2a2c; stroke-width: 1.5; }
  .box-good { fill: #ece9dd; stroke: #25773a; stroke-width: 1.5; }
  .box-bad { fill: #ece9dd; stroke: #b0402c; stroke-width: 1.5; stroke-dasharray: 5 4; }
  .box-accent { fill: #ece9dd; stroke: #0d6e72; stroke-width: 1.5; }
  .fg { fill: #1b2a2c; }
  .muted { fill: #586869; }
  .accent { fill: #0d6e72; }
  .gold { fill: #8f5f0c; }
  .bad { fill: #b0402c; }
  .good { fill: #25773a; }
  .s-fg { stroke: #1b2a2c; }
  .s-muted { stroke: #586869; }
  .s-accent { stroke: #0d6e72; }
  .s-bad { stroke: #b0402c; }
  .s-good { stroke: #25773a; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
  .num { font-family: ui-monospace, Consolas, monospace; }
  .small { font-size: 12px; }
  .title { font-size: 16px; font-weight: 600; }
  .b { font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #142023; }
    .box { fill: #1b2b2e; stroke: #e5eeed; }
    .box-good { fill: #1b2b2e; stroke: #6cc788; }
    .box-bad { fill: #1b2b2e; stroke: #f08a74; }
    .box-accent { fill: #1b2b2e; stroke: #4cc2b6; }
    .fg { fill: #e5eeed; }
    .muted { fill: #92a5a5; }
    .accent { fill: #4cc2b6; }
    .gold { fill: #e2b659; }
    .bad { fill: #f08a74; }
    .good { fill: #6cc788; }
    .s-fg { stroke: #e5eeed; }
    .s-muted { stroke: #92a5a5; }
    .s-accent { stroke: #4cc2b6; }
    .s-bad { stroke: #f08a74; }
    .s-good { stroke: #6cc788; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="muted"/>
  </marker>
</defs>

<rect class="bg" x="0" y="0" width="720" height="480"/>
<text class="title fg" x="20" y="30">Branch and bound on a three-slot pool</text>
<text class="small muted" x="20" y="52">Nodes are numbered in visit order. Bound = total so far + best still possible in the remaining slots.</text>
<rect class="box" x="20" y="90" width="160" height="232" rx="8"/>
<text class="small b muted" x="34" y="114">Item</text><text class="small b muted" x="166" y="114" text-anchor="end">target stat</text>
<text class="small muted" x="34" y="142">Head</text><text class="fg" x="80" y="142">H1</text><text class="num gold" x="166" y="142" text-anchor="end">20</text>
<text class="small muted" x="34" y="170"></text><text class="fg" x="80" y="170">H2</text><text class="num gold" x="166" y="170" text-anchor="end">12</text>
<line class="s-muted" x1="30" y1="180" x2="170" y2="180" stroke-width="1"/>
<text class="small muted" x="34" y="198">Body</text><text class="fg" x="80" y="198">B1</text><text class="num gold" x="166" y="198" text-anchor="end">15</text>
<text class="small muted" x="34" y="226"></text><text class="fg" x="80" y="226">B2</text><text class="num gold" x="166" y="226" text-anchor="end">14</text>
<line class="s-muted" x1="30" y1="236" x2="170" y2="236" stroke-width="1"/>
<text class="small muted" x="34" y="254">Neck</text><text class="fg" x="80" y="254">N1</text><text class="num gold" x="166" y="254" text-anchor="end">8</text>
<text class="small muted" x="34" y="282"></text><text class="fg" x="80" y="282">N2</text><text class="num gold" x="166" y="282" text-anchor="end">6</text>
<line class="s-muted" x1="536" y1="134" x2="436" y2="167" stroke-width="1.5" marker-end="url(#arrow)"/>
<line class="s-muted" x1="536" y1="134" x2="626" y2="167" stroke-width="1.5" marker-end="url(#arrow)"/>
<line class="s-muted" x1="436" y1="224" x2="337" y2="257" stroke-width="1.5" marker-end="url(#arrow)"/>
<line class="s-muted" x1="436" y1="224" x2="540" y2="257" stroke-width="1.5" marker-end="url(#arrow)"/>
<line class="s-muted" x1="337" y1="314" x2="268" y2="347" stroke-width="1.5" marker-end="url(#arrow)"/>
<line class="s-muted" x1="337" y1="314" x2="430" y2="347" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="box" x="461.0" y="80" width="150" height="54" rx="8"/>
<text class="fg b" x="473.0" y="102">1 · start</text>
<text class="small muted" x="473.0" y="122">bound 0 + 43 = 43</text>
<rect class="box" x="361.0" y="170" width="150" height="54" rx="8"/>
<text class="fg b" x="373.0" y="192">2 · Head H1</text>
<text class="small muted" x="373.0" y="212">bound 20 + 23 = 43</text>
<rect class="box-bad" x="551.0" y="170" width="150" height="54" rx="8"/>
<text class="fg b" x="563.0" y="192">7 · Head H2</text>
<text class="small bad" x="563.0" y="212">pruned: 12 + 23 ≤ 43</text>
<rect class="box" x="262.0" y="260" width="150" height="54" rx="8"/>
<text class="fg b" x="274.0" y="282">3 · Body B1</text>
<text class="small muted" x="274.0" y="302">bound 35 + 8 = 43</text>
<rect class="box-bad" x="465.0" y="260" width="150" height="54" rx="8"/>
<text class="fg b" x="477.0" y="282">6 · Body B2</text>
<text class="small bad" x="477.0" y="302">pruned: 34 + 8 ≤ 43</text>
<rect class="box-good" x="193.0" y="350" width="150" height="54" rx="8"/>
<text class="fg b" x="205.0" y="372">4 · Neck N1</text>
<text class="small good" x="205.0" y="392">total 43: new best</text>
<rect class="box" x="355.0" y="350" width="150" height="54" rx="8"/>
<text class="fg b" x="367.0" y="372">5 · Neck N2</text>
<text class="small muted" x="367.0" y="392">total 41: not better</text>
<text class="small muted" x="20" y="430">H2, B2 and N2 each also carry 5 of another stat, so no item is beaten on every dimension and none is pruned beforehand.</text>
<text class="small muted" x="20" y="450">The search visits 7 of the 15 possible nodes (8 complete loadouts). Result: H1 + B1 + N1 = 43.</text>
</svg>
