<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t d">
  <title id="t">Pareto fronts on a toy example</title>
  <desc id="d">Three slots, A, B and C, two pieces each, written (score, Determination), with a minimum of 100 Determination. From the last slot back: after C the front holds c1 (25, 40) and c2 (10, 45). After B it holds b1+c1 (55, 40), b2+c1 (45, 90) and b2+c2 (30, 95); b1+c2 (40, 45) is dropped because b2+c1 beats it on both. After A, Determination past 100 counts as 100: a1+b1+c1 (105, 50) is kept but below the minimum, a1+b2+c1 (95, 100) is the best set meeting it, and the entries it beats are dropped.</desc>
  <style>
    .bg { fill: #fffdf7; }
    .box { fill: #ece9dd; stroke: #1b2a2c; stroke-width: 1.5; }
    .fg { fill: #1b2a2c; }
    .muted { fill: #586869; }
    .accent { fill: #0d6e72; }
    .accentStroke { stroke: #0d6e72; stroke-width: 1.5; fill: none; }
    .bad { fill: #b0402c; }
    .badStroke { stroke: #b0402c; stroke-width: 1.5; }
    .good { fill: #25773a; }
    .goodStroke { stroke: #25773a; stroke-width: 2; fill: none; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
    .small { font-size: 13px; }
    .title { font-size: 16px; font-weight: 600; }
    .head { font-weight: 600; }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #142023; }
      .box { fill: #1b2b2e; stroke: #e5eeed; }
      .fg { fill: #e5eeed; }
      .muted { fill: #92a5a5; }
      .accent { fill: #4cc2b6; }
      .accentStroke { stroke: #4cc2b6; }
      .bad { fill: #f08a74; }
      .badStroke { stroke: #f08a74; }
      .good { fill: #6cc788; }
      .goodStroke { stroke: #6cc788; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="accent"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="470"/>

  <text class="fg title" x="40" y="36">Pareto fronts: from the last slot back, keep only what nothing beats</text>
  <text class="muted small" x="40" y="58">A toy example. Pieces as (score, Determination); the set needs Determination ≥ 100.</text>
  <text class="mono fg" x="40" y="84">A: a1 (50, 10), a2 (40, 60)</text>
  <text class="mono fg" x="266" y="84">B: b1 (30, 0), b2 (20, 50)</text>
  <text class="mono fg" x="492" y="84">C: c1 (25, 40), c2 (10, 45)</text>

  <!-- column 1: after C -->
  <rect class="box" x="40" y="104" width="190" height="300" rx="8"/>
  <text class="fg head" x="58" y="130">After C</text>
  <text class="mono fg" x="58" y="160">c1      (25, 40)</text>
  <text class="mono fg" x="58" y="184">c2      (10, 45)</text>
  <text class="muted small" x="58" y="384">Neither beats the other.</text>

  <path class="accentStroke" d="M232,250 L262,250" marker-end="url(#arrow)"/>

  <!-- column 2: after B -->
  <rect class="box" x="266" y="104" width="190" height="300" rx="8"/>
  <text class="fg head" x="284" y="130">After B</text>
  <text class="mono fg" x="284" y="160">b1+c1   (55, 40)</text>
  <text class="mono bad" x="284" y="184">b1+c2   (40, 45)</text>
  <line class="badStroke" x1="282" y1="179" x2="420" y2="179"/>
  <text class="mono fg" x="284" y="208">b2+c1   (45, 90)</text>
  <text class="mono fg" x="284" y="232">b2+c2   (30, 95)</text>
  <text class="bad small" x="284" y="356">b1+c2: b2+c1 has more</text>
  <text class="bad small" x="284" y="374">score and Determination.</text>
  <text class="muted small" x="284" y="394">3 kept of 4.</text>

  <path class="accentStroke" d="M458,250 L488,250" marker-end="url(#arrow)"/>

  <!-- column 3: after A -->
  <rect class="box" x="492" y="104" width="188" height="300" rx="8"/>
  <text class="fg head" x="508" y="130">After A</text>
  <text class="mono fg" x="508" y="160">a1+b1+c1 (105, 50)</text>
  <rect class="goodStroke" x="502" y="168" width="170" height="22" rx="4"/>
  <text class="mono good" x="508" y="184">a1+b2+c1  (95, 100)</text>
  <text class="mono bad" x="508" y="208">a2+b1+c1  (95, 100)</text>
  <line class="badStroke" x1="506" y1="203" x2="670" y2="203"/>
  <text class="mono bad" x="508" y="232">a2+b2+c1  (85, 100)</text>
  <line class="badStroke" x1="506" y1="227" x2="670" y2="227"/>
  <text class="mono bad" x="508" y="256">a1+b2+c2  (80, 100)</text>
  <line class="badStroke" x1="506" y1="251" x2="670" y2="251"/>
  <text class="mono bad" x="508" y="280">a2+b2+c2  (70, 100)</text>
  <line class="badStroke" x1="506" y1="275" x2="670" y2="275"/>
  <text class="muted small" x="508" y="338">Past 100 counts as 100,</text>
  <text class="muted small" x="508" y="356">so the 95 beats the rest;</text>
  <text class="muted small" x="508" y="374">105 misses the minimum.</text>
  <text class="good small" x="508" y="394">Best: 95, proven.</text>

  <text class="muted small" x="40" y="440">Every set is either in the last front or was dropped for one at least as good on everything that matters,</text>
  <text class="muted small" x="40" y="458">so the best set meeting the minimum is in the last front: no search tree, no separate proof.</text>
</svg>
