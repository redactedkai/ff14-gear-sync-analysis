# Tool configuration only; the Python scripts are not a package.
[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["./data", "./dist", "./node_modules", "./docs/scratchpad"]

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"

[tool.ruff.lint]
# pyflakes, pycodestyle errors/warnings, import order, bugbear, pyupgrade, then: Ruff-specific, simplify, comprehensions,
# flake8-pie, perflint, flynt, refurb, pylint (errors and warnings), pathlib, blind except, naive datetimes, pygrep hooks,
# debugger calls, implicit string concatenation, raise and logging checks, and open() without an encoding (PLW1514, a
# preview rule: explicit-preview-rules below keeps every other preview rule off)
select = [
  "F", "E", "W", "I", "B", "UP",
  "RUF", "SIM", "C4", "PIE", "PERF", "FLY", "FURB", "PLE", "PLW", "PTH",
  "BLE", "DTZ", "PGH", "T10", "ISC", "RSE", "LOG", "PLW1514",
]
preview = true
explicit-preview-rules = true

[tool.pyrefly]
# The data scripts and their tests import their neighbours by bare name.
search-path = ["scripts/data", "tests/data"]
python-version = "3.11"
