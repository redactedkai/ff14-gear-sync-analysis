# Run `npm run check` and the Python checks (on Python 3.11, the oldest supported, and 3.13) on every push to dev or main and on pull requests; publish
# dist/index.html to GitHub Pages only on a push to main (or by hand) after every check passes.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# Actions are pinned to full commit SHAs, with the release in the trailing comment.
name: Check and deploy to GitHub Pages

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels an older run of the same branch, except on main: cancelling there could stop a deploy halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Playwright's three engines (the page's smoke test uses Chromium; the component stories run in all three), cached by
      # the Playwright version in package-lock.json. On a cache hit only the system packages they need are installed (they
      # live outside the cache).
      - id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-firefox-webkit
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      # lint, typecheck, build, unit tests, the component stories in Chromium and the browser smoke test; a failure stops the deploy
      - run: npm run check
      # `check` stops at its first failing step; when it fails, the smoke test runs alone as well, so its result is not hidden
      # behind an earlier failure (the build it needs is already there)
      - if: failure()
        run: npm run test:smoke
      # the component stories in Chromium, Firefox and WebKit (check ran them in Chromium only)
      - run: npm run test:stories:all
      # the long random sweep of tier ranking against its reference (tests/sweep/), kept out of npm test for speed
      - run: node --test "tests/sweep/*.test.ts"
      # the stories' traces, screenshots and error notes, and the smoke test's output, to see what failed on this runner
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-failure-output
          path: |
            tests/stories/out/
            tests/e2e/out/
          retention-days: 7
          if-no-files-found: ignore
      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Ruff and the data generator tests on the oldest supported Python and on .python-version's; they run on
  # fixtures, with no network and no data/ folder. Node runs only scripts/py.ts here, so no npm ci.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: npm run lint:py
      - run: npm run test:py

  deploy:
    needs: [check, python]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
